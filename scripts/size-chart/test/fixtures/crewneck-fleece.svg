<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2180" viewBox="0 0 1600 2180"><defs><linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#071e3f"/><stop offset="1" stop-color="#05162e"/></linearGradient><linearGradient id="garmentGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#17427e"/><stop offset="0.55" stop-color="#0f3462"/><stop offset="1" stop-color="#0a2748"/></linearGradient></defs><rect width="1600" height="2180" fill="url(#bgGrad)"/><text x="110" y="150" font-family="Inter" font-weight="700" font-size="30" fill="#3aa0e6" text-anchor="start" letter-spacing="6">SAPPHIRE SHADOW STUDIO</text><text x="110" y="250" font-family="Inter" font-weight="800" font-size="92" fill="#ffffff" text-anchor="start">Size Guide</text><text x="110" y="312" font-family="Inter" font-weight="400" font-size="34" fill="#c9d8ea" text-anchor="start">Unisex Crewneck Fleece</text><line x1="110" y1="356" x2="1490" y2="356" stroke="#007dd5" stroke-width="3"/><rect x="110" y="408" width="1380" height="448" rx="18" fill="#0c2c56" fill-opacity="0.4" stroke="#007dd5" stroke-opacity="0.5" stroke-width="2"/><rect x="110" y="422" width="6" height="420" rx="3" fill="#007dd5"/><text x="156" y="460" font-family="Inter" font-weight="700" font-size="25" fill="#3aa0e6" text-anchor="start" letter-spacing="5">START HERE</text><text x="156" y="514" font-family="Inter" font-weight="800" font-size="44" fill="#ffffff" text-anchor="start">How to Find Your Perfect Fit</text><text x="156" y="556" font-family="Inter" font-weight="400" font-size="25" fill="#c9d8ea" text-anchor="start">Every measurement in this guide is of the garment laid flat, not your body.</text><circle cx="178" cy="626" r="22" fill="#007dd5"/><text x="178" y="635" font-family="Inter" font-weight="800" font-size="26" fill="#ffffff" text-anchor="middle">1</text><text x="156" y="688" font-family="Inter" font-weight="700" font-size="26" fill="#ffffff" text-anchor="start">Grab a sweatshirt you love</text><text x="156" y="726" font-family="Inter" font-weight="400" font-size="23" fill="#c9d8ea" text-anchor="start">One you already own that fits how</text><text x="156" y="756" font-family="Inter" font-weight="400" font-size="23" fill="#c9d8ea" text-anchor="start">you want. Lay it flat.</text><circle cx="607.3333333333333" cy="626" r="22" fill="#007dd5"/><text x="607.3333333333333" y="635" font-family="Inter" font-weight="800" font-size="26" fill="#ffffff" text-anchor="middle">2</text><text x="585.3333333333333" y="688" font-family="Inter" font-weight="700" font-size="26" fill="#ffffff" text-anchor="start">Measure and compare</text><text x="585.3333333333333" y="726" font-family="Inter" font-weight="400" font-size="23" fill="#c9d8ea" text-anchor="start">Match it to the chart below.</text><text x="585.3333333333333" y="756" font-family="Inter" font-weight="400" font-size="23" fill="#c9d8ea" text-anchor="start">Chest decides your size.</text><circle cx="1036.6666666666665" cy="626" r="22" fill="#007dd5"/><text x="1036.6666666666665" y="635" font-family="Inter" font-weight="800" font-size="26" fill="#ffffff" text-anchor="middle">3</text><text x="1014.6666666666666" y="688" font-family="Inter" font-weight="700" font-size="26" fill="#ffffff" text-anchor="start">Pick your size</text><text x="1014.6666666666666" y="726" font-family="Inter" font-weight="400" font-size="23" fill="#c9d8ea" text-anchor="start">Between two? These run a standard</text><text x="1014.6666666666666" y="756" font-family="Inter" font-weight="400" font-size="23" fill="#c9d8ea" text-anchor="start">unisex fit: size up for room, or</text><text x="1014.6666666666666" y="786" font-family="Inter" font-weight="400" font-size="23" fill="#c9d8ea" text-anchor="start">down for a closer fit.</text><g transform="translate(110,716) scale(1.25)"><ellipse cx="280" cy="516" rx="150" ry="16" fill="#030b1a" opacity="0.45"/><path d="M238,152 Q280,192 322,152 Q356,150 384,158 Q472,250 512,384 Q516,398 470,430 