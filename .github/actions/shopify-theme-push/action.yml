name: Shopify theme push
description: |
  Push the working tree to a Shopify theme. Three modes:
  - mode: live  - assert live theme ID, push to live with retry+per-attempt timeout, smoke-test storefront paths.
  - mode: preview  - look up or create the per-PR pr-N-preview theme, push to it, expose preview URLs.
  - mode: delete-preview  - delete the per-PR pr-N-preview theme. Tolerates "no matching theme" silently
    (exit 0); only real Shopify API / auth failures exit non-zero so token rotation surfaces loudly.

  Outputs are designed for the parent workflow's success/failure ladder.
  push-output is ANSI-stripped and token-redacted before exposure.

  Every push (live and preview alike) is audited afterwards by
  check-push-rejections.mjs: `shopify theme push` exits 0 even when Shopify
  refused individual assets, so a zero exit is not on its own evidence that the
  theme was updated. A rejection fails the step with exit 97, naming the file
  and Shopify's reason.

inputs:
  mode:
    description: live, preview, or delete-preview
    required: true
  shopify-cli-theme-token:
    description: Shopify CLI theme token (Admin API access token, sourced from a repo-level secret).
    required: true
  shopify-flag-store:
    description: |
      Store's internal myshopify handle (e.g. `yr5ye0-ua.myshopify.com`), not
      the friendly admin alias (`sapphire-shadow-studio.myshopify.com`).
      Shopify's auth layer rejects the alias with 401; only the internal
      handle is recognised. Sourced from a repo-level variable (the handle is
      observable from any storefront response and is not credential material).
    required: true
  live-theme-id:
    description: Expected live theme ID (required when mode=live; ignored otherwise)
    required: false
    default: ""
  pr-number:
    description: PR number for pr-N-preview naming (required when mode=preview or mode=delete-preview; ignored otherwise)
    required: false
    default: ""
  smoke-paths:
    description: |
      Space-separated STRUCTURAL storefront paths to smoke-test after live push
      (homepage, cart, all-products collection, search, refund policy). These
      verify the deploy landed (200 + host + live theme-id). Product pages are
      NOT listed here; the smoke enumerates every published product from the
      sitemap and probes each, so the catalog is covered automatically without a
      maintained handle list.

      /policies/refund-policy stands in for all five shop policies. Shopify
      renders them itself (no policy template type exists), but they render
      inside layout/theme.liquid, whose policy guard hosts the restyle and jump
      nav, so a Liquid error there takes all five down at once, including the
      page the Organization JSON-LD's hasMerchantReturnPolicy points at. The
      sitemap does not list policy pages, so nothing else here would notice. A
      404 on this path usually means an emptied Admin policy body rather than
      broken Liquid. Any path here starting /policies/ additionally has its
      response body checked for the jump-nav custom element, since a snippet
      that stops rendering leaves the status, host and theme-id all green. That
      check is a SOFT-WARN, never a HARD-FAIL, so a rollback to a theme
      predating the snippet is not blocked by it. It is not free, though: a
      SOFT-WARN is not a PASS, and the run still needs at least one verified
      PASS overall, so narrowing this list to a single policy path and then
      rolling back would exit 1 on that rule. See docs/smoke-test-reference.md.
    required: false
    default: "/ /cart /collections/all /search /policies/refund-policy"
  smoke-base-url:
    description: |
      Canonical storefront origin to smoke-test (scheme + host, no trailing slash),
      e.g. https://sapphireshadowstudio.com. When set, smoke probes follow redirects
      and assert that (a) the final HTTP status is 200 AND (b) the final URL stays
      on the same host (no cross-host hop). Set this when the storefront has a
      primary custom domain that the myshopify URL 301s to; otherwise probes hit
      the redirect and fail. When empty, the legacy no-follow probe of
      `https://${SHOPIFY_FLAG_STORE}` is used.
    required: false
    default: ""
  storefront-password:
    description: |
      Storefront password (live mode only; optional). Enables locked-mode
      content probing: the smoke authenticates the password gate and probes real
      pages while the store is pre-launch. Sourced from a repo-level SECRET (it
      grants read access to gated pre-launch content). When absent, the smoke
      soft-warns and asserts the /password page instead of hard-failing. Delete
      the secret at public launch; the smoke auto-detects PUBLIC mode with no
      code change. Passed to smoke.mjs via env only, never on the command line.
    required: false
    default: ""

outputs:
  theme-id:
    description: Numeric theme ID that was pushed to
    value: ${{ steps.push.outputs.theme_id }}
  theme-name:
    description: Theme name
    value: ${{ steps.push.outputs.theme_name }}
  editor-url:
    description: Theme editor URL (preview mode only)
    value: ${{ steps.push.outputs.editor_url }}
  preview-url:
    description: Preview URL (preview mode only)
    value: ${{ steps.push.outputs.preview_url }}
  push-output:
    description: |
      Last 30 lines of push output, followed by the asset-rejection summary in
      full when there is one. ANSI-stripped and token-redacted.
    value: ${{ steps.push.outputs.push_output }}
  push-exit-code:
    description: |
      Push exit code. Beyond the CLI's own codes, three are synthesised here:
      97 = the push exited 0 but Shopify rejected one or more assets (see
      check-push-rejections.mjs); 98 = the CLI's --json contract broke;
      99 = live theme ID assertion failed.
    value: ${{ steps.push.outputs.push_exit_code }}
  smoke-output:
    description: |
      Smoke test output (live mode only). One "path verdict status host theme-id"
      line per probe. Contains no secrets, cookies, or headers by construction.
    value: ${{ steps.smoke.outputs.smoke_output }}
  smoke-exit-code:
    description: |
      Smoke test exit code (live mode only). 0 = at least one path verified PASS
      and no HARD-FAIL (soft-warns tolerated); 1 = a HARD-FAIL, or nothing was
      verified (e.g. a wholesale 429 wall).
    value: ${{ steps.smoke.outputs.smoke_exit_code }}
  cleanup-status:
    description: |
      One-line cleanup status (delete-preview mode only; empty in live and
      preview modes). Values: "deleted theme(s) <ids>", "no preview theme found",
      "delete failed for: <ids>", "delete failed for: <ids> (succeeded: <ids>)",
      or "delete failed: <reason>". The parent workflow threads this into the
      deploy-report comment.
    value: ${{ steps.push.outputs.cleanup_status }}

runs:
  using: composite
  steps:
    - name: Setup Shopify CLI
      uses: ./.github/actions/setup-shopify-cli

    - name: List themes
      id: list
      shell: bash
      env:
        SHOPIFY_CLI_THEME_TOKEN: ${{ inputs.shopify-cli-theme-token }}
        SHOPIFY_FLAG_STORE: ${{ inputs.shopify-flag-store }}
        SHOPIFY_CLI_TTY: "0"
        CI: "1"
        SHOPIFY_FLAG_NO_COLOR: "true"
      run: |
        set +x
        # `set +e` first: every branch below captures an exit code and acts on
        # it, and the composite default shell's injected `-e` would kill the
        # step on attempt 1 instead of letting the retry loop run (the same
        # trap documented at length on the Push step).
        set +e
        set -uo pipefail

        # Same ANSI-strip + token redaction the Push step uses, so server-sourced
        # text can be shown without leaking a token. Capturing stderr to a file
        # is what stops the CLI printing it, so the failure path has to print it
        # back or a failed `theme list` becomes undiagnosable from the run log.
        scrub() {
          sed 's/\x1b\[[0-9;]*m//g' \
            | sed -E 's/(shpat|shpca|shpss|shppa|shpua|shptka)_[A-Za-z0-9]{16,}/[REDACTED]/g'
        }

        # `theme list` is a read-only GET, so retrying it is idempotent by
        # construction. Three attempts with backoff, because a transient 5xx or
        # a hung connection here fails the whole deploy before the push is even
        # attempted. Transient-only: an auth/permission answer is not weather,
        # so it fails immediately rather than sleeping the full 30s of backoff
        # first.
        ATTEMPTS=3
        LIST_EXIT=1
        for ((i = 1; i <= ATTEMPTS; i++)); do
          # Per-attempt wall-clock bound: a hung CLI must not eat the job's
          # 15-minute budget. `timeout` is coreutils, present on the Linux
          # runners this action runs on.
          timeout --kill-after=10s 60s npx shopify theme list --json > themes.json 2> list.err
          LIST_EXIT=$?
          if [ "$LIST_EXIT" -eq 0 ]; then
            break
          fi
          # A timeout (124, or 137 after the kill-after SIGKILL) is by definition
          # "no answer received", so no answer can have been classified: skip the
          # pattern match entirely. Otherwise a fragment of partial output could
          # match below and abandon the retry on the exact hang the timeout is
          # here to catch.
          if [ "$LIST_EXIT" -ne 124 ] && [ "$LIST_EXIT" -ne 137 ] \
            && grep -qiE '(http|status|error)[^0-9]{0,4}(401|403)|unauthoriz|not authoriz|forbidden|access denied|permission denied|invalid (token|password|api key|credentials)|token[^.]{0,20}expired|(theme|store|shop)[^.]{0,20}(not found|no such)|scope' list.err; then
            echo "::error::theme list failed with a non-transient error (exit ${LIST_EXIT}) after ${i} attempt(s); not retrying."
            scrub < list.err | tail -20
            rm -f list.err
            exit "$LIST_EXIT"
          fi
          if [ "$i" -lt "$ATTEMPTS" ]; then
            echo "::warning::theme list attempt ${i}/${ATTEMPTS} failed (exit ${LIST_EXIT}); retrying in $((i * 10))s"
            sleep $((i * 10))
          fi
        done
        if [ "$LIST_EXIT" -ne 0 ]; then
          echo "::error::theme list failed after ${ATTEMPTS} attempt(s) (exit ${LIST_EXIT})"
          scrub < list.err | tail -20
          rm -f list.err
          exit "$LIST_EXIT"
        fi
        rm -f list.err
        # A zero-exit CLI that wrote a banner instead of JSON must not surface
        # later as a jq riddle in the Push step (`require_json` lives in that
        # step's shell, so it is unreachable from here).
        if ! jq empty themes.json 2>/dev/null; then
          echo "::error::theme list exited 0 but did not write JSON"
          exit 1
        fi

    - name: Push
      id: push
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
        LIVE_THEME_ID: ${{ inputs.live-theme-id }}
        PR_NUMBER: ${{ inputs.pr-number }}
        SHOPIFY_CLI_THEME_TOKEN: ${{ inputs.shopify-cli-theme-token }}
        SHOPIFY_FLAG_STORE: ${{ inputs.shopify-flag-store }}
        SHOPIFY_CLI_TTY: "0"
        CI: "1"
        SHOPIFY_FLAG_NO_COLOR: "true"
      run: |
        set +x
        # `set +e` is load-bearing, not redundant. A composite step's default
        # shell is `bash --noprofile --norc -e -o pipefail`, and `set -uo
        # pipefail` does NOT clear the injected `-e`. Every failure path in this
        # step captures an exit code and branches on it, which `-e` pre-empts:
        # the shell exits on the failing command itself, before capture,
        # retry, or any GITHUB_OUTPUT write. That silently defeated the live
        # 3-attempt retry loop below (a failed attempt 1 killed the step
        # instead of retrying) and left `push_exit_code` empty, which the
        # caller reads as "step never ran". Do not "simplify" this away.
        set +e
        set -uo pipefail

        # Stage outputs default to empty so the parent workflow's failure ladder
        # can distinguish "step never ran" from "step ran and produced N".
        echo "push_exit_code=" >> "$GITHUB_OUTPUT"

        # Helper: capture the last 30 lines of push output, ANSI-strip, redact tokens.
        # Takes one or more files (stdout + stderr are captured separately, see
        # the note on require_json below) and concatenates whichever exist, so the
        # sticky report still shows the CLI's diagnostics on failure.
        #
        # `--rejections <file>` names the asset-rejection summary. It is appended
        # in full AFTER the 30-line tail rather than competing for room inside it:
        # a 20-file rejection runs to ~40 lines, so sharing one window would push
        # the summary's own header and file list out of the PR comment at exactly
        # the moment an operator needs them. Safe to include whole because the
        # summary is already bounded at source (MAX_FILES / MAX_MESSAGE_CHARS in
        # check-push-rejections.mjs) and its every line carries a fixed prefix.
        capture_push_output() {
          local rejections=""
          if [ "${1:-}" = "--rejections" ]; then
            rejections="${2:-}"
            shift 2
          fi
          local existing=()
          local f
          for f in "$@"; do
            [ -f "$f" ] && existing+=("$f")
          done
          if [ ${#existing[@]} -eq 0 ] && [ ! -s "$rejections" ]; then
            return 0
          fi
          # scrub: ANSI-strip, redact tokens, and neutralise any line that is
          # exactly the heredoc delimiter, so server-sourced text can never close
          # the block early and forge additional step outputs.
          scrub() {
            sed 's/\x1b\[[0-9;]*m//g' \
              | sed -E 's/(shpat|shpca|shpss|shppa|shpua|shptka)_[A-Za-z0-9]{16,}/[REDACTED]/g' \
              | sed 's/^GHEOF$/GHEOF./'
          }
          {
            echo "push_output<<GHEOF"
            if [ ${#existing[@]} -gt 0 ]; then
              cat "${existing[@]}" | scrub | tail -30
            fi
            if [ -n "$rejections" ] && [ -s "$rejections" ]; then
              scrub < "$rejections"
            fi
            echo "GHEOF"
          } >> "$GITHUB_OUTPUT"
        }

        # Guard: `theme push --json` writes JSON to stdout and progress/warnings to
        # stderr. Merging them (`> push.json 2>&1`) silently corrupts the document.
        # That is exactly how the @shopify/cli 4.5.1 bump broke every preview: the
        # push itself succeeded, then jq died on the banner text with a parse error
        # that named neither the CLI nor the redirect. `theme list` (above) always
        # got this right; only the push paths did not.
        #
        # Fail loudly and print the bytes, so the next CLI contract change is one
        # log line to diagnose instead of a jq riddle.
        require_json() {
          local file="$1"
          if [ ! -s "$file" ]; then
            echo "::error::${file} is empty; the CLI wrote no JSON to stdout."
            return 1
          fi
          if ! jq empty "$file" 2>/dev/null; then
            echo "::error::${file} is not valid JSON. The Shopify CLI may have changed its --json contract, or stderr leaked into stdout."
            echo "--- ${file} (first 20 lines) ---"
            head -20 "$file" | sed 's/\x1b\[[0-9;]*m//g'
            echo "--- end ---"
            return 1
          fi
          return 0
        }

        # Run one `theme push`, then audit the CLI's own JSON report for assets
        # Shopify refused to store.
        #
        # WHY: `theme push` exits 0 even when the server rejected individual
        # files. Shopify validates a JSON template's settings against the
        # section schema already stored on the theme and refuses the whole
        # asset when a value is out of range. The CLI records the per-file
        # failure in its --json payload, surfaces the sentence only on the
        # debug/analytics path, and returns normally. That combination froze
        # templates/index.json on its last valid version across three
        # consecutive green CI runs, with the smoke test green throughout
        # because every probed page still rendered from stale content.
        #
        # Sets EXIT_CODE: the pushed command's own code, or 97 when the command
        # exited 0 but the audit found rejected assets. The auditor's own code is
        # local to this function (0 clean, 1 rejected, 2 report unparseable); no
        # caller branches on it, they branch on EXIT_CODE.
        run_push_attempt() {
          local check_rc
          rm -f rejections.txt
          "$@" > push.json 2> push.err
          EXIT_CODE=$?
          if [ "$EXIT_CODE" -eq 0 ]; then
            node "${GITHUB_ACTION_PATH}/check-push-rejections.mjs" push.json > rejections.txt 2>&1
            check_rc=$?
            if [ -s rejections.txt ]; then
              cat rejections.txt
            fi
            if [ "$check_rc" -eq 1 ]; then
              EXIT_CODE=97
            elif [ "$check_rc" -eq 2 ]; then
              # The report could not be parsed, so the audit is inconclusive:
              # leave EXIT_CODE at 0 and let require_json own that diagnosis
              # (exit 98) rather than masking a contract break as a rejection.
              echo "::warning::Could not audit this push for rejected assets; the CLI's JSON report was unreadable."
            fi
          fi
        }

        case "$MODE" in
          live)
            if [ -z "$LIVE_THEME_ID" ]; then
              echo "::error::live-theme-id input required when mode=live"
              echo "push_exit_code=99" >> "$GITHUB_OUTPUT"
              exit 1
            fi

            ACTUAL=$(jq -r '[.[] | select(.role=="live")][0].id // empty' themes.json)
            if [ "$ACTUAL" != "$LIVE_THEME_ID" ]; then
              echo "::error::live theme ID mismatch (expected ${LIVE_THEME_ID}, got ${ACTUAL})"
              echo "push_exit_code=99" >> "$GITHUB_OUTPUT"
              exit 1
            fi

            ATTEMPTS=3
            EXIT_CODE=1
            for i in $(seq 1 $ATTEMPTS); do
              echo "::group::Live theme push attempt ${i}/${ATTEMPTS}"
              # 8-minute attempt limit + 10s SIGKILL grace; treat 124 (timeout) as
              # failure for retry purposes. The whole step is bounded by the
              # caller's timeout-minutes (15) so 3 x 8min cannot starve the runner.
              run_push_attempt timeout --kill-after=10s 8m npx shopify theme push --live --allow-live --json
              echo "::endgroup::"
              if [ "$EXIT_CODE" -eq 0 ]; then
                break
              fi
              if [ "$i" -lt "$ATTEMPTS" ]; then
                if [ "$EXIT_CODE" -eq 97 ]; then
                  # Rejected assets are not a transient network condition, so
                  # skip the 60s backoff. The retry is worth one immediate pass
                  # because of the ordering case: a schema change and a JSON
                  # template that depends on it fail when uploaded together
                  # (the template is validated against the schema version
                  # already stored on the theme, not the one in the same
                  # batch). The schema landed in this attempt, so the template
                  # validates on the next one. A value that is genuinely out of
                  # range still fails every attempt and stops the deploy.
                  echo "::warning::Push attempt ${i} left rejected assets; retrying immediately"
                  continue
                fi
                echo "::warning::Push attempt ${i} failed (exit ${EXIT_CODE}); retrying in 60s"
                sleep 60
              fi
            done

            capture_push_output --rejections rejections.txt push.json push.err
            echo "push_exit_code=${EXIT_CODE}" >> "$GITHUB_OUTPUT"

            if [ "$EXIT_CODE" -eq 0 ]; then
              if ! require_json push.json; then
                echo "push_exit_code=98" >> "$GITHUB_OUTPUT"
                exit 98
              fi
              THEME_ID=$(jq -r '.theme.id' push.json)
              THEME_NAME=$(jq -r '.theme.name // "Live theme"' push.json)
              {
                echo "theme_id=$THEME_ID"
                echo "theme_name=$THEME_NAME"
              } >> "$GITHUB_OUTPUT"
            fi
            exit "$EXIT_CODE"
            ;;

          preview)
            if [ -z "$PR_NUMBER" ]; then
              echo "::error::pr-number input required when mode=preview"
              echo "push_exit_code=99" >> "$GITHUB_OUTPUT"
              exit 1
            fi

            THEME_NAME="pr-${PR_NUMBER}-preview"
            MATCHES=$(jq --arg n "$THEME_NAME" '[.[] | select(.name==$n)]' themes.json)
            COUNT=$(jq 'length' <<<"$MATCHES")
            if [ "$COUNT" -gt 1 ]; then
              echo "::error::Multiple themes named ${THEME_NAME} exist; manual cleanup required."
              jq <<<"$MATCHES"
              echo "push_exit_code=99" >> "$GITHUB_OUTPUT"
              exit 1
            fi
            TARGET_ID=""
            if [ "$COUNT" -eq 1 ]; then
              TARGET_ID=$(jq -r '.[0].id' <<<"$MATCHES")
              echo "Reusing theme ${TARGET_ID}"
            fi

            # 2-attempt loop with a per-attempt timeout, mirroring live mode's
            # shape (live gets 3 x 8m; a preview theme is a draft with no
            # customer exposure and preview.yml's job budget is 15 minutes, so
            # 2 x 5m is the proportionate version). Before this, a transient
            # blip or a hung CLI failed the PR outright.
            #
            # Every attempt after the theme is known is addressed by ID, never
            # by `--unpublished`: repeating the create flag would create a
            # SECOND pr-N-preview theme, which the duplicate-name guard above
            # then refuses on every later run. A create attempt that dies
            # mid-flight may still have created the theme, so the ID is
            # re-resolved from the push report and, failing that, from a fresh
            # `theme list` before any retry.
            ATTEMPTS=2
            EXIT_CODE=1
            for i in $(seq 1 $ATTEMPTS); do
              echo "::group::Preview theme push attempt ${i}/${ATTEMPTS}"
              if [ -n "$TARGET_ID" ]; then
                run_push_attempt timeout --kill-after=10s 5m npx shopify theme push --theme "$TARGET_ID" --json
              else
                # `--unpublished --theme <name>` creates a new unpublished
                # theme with the given name in one non-interactive step. The
                # earlier two-step pattern (`--unpublished` then `theme rename`)
                # fails in CI because plain `--unpublished` prompts for a name,
                # and the prompt aborts under SHOPIFY_CLI_TTY=0.
                echo "Creating new unpublished theme: ${THEME_NAME}"
                run_push_attempt timeout --kill-after=10s 5m npx shopify theme push --unpublished --theme "$THEME_NAME" --json
              fi
              echo "::endgroup::"

              if [ -z "$TARGET_ID" ]; then
                TARGET_ID=$(jq -r '.theme.id // empty' push.json 2>/dev/null)
              fi
              if [ "$EXIT_CODE" -eq 0 ]; then
                break
              fi
              if [ "$i" -ge "$ATTEMPTS" ]; then
                break
              fi

              if [ -z "$TARGET_ID" ]; then
                # Re-resolve by name: the failed create may have got far enough
                # to register the theme, and a second `--unpublished` would
                # duplicate it.
                if npx shopify theme list --json > themes-retry.json 2>/dev/null; then
                  TARGET_ID=$(jq -r --arg n "$THEME_NAME" '[.[] | select(.name==$n)][0].id // empty' themes-retry.json 2>/dev/null)
                fi
              fi

              if [ "$EXIT_CODE" -eq 97 ]; then
                # Rejected assets are not a transient network condition, so no
                # backoff. The retry is worth one immediate pass because of the
                # ordering case: a schema change and a JSON template that
                # depends on it fail when uploaded together (the template is
                # validated against the schema version already stored on the
                # theme, not the one in the same batch). The schema landed in
                # this attempt, so the template validates on the next one.
                if [ -z "$TARGET_ID" ]; then
                  echo "::warning::Push left rejected assets and no theme ID could be resolved; not retrying."
                  break
                fi
                echo "::warning::Push attempt ${i} left rejected assets; retrying immediately against theme ${TARGET_ID}"
                continue
              fi

              echo "::warning::Preview push attempt ${i} failed (exit ${EXIT_CODE}); retrying in 30s"
              sleep 30
            done

            capture_push_output --rejections rejections.txt push.json push.err
            echo "push_exit_code=${EXIT_CODE}" >> "$GITHUB_OUTPUT"

            if [ "$EXIT_CODE" -ne 0 ]; then
              exit "$EXIT_CODE"
            fi

            if ! require_json push.json; then
              echo "push_exit_code=98" >> "$GITHUB_OUTPUT"
              exit 98
            fi

            THEME_ID=$(jq -r '.theme.id' push.json)
            THEME_NAME_OUT=$(jq -r --arg n "$THEME_NAME" '.theme.name // $n' push.json)
            EDITOR_URL=$(jq -r '.theme.editor_url // empty' push.json)
            PREVIEW_URL=$(jq -r '.theme.preview_url // empty' push.json)
            if [ -z "$EDITOR_URL" ]; then
              EDITOR_URL="https://admin.shopify.com/store/sapphire-shadow-studio/themes/${THEME_ID}/editor"
            fi
            if [ -z "$PREVIEW_URL" ]; then
              PREVIEW_URL="https://${SHOPIFY_FLAG_STORE}/?preview_theme_id=${THEME_ID}"
            fi
            {
              echo "theme_id=$THEME_ID"
              echo "theme_name=$THEME_NAME_OUT"
              echo "editor_url=$EDITOR_URL"
              echo "preview_url=$PREVIEW_URL"
            } >> "$GITHUB_OUTPUT"
            ;;

          delete-preview)
            if [ -z "$PR_NUMBER" ]; then
              echo "::error::pr-number input required when mode=delete-preview"
              echo "push_exit_code=99" >> "$GITHUB_OUTPUT"
              echo "cleanup_status=delete failed: pr-number missing" >> "$GITHUB_OUTPUT"
              exit 1
            fi
            # Defence-in-depth: every caller wires PR_NUMBER from a server-resolved
            # GitHub API integer, but reject anything non-numeric anyway so a future
            # caller bug cannot inject string content into the theme-name lookup.
            if ! [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
              echo "::error::pr-number must be numeric (got '${PR_NUMBER}')"
              echo "push_exit_code=99" >> "$GITHUB_OUTPUT"
              echo "cleanup_status=delete failed: pr-number not numeric" >> "$GITHUB_OUTPUT"
              exit 1
            fi
            THEME_NAME="pr-${PR_NUMBER}-preview"
            IDS=$(jq -r --arg n "$THEME_NAME" '.[] | select(.name==$n) | .id' themes.json)
            if [ -z "$IDS" ]; then
              echo "No preview theme found for ${THEME_NAME}"
              echo "cleanup_status=no preview theme found" >> "$GITHUB_OUTPUT"
              echo "push_exit_code=0" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            EXIT_CODE=0
            DELETED_IDS=""
            FAILED_IDS=""
            for id in $IDS; do
              echo "Deleting theme ${id}"
              # Per-attempt timeout matches live mode style; CLI auth failures
              # bubble up through the non-zero exit so the caller's report
              # comment can surface "delete failed" loudly.
              if timeout --kill-after=10s 2m npx shopify theme delete --theme "$id" --force; then
                DELETED_IDS="${DELETED_IDS}${id} "
              else
                FAILED_IDS="${FAILED_IDS}${id} "
                EXIT_CODE=1
              fi
            done
            if [ -n "$FAILED_IDS" ]; then
              if [ -n "$DELETED_IDS" ]; then
                STATUS="delete failed for: ${FAILED_IDS% } (succeeded: ${DELETED_IDS% })"
              else
                STATUS="delete failed for: ${FAILED_IDS% }"
              fi
            else
              STATUS="deleted theme(s) ${DELETED_IDS% }"
            fi
            echo "cleanup_status=${STATUS}" >> "$GITHUB_OUTPUT"
            echo "push_exit_code=${EXIT_CODE}" >> "$GITHUB_OUTPUT"
            exit "$EXIT_CODE"
            ;;

          *)
            echo "::error::Unknown mode '${MODE}'; expected 'live', 'preview', or 'delete-preview'"
            echo "push_exit_code=99" >> "$GITHUB_OUTPUT"
            exit 1
            ;;
        esac

    - name: Smoke test
      id: smoke
      # Explicit success() so the smoke step does not run after a failed push;
      # custom `if:` expressions strip the implicit success() check on
      # composite-action steps in some runner versions.
      if: success() && inputs.mode == 'live'
      shell: bash
      # All inputs are passed via env (never interpolated into the run: line):
      # keeps the storefront-password out of argv / process listings and off
      # zizmor's template-injection radar. Node 22 is guaranteed by the
      # Setup Shopify CLI step above (setup-shopify-cli sets up Node), so the
      # built-in fetch the smoke relies on is always present.
      env:
        SHOPIFY_FLAG_STORE: ${{ inputs.shopify-flag-store }}
        SMOKE_PATHS: ${{ inputs.smoke-paths }}
        SMOKE_BASE_URL: ${{ inputs.smoke-base-url }}
        LIVE_THEME_ID: ${{ inputs.live-theme-id }}
        STOREFRONT_PASSWORD: ${{ inputs.storefront-password }}
      run: |
        set +x
        # smoke.mjs writes smoke_output / smoke_exit_code to GITHUB_OUTPUT and
        # exits non-zero only on a HARD-FAIL (soft-warns exit 0). Its exit code
        # is the last command's, so it drives this step's success/failure.
        node "${GITHUB_ACTION_PATH}/smoke.mjs"
