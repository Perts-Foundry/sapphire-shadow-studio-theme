name: Setup Shopify CLI
description: |
  Single source of truth for the Shopify CLI install pattern. Sets up Node and
  runs `npm ci --ignore-scripts`, which materialises the `@shopify/cli` version
  pinned in `package.json` (devDependency) into `node_modules/.bin`. Callers
  invoke the CLI via `npx shopify ...`.

  Updating Node major or the actions/setup-node pin happens here, in one place.
  The CLI version itself is pinned in `package.json`; bump it there and rerun
  `npm install` to refresh `package-lock.json`.

runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: "22"
        cache: npm

    - name: Install Shopify CLI
      shell: bash
      # `--ignore-scripts` blocks lifecycle scripts (preinstall/install/postinstall)
      # from every package in the tree, so a compromised dependency cannot
      # execute code in a job that holds the Shopify token. Two packages in the
      # lockfile carry `hasInstallScript`, and neither needs it here:
      #
      #   esbuild    transitive dep of `@shopify/cli`. It and `@ast-grep/napi`
      #              get their platform binaries from `optionalDependencies`
      #              (per-platform packages npm resolves at install time), not
      #              from a postinstall download.
      #   puppeteer  transitive dep of `pa11y-ci` (the accessibility audit in
      #              preview.yml). Its install script downloads a Chromium
      #              build. Blocking it is DELIBERATE and load-bearing: the
      #              a11y job points pa11y at the runner's preinstalled
      #              `/usr/bin/google-chrome` instead, and also sets
      #              `PUPPETEER_SKIP_DOWNLOAD=1`. Every open `npm audit` high on
      #              this tree (extract-zip symlink traversal, reachable only
      #              through `@puppeteer/browsers`) lives in that download path,
      #              so it is never executed. The audit's suggested "fix" is a
      #              downgrade to pa11y-ci 3.x, which is strictly worse.
      #
      # `sharp`, the one direct devDependency with native code, ships no install
      # script at the pinned version. Re-check with `node -e` over
      # `package-lock.json` for `hasInstallScript` after a dependency bump; if
      # something genuinely needs a lifecycle script, install it in a job with no
      # secrets rather than dropping this flag.
      #
      # Block form (`run: |`) rather than a one-liner because
      # scripts/lib/composite-shell.mjs only extracts that form for shellcheck,
      # and fails the lint loudly on any other. One shape everywhere beats a
      # parser that has to guess.
      run: |
        npm ci --ignore-scripts
