name: Setup Shopify CLI
description: |
  Single source of truth for the Shopify CLI install pattern. Sets up Node and
  runs `npm ci --ignore-scripts`, which materialises the `@shopify/cli` version
  pinned in `package.json` (devDependency) into `node_modules/.bin`. Callers
  invoke the CLI via `npx shopify ...`.

  Updating Node major or the actions/setup-node pin happens here, in one place.
  The CLI version itself is pinned in `package.json`; bump it there and rerun
  `npm install` to refresh `package-lock.json`.

runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: "22"
        cache: npm

    - name: Install Shopify CLI
      shell: bash
      # `--ignore-scripts` blocks lifecycle scripts (preinstall/install/postinstall)
      # from every package in the tree, so a compromised dependency cannot
      # execute code in a job that holds the Shopify token. Nothing here needs
      # those scripts: `esbuild` is the only package in the lockfile with
      # `hasInstallScript` (a transitive dep of `@shopify/cli`), and both it and
      # `@ast-grep/napi` get their platform binaries from `optionalDependencies`
      # (per-platform packages npm resolves at install time), not from a
      # postinstall download. `sharp`, the one direct devDependency with native
      # code, likewise ships no install script at the pinned version. Re-check
      # with `node -e` over `package-lock.json` for `hasInstallScript` after a
      # dependency bump; if something genuinely needs a lifecycle script, install
      # it in a job with no secrets rather than dropping this flag.
      run: npm ci --ignore-scripts
