name: preview

# PR-close cleanup only. The preview-theme push and the dynamic a11y audit
# both live in validate.yml now (jobs `deploy-preview` and `validate`), so
# validate can hard-depend on the preview theme existing before it audits it
# and every result lands in the single CI Report comment. This file keeps the
# `closed` event, which validate.yml deliberately does not listen to: deleting
# the pr-N-preview theme when the PR closes.

on:
  pull_request:
    types: [closed]

permissions: {}

# Strict shell for every `run:` step in this workflow. GitHub's default is
# `bash -e {0}`; the delta here is `-u` (unset variable is an error) and
# `-o pipefail` (a pipeline fails if any stage does), so a future step cannot
# read an unset secret as an empty string or pass a broken pipeline off as
# success. Composite actions declare their own shell and are unaffected.
defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  cleanup:
    # Match deploy-preview's fork-PR and Dependabot exclusions. PRs that
    # never had a pr-N-preview theme created (deploy-preview rejected them
    # at creation) have nothing to clean up; running cleanup just hydrates
    # the Shopify token in vain (or fails for Dependabot since the
    # `pull_request: closed` event from a merged Dependabot PR may run in
    # Dependabot's secrets scope with an empty token).
    if: |
      github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.user.login != 'dependabot[bot]'
    name: cleanup
    runs-on: ubuntu-24.04
    # Coupled to the composite action's retry budgets, so re-check it when
    # either changes: the `theme list` retry can spend ~3.5 minutes before it
    # succeeds (3 x `timeout 60s` plus 10s + 20s of backoff), and the delete
    # loop allows `timeout 2m` per theme, on top of checkout and `npm ci`.
    # Overrunning this cap cancels the job mid-delete, which is exactly the
    # leak the `cancel-in-progress: false` below is here to prevent.
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: preview-cleanup-pr-${{ github.event.pull_request.number }}
      # A cancelled delete leaks a theme that nothing sweeps up, so queue
      # rather than cancel.
      cancel-in-progress: false
    steps:
      - name: Checkout main for composite actions
        # The PR head ref may already be deleted on close; check out main so
        # the local composite-action paths resolve. The checked-out tree is
        # only used to locate `./.github/actions/...` definitions; the delete
        # operation itself uses no files from this tree (the Shopify CLI
        # is materialised by setup-shopify-cli's npm ci, which reads main's
        # package.json/package-lock.json; that is the deliberate canonical
        # CLI version source).
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Delete preview theme
        uses: ./.github/actions/shopify-theme-push
        with:
          mode: delete-preview
          shopify-cli-theme-token: ${{ secrets.SHOPIFY_CLI_THEME_TOKEN }}
          shopify-flag-store: ${{ vars.SHOPIFY_FLAG_STORE }}
          pr-number: ${{ github.event.pull_request.number }}

      - name: Update preview comment to deleted
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        with:
          script: |
            const marker = '<!-- preview -->';
            const prNumber = parseInt(process.env.PR_NUMBER, 10);
            const body = [
              marker,
              '# Preview Deployment',
              '',
              '🗑️ **Preview theme deleted.** PR closed.',
            ].join('\n');
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });
            const existing = comments
              .filter(c => c.body && (c.body.includes(marker) || c.body.includes('<!-- sapphire-preview-bot -->')))
              .sort((a, b) => a.id - b.id);
            const [keep, ...dupes] = existing;
            if (keep) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: keep.id,
                body,
              });
            }
            for (const dup of dupes) {
              await github.rest.issues.deleteComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: dup.id,
              });
            }
