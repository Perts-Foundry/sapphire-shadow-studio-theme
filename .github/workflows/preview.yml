name: preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions: {}

# Strict shell for every `run:` step in this workflow. GitHub's default is
# `bash -e {0}`; the delta here is `-u` (unset variable is an error) and
# `-o pipefail` (a pipeline fails if any stage does), so a future step cannot
# read an unset secret as an empty string or pass a broken pipeline off as
# success. Steps that must survive a non-zero command still clear `-e` with
# their own `set +e`; that does NOT clear `-u` or `-o pipefail`, which is the
# point. Composite actions declare their own shell and are unaffected.
defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  deploy-preview:
    # Skip Dependabot PRs: Dependabot-triggered workflows run with a separate
    # secrets/variables scope (`Settings -> Secrets and variables ->
    # Dependabot`) that does NOT inherit the regular Actions secrets, so
    # `SHOPIFY_CLI_THEME_TOKEN` is empty here and `npx shopify theme list`
    # fails authentication. Preview themes are for human visual review of
    # code changes; dependency bumps (action SHAs, npm tooling) do not change
    # the rendered storefront, so a preview adds no signal. The auto-deploy
    # chain still works because `deploy.yml`'s `workflow_run` arm uses the
    # default-branch secrets scope (not Dependabot's).
    if: |
      github.event.action != 'closed'
      && github.event.pull_request.draft == false
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.user.login != 'dependabot[bot]'
    name: deploy-preview
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: preview-deploy-pr-${{ github.event.pull_request.number }}
      # Deliberately `true`, decided rather than defaulted. Cancelling mid-push
      # can leave the preview theme partially uploaded, but that state is
      # self-healing: the next run pushes the whole tree, and the run that
      # cancelled this one is by definition already queued. The preview theme
      # is an unpublished draft with no customer exposure, so a partial state
      # between two pushes costs nothing, while queueing every run of a
      # push-storm burns CI minutes for no safety gain. The cleanup job below
      # is `false` for the opposite reason: a cancelled delete leaks a theme
      # that nothing sweeps up.
      cancel-in-progress: true
    outputs:
      theme_id: ${{ steps.push.outputs.theme-id }}
      editor_url: ${{ steps.push.outputs.editor-url }}
      preview_url: ${{ steps.push.outputs.preview-url }}
    steps:
      - name: Checkout PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Push or update preview theme
        id: push
        uses: ./.github/actions/shopify-theme-push
        with:
          mode: preview
          shopify-cli-theme-token: ${{ secrets.SHOPIFY_CLI_THEME_TOKEN }}
          shopify-flag-store: ${{ vars.SHOPIFY_FLAG_STORE }}
          pr-number: ${{ github.event.pull_request.number }}

      - name: Upsert preview comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          THEME_ID: ${{ steps.push.outputs.theme-id }}
          THEME_NAME: ${{ steps.push.outputs.theme-name }}
          EDITOR_URL: ${{ steps.push.outputs.editor-url }}
          PREVIEW_URL: ${{ steps.push.outputs.preview-url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const marker = '<!-- preview -->';
            const themeId = process.env.THEME_ID;
            const themeName = process.env.THEME_NAME;
            const editorUrl = process.env.EDITOR_URL;
            const previewUrl = process.env.PREVIEW_URL;
            const prNumber = parseInt(process.env.PR_NUMBER, 10);
            const sha = (process.env.SHA || '').slice(0, 7);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const body = [
              marker,
              '# Preview Deployment',
              '',
              '✅ **Preview theme deployed.** Open the URL below to inspect.',
              '',
              `**Commit:** \`${sha}\` | **Run:** [#${context.runNumber}](${runUrl})`,
              '',
              '---',
              '',
              '| | |',
              '|:--|:--|',
              `| **Theme** | \`${themeName}\` (id \`${themeId}\`) |`,
              `| **Preview URL** | [${previewUrl}](${previewUrl}) |`,
              `| **Edit in admin** | [Open editor](${editorUrl}) |`,
              '',
              '---',
              '',
              'Updated on every push to the PR; deleted when the PR closes.',
            ].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });
            const existing = comments
              .filter(c => c.body && c.body.includes(marker))
              .sort((a, b) => a.id - b.id);
            const [keep, ...dupes] = existing;
            if (keep) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: keep.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }
            for (const dup of dupes) {
              await github.rest.issues.deleteComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: dup.id,
              });
            }
            // Sweep the legacy marker from pre-restyle runs.
            const legacy = comments.filter(c => c.body && c.body.includes('<!-- sapphire-preview-bot -->'));
            for (const c of legacy) {
              try {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: c.id,
                });
              } catch (_) { /* swallowed */ }
            }

  a11y-audit:
    # Dynamic half of the two-layer accessibility check. The static half (the
    # colour-contrast lint) runs inside the required `validate / validate`
    # context; it reads config/settings_data.json and needs no rendered page.
    # This job covers what colour maths cannot: real DOM, real font sizes, real
    # focus order, real overlay schemes composited over real hero images.
    #
    # TRIGGER CONTEXT, stated rather than assumed. This job inherits
    # deploy-preview's guards transitively: `needs: deploy-preview` plus the
    # result check below means it runs only when deploy-preview ran AND
    # succeeded, and deploy-preview itself is gated on same-repo (non-fork),
    # non-draft, non-Dependabot, non-closed. So the code being audited is
    # always collaborator-authored, which is what makes it acceptable for this
    # job to hold a secret and `pull-requests: write`.
    needs: deploy-preview
    if: needs.deploy-preview.result == 'success'
    name: a11y-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      # Deliberately the SAME group as deploy-preview, not a sibling. A new push
      # must cancel a running audit before it redeploys the very theme that
      # audit is reading; otherwise the run reports findings for a tree that no
      # longer exists on the preview theme.
      #
      # Residual race, accepted: cancellation is not instantaneous, so a
      # redeploy can still land during the window between the cancel signal and
      # the job actually stopping. The cost is a stale or mixed report on a PR
      # that is about to get a fresh run anyway, never a wrong merge decision:
      # this job is not a required check.
      group: preview-deploy-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    env:
      # puppeteer (a pa11y-ci dependency) would otherwise try to download its
      # own Chromium. `npm ci --ignore-scripts` already blocks that; this makes
      # the intent explicit and covers any non-lifecycle download path. pa11y
      # is pointed at the runner's preinstalled Chrome instead.
      PUPPETEER_SKIP_DOWNLOAD: "1"
    steps:
      - name: Checkout PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Setup Shopify CLI
        # Not for the CLI itself (this job never talks to the Admin API and
        # holds no Shopify token). It is the repo's single source of truth for
        # the Node setup + `npm ci --ignore-scripts` pattern, which is what
        # materialises pa11y-ci into node_modules/.bin.
        uses: ./.github/actions/setup-shopify-cli

      - name: Authenticate and build pa11y config
        id: config
        env:
          # STOREFRONT_PASSWORD is scoped to THIS STEP, never to the job. The
          # pa11y step below launches `--no-sandbox` Chrome that executes
          # third-party page JavaScript (consent banner, chat widget, Shopify's
          # own scripts); the storefront password must not be present in that
          # process's environment. No Shopify token appears anywhere in this job.
          STOREFRONT_PASSWORD: ${{ secrets.STOREFRONT_PASSWORD }}
          # Step-env indirection, never inlined into `run:`. These are job
          # outputs, and interpolating them into a shell body would make them a
          # script-injection vector.
          BASE_URL: https://${{ vars.SHOPIFY_FLAG_STORE }}
          THEME_ID: ${{ needs.deploy-preview.outputs.theme_id }}
          CONFIG_PATH: ${{ runner.temp }}/pa11yci.json
        run: |
          set +e
          COOKIE=$(node scripts/a11y/get-auth-cookie.mjs)
          AUTH_RC=$?
          if [ "$AUTH_RC" -ne 0 ]; then
            echo "::error::Could not reach the preview theme; see the diagnostics above."
            echo "exit_code=$AUTH_RC" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Mask BEFORE anything else can emit it. The cookie is a live
          # authenticated session for the storefront.
          if [ -n "$COOKIE" ]; then
            echo "::add-mask::$COOKIE"
          fi

          # The config file embeds the cookie. It goes to RUNNER_TEMP and is
          # never uploaded as an artifact or printed.
          COOKIE="$COOKIE" node scripts/a11y/build-pa11yci.mjs > "$CONFIG_PATH"
          BUILD_RC=$?
          if [ "$BUILD_RC" -ne 0 ]; then
            echo "::error::Failed to build the pa11y-ci config."
            echo "exit_code=$BUILD_RC" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          URL_COUNT=$(node -e 'const c=require(process.argv[1]);process.stdout.write(String((c.urls||[]).length))' "$CONFIG_PATH")
          echo "Built pa11y config with ${URL_COUNT} URL(s)."
          {
            echo "config_path=$CONFIG_PATH"
            echo "url_count=$URL_COUNT"
            echo "exit_code=0"
          } >> "$GITHUB_OUTPUT"

      - name: Run pa11y-ci
        id: pa11y
        # No secret env here by design; the config file carries the cookie.
        env:
          CONFIG_PATH: ${{ steps.config.outputs.config_path }}
          REPORT_PATH: ${{ runner.temp }}/pa11y-report.json
          CONFIG_RC: ${{ steps.config.outputs.exit_code }}
        run: |
          set +e
          if [ "${CONFIG_RC:-1}" != "0" ]; then
            echo "Skipped: the config step failed."
            echo "exit_code=1" >> "$GITHUB_OUTPUT"
            DELIM="EOF_${RANDOM}${RANDOM}${RANDOM}"
            {
              echo "summary<<${DELIM}"
              echo "Could not authenticate against the preview theme; pa11y-ci did not run."
              echo "${DELIM}"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          npx pa11y-ci --config "$CONFIG_PATH" --json > "$REPORT_PATH" 2>/tmp/pa11y.err
          PA11Y_RC=$?
          # stderr only. stdout is the JSON report, and pa11y can echo the
          # config (which holds the session cookie) into stderr on a config
          # error, so this is capped rather than dumped.
          head -c 2000 /tmp/pa11y.err || true

          SUMMARY=$(node scripts/a11y/summarize-pa11y.mjs "$REPORT_PATH" --exit-code "$PA11Y_RC")
          SUMMARY_RC=$?
          echo "$SUMMARY" | node -e '
            let s = "";
            process.stdin.on("data", (d) => { s += d; }).on("end", () => {
              try {
                const o = JSON.parse(s);
                console.log(`pa11y-ci: ${o.reason} (${o.total} URL(s), ${o.errors} error(s))`);
              } catch { console.log("pa11y-ci: summary unavailable"); }
            });'

          BODY=$(echo "$SUMMARY" | node -e '
            let s = "";
            process.stdin.on("data", (d) => { s += d; }).on("end", () => {
              try { process.stdout.write(JSON.parse(s).body || ""); } catch { process.stdout.write(""); }
            });')

          echo "exit_code=$SUMMARY_RC" >> "$GITHUB_OUTPUT"
          # Random delimiter: this body is page-derived text from a
          # PR-controlled theme, so a fixed one would be forgeable.
          DELIM="EOF_${RANDOM}${RANDOM}${RANDOM}"
          {
            echo "summary<<${DELIM}"
            echo "$BODY"
            echo "${DELIM}"
          } >> "$GITHUB_OUTPUT"

      - name: Upsert a11y comment
        if: always()
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          THEME_ID: ${{ needs.deploy-preview.outputs.theme_id }}
          A11Y_EXIT: ${{ steps.pa11y.outputs.exit_code }}
          A11Y_SUMMARY: ${{ steps.pa11y.outputs.summary }}
        with:
          script: |
            const marker = '<!-- a11y -->';
            const prNumber = parseInt(process.env.PR_NUMBER, 10);
            const sha = (process.env.SHA || '').slice(0, 7);
            const exit = process.env.A11Y_EXIT;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            // The summary is already sanitised and length-capped by
            // scripts/a11y/summarize-pa11y.mjs. Re-apply the fence and details
            // guards anyway: this is the last hop before untrusted page text
            // becomes a comment, and a capped body that still failed to post
            // would mask the result it exists to report.
            const summary = (process.env.A11Y_SUMMARY || '')
              .replace(/`{4,}/g, '```')
              .slice(0, 55000);

            const banner = exit === '0'
              ? '✅ **No accessibility errors.**'
              : '❌ **Accessibility errors found.** Details below.';

            const body = [
              marker,
              '# Accessibility Audit',
              '',
              banner,
              '',
              `**Commit:** \`${sha}\` | **Theme:** \`${process.env.THEME_ID}\` | **Run:** [#${context.runNumber}](${runUrl})`,
              '',
              '---',
              '',
              summary || '_No report produced._',
              '',
              '---',
              '',
              'pa11y-ci (axe, WCAG 2.1 AA + `target-size`) against the preview theme. Colour-scheme contrast is checked separately in `validate`.',
            ].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });
            const existing = comments
              .filter(c => c.body && c.body.includes(marker))
              .sort((a, b) => a.id - b.id);
            const [keep, ...dupes] = existing;
            if (keep) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: keep.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }
            for (const dup of dupes) {
              await github.rest.issues.deleteComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: dup.id,
              });
            }

      - name: Check for failures
        env:
          A11Y_EXIT: ${{ steps.pa11y.outputs.exit_code }}
        run: |
          # Fail closed on an empty code as well as a non-zero one. Every step
          # above is `set +e` and always writes one, so an empty value means a
          # step died before recording a result, which must not read as a pass.
          if [ -z "${A11Y_EXIT:-}" ]; then
            echo "::error::a11y audit recorded no exit code (a step failed before writing one)"
            exit 1
          fi
          if [ "$A11Y_EXIT" != "0" ]; then
            echo "::error::a11y audit failed; see the PR comment and the log above"
            exit 1
          fi
          echo "a11y audit passed."

  cleanup:
    # Match deploy-preview's fork-PR and Dependabot exclusions. PRs that
    # never had a pr-N-preview theme created (deploy-preview rejected them
    # at creation) have nothing to clean up; running cleanup just hydrates
    # the Shopify token in vain (or fails for Dependabot since the
    # `pull_request: closed` event from a merged Dependabot PR may run in
    # Dependabot's secrets scope with an empty token).
    if: |
      github.event.action == 'closed'
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.user.login != 'dependabot[bot]'
    name: cleanup
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: preview-cleanup-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - name: Checkout main for composite actions
        # The PR head ref may already be deleted on close; check out main so
        # the local composite-action paths resolve. The checked-out tree is
        # only used to locate `./.github/actions/...` definitions; the delete
        # operation itself uses no files from this tree (the Shopify CLI
        # is materialised by setup-shopify-cli's npm ci, which reads main's
        # package.json/package-lock.json; that is the deliberate canonical
        # CLI version source).
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Delete preview theme
        uses: ./.github/actions/shopify-theme-push
        with:
          mode: delete-preview
          shopify-cli-theme-token: ${{ secrets.SHOPIFY_CLI_THEME_TOKEN }}
          shopify-flag-store: ${{ vars.SHOPIFY_FLAG_STORE }}
          pr-number: ${{ github.event.pull_request.number }}

      - name: Update preview comment to deleted
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        with:
          script: |
            const marker = '<!-- preview -->';
            const prNumber = parseInt(process.env.PR_NUMBER, 10);
            const body = [
              marker,
              '# Preview Deployment',
              '',
              '🗑️ **Preview theme deleted.** PR closed.',
            ].join('\n');
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });
            const existing = comments
              .filter(c => c.body && (c.body.includes(marker) || c.body.includes('<!-- sapphire-preview-bot -->')))
              .sort((a, b) => a.id - b.id);
            const [keep, ...dupes] = existing;
            if (keep) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: keep.id,
                body,
              });
            }
            for (const dup of dupes) {
              await github.rest.issues.deleteComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: dup.id,
              });
            }
