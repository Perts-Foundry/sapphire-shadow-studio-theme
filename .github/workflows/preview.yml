name: preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions: {}

jobs:
  deploy-preview:
    if: |
      github.event.action != 'closed'
      && github.event.pull_request.draft == false
      && github.event.pull_request.head.repo.full_name == github.repository
    name: deploy-preview
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: shopify-deploy
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: preview-deploy-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    outputs:
      theme_id: ${{ steps.push.outputs.theme-id }}
      editor_url: ${{ steps.push.outputs.editor-url }}
      preview_url: ${{ steps.push.outputs.preview-url }}
    steps:
      - name: Checkout PR head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      # TEMP DIAGNOSTIC: prints non-secret metadata about the env's
      # secrets so we can pinpoint the 401 from `npx shopify theme list`.
      # Length and sha256 fingerprint are not redacted by GitHub's secret
      # masking layer (they are derived numbers, not the value itself).
      # Compare locally:
      #   printf '%s' 'shpat_<token>' | sha256sum | head -c12
      #   printf '%s' 'sapphire-shadow-studio.myshopify.com' | sha256sum | head -c12
      # Remove this step after the 401 is resolved.
      - name: TEMP - diagnose shopify secrets
        env:
          SHOPIFY_CLI_THEME_TOKEN: ${{ secrets.SHOPIFY_CLI_THEME_TOKEN }}
          SHOPIFY_FLAG_STORE: ${{ secrets.SHOPIFY_FLAG_STORE }}
        run: |
          set +x
          set -uo pipefail
          echo "token_length=${#SHOPIFY_CLI_THEME_TOKEN}"
          echo "token_prefix_first6=${SHOPIFY_CLI_THEME_TOKEN:0:6}"
          echo "store_length=${#SHOPIFY_FLAG_STORE}"
          echo "store_prefix_first6=${SHOPIFY_FLAG_STORE:0:6}"
          echo "store_suffix_last6=${SHOPIFY_FLAG_STORE: -6}"
          token_hash=$(printf '%s' "${SHOPIFY_CLI_THEME_TOKEN}" | sha256sum | head -c12)
          store_hash=$(printf '%s' "${SHOPIFY_FLAG_STORE}" | sha256sum | head -c12)
          echo "token_sha256_12=${token_hash}"
          echo "store_sha256_12=${store_hash}"
          token_trimmed_len=$(printf '%s' "${SHOPIFY_CLI_THEME_TOKEN}" | sed 's/[[:space:]]\+$//' | wc -c)
          store_trimmed_len=$(printf '%s' "${SHOPIFY_FLAG_STORE}" | sed 's/[[:space:]]\+$//' | wc -c)
          echo "token_trimmed_length=${token_trimmed_len}"
          echo "store_trimmed_length=${store_trimmed_len}"

      - name: Push or update preview theme
        id: push
        uses: ./.github/actions/shopify-theme-push
        with:
          mode: preview
          shopify-cli-theme-token: ${{ secrets.SHOPIFY_CLI_THEME_TOKEN }}
          shopify-flag-store: ${{ secrets.SHOPIFY_FLAG_STORE }}
          pr-number: ${{ github.event.pull_request.number }}

      - name: Upsert preview comment
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          THEME_ID: ${{ steps.push.outputs.theme-id }}
          EDITOR_URL: ${{ steps.push.outputs.editor-url }}
          PREVIEW_URL: ${{ steps.push.outputs.preview-url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const marker = '<!-- sapphire-preview-bot -->';
            const themeId = process.env.THEME_ID;
            const editorUrl = process.env.EDITOR_URL;
            const previewUrl = process.env.PREVIEW_URL;
            const prNumber = parseInt(process.env.PR_NUMBER, 10);
            const sha = (process.env.SHA || '').slice(0, 7);
            const body = `${marker}\n\n**Preview theme deployed** (id \`${themeId}\`, last commit \`${sha}\`)\n\n- [Open preview](${previewUrl})\n- [Edit in admin](${editorUrl})\n\nUpdated on every push to the PR; deleted when the PR closes.`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              per_page: 100,
            });
            const existing = comments
              .filter(c => c.body && c.body.includes(marker))
              .sort((a, b) => a.id - b.id);
            const [keep, ...dupes] = existing;
            if (keep) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: keep.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }
            for (const dup of dupes) {
              await github.rest.issues.deleteComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: dup.id,
              });
            }

  cleanup:
    # Match deploy-preview's fork-PR exclusion. Fork PRs never had a
    # pr-N-preview theme created (deploy-preview rejects them), so cleanup
    # has nothing to do; running it just hydrates the Shopify token in vain.
    if: |
      github.event.action == 'closed'
      && github.event.pull_request.head.repo.full_name == github.repository
    name: cleanup
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: shopify-deploy
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: preview-cleanup-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"

      - name: Install Shopify CLI
        run: npm install -g @shopify/cli@3.94.3

      - name: Delete preview theme(s)
        env:
          SHOPIFY_CLI_THEME_TOKEN: ${{ secrets.SHOPIFY_CLI_THEME_TOKEN }}
          SHOPIFY_FLAG_STORE: ${{ secrets.SHOPIFY_FLAG_STORE }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SHOPIFY_CLI_TTY: "0"
          CI: "1"
          SHOPIFY_FLAG_NO_COLOR: "true"
        run: |
          set +x
          set -euo pipefail
          THEME_NAME="pr-${PR_NUMBER}-preview"
          shopify theme list --json > themes.json
          IDS=$(jq -r --arg n "$THEME_NAME" '.[] | select(.name==$n) | .id' themes.json)
          if [ -z "$IDS" ]; then
            echo "No preview theme found for ${THEME_NAME}"
          else
            for id in $IDS; do
              echo "Deleting theme ${id}"
              shopify theme delete --theme "$id" --force || true
            done
          fi

      - name: Update preview comment to deleted
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        with:
          script: |
            const marker = '<!-- sapphire-preview-bot -->';
            const prNumber = parseInt(process.env.PR_NUMBER, 10);
            const body = `${marker}\n\nPreview theme deleted.`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              per_page: 100,
            });
            const existing = comments
              .filter(c => c.body && c.body.includes(marker))
              .sort((a, b) => a.id - b.id);
            const [keep, ...dupes] = existing;
            if (keep) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: keep.id,
                body,
              });
            }
            for (const dup of dupes) {
              await github.rest.issues.deleteComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: dup.id,
              });
            }
