# Unified deploy chain. One workflow handles three trigger paths:
#
#   1. issue_comment  - Dev PRs. A write+ collaborator comments `deploy`;
#                       the gate job runs the collaborator-permission check
#                       and the validate-on-HEAD-SHA re-verification.
#   2. workflow_run   - Auto-deploy for shopify-sync admin commits. Validate
#       (shopify-sync)  succeeds on the auto-reconcile PR; this workflow
#                       fires; the gate runs the shopify-sync gates (signed-
#                       commit, label, diff-sanity, base-staleness).
#   3. workflow_run   - Auto-deploy for Dependabot PRs. Same shape as (2),
#       (dependabot/**) with dependabot-specific gates (no CI-file changes,
#                       major-version label requirement, manual-review
#                       escape hatch).
#
# Three jobs in this workflow:
#   gate   - no Shopify token, no concurrency on deploy-production. Catches
#            non-collaborators and stale validate before any token is in scope
#            and before the live-deploy mutex is held. Resolves the trusted
#            SHA via getWorkflowRun().head_sha (workflow_run paths) or via
#            pulls.get().head.sha after the collaborator-permission check
#            (comment path).
#   deploy - contents+pulls write, concurrency: deploy-production. Reads the
#            Shopify token from a repo-level secret and the store handle /
#            canonical domain from repo-level variables. Inherits the trusted
#            head SHA from gate via needs.gate.outputs.head_sha. Pushes the
#            theme to live, smoke-tests, posts the deploy report, then squash-
#            merges. SHOPIFY_SYNC_DEPLOY_KEY is NOT in this job's scope.
#   sync   - contents: write, needs: deploy. Reconciles shopify-sync to the
#            deployed SHA (replaces the prior sync-reconcile.yml push: main
#            fast-forward arm, which was dead because GITHUB_TOKEN-driven
#            pushes do not retrigger workflows). Holds SHOPIFY_SYNC_DEPLOY_KEY
#            in isolation from SHOPIFY_CLI_THEME_TOKEN: a bug in this job's
#            bash cannot leak the Shopify token because the Shopify token
#            structurally does not exist in this job's scope.
#
# WARNING: workflow_run.workflows hardcodes the literal name "validate";
# renaming validate.yml silently breaks the auto-deploy paths. The
# workflow_run.branches filter (shopify-sync, dependabot/**) also depends on
# Dependabot's branch-naming convention. The sync job's phantom-orphan SSH
# push additionally depends on (a) the ruleset name "shopify-sync-protection",
# (b) a "Deploy keys" bypass-actor row on that ruleset pointing at the
# matching public key, and (c) the public key being on /settings/keys with
# "Allow write access". See release-notes.md "Operator action" entry.
name: deploy

on:
  issue_comment:
    types: [created]
  workflow_run:
    workflows: ["validate"]
    types: [completed]
    branches: ["shopify-sync", "dependabot/**"]

# Dynamic run-name keeps the three trigger paths visually distinct in the
# Actions tab. Without it, every run is named "deploy" and the operator must
# open the run to see which path fired.
run-name: >-
  deploy (${{
    github.event_name == 'issue_comment'
      && format('comment #{0} by @{1}', github.event.issue.number, github.event.comment.user.login)
      || format('{0} @ {1}', github.event.workflow_run.head_branch, github.event.workflow_run.display_title)
  }})

permissions: {}

# Strict shell for every `run:` step in this workflow. GitHub's default is
# `bash -e {0}`; the delta here is `-u` (unset variable is an error) and
# `-o pipefail` (a pipeline fails if any stage does), so a future step cannot
# read an unset secret as an empty string or pass a broken pipeline off as
# success. Steps that must survive a non-zero command still clear `-e` with
# their own `set +e`; that does NOT clear `-u` or `-o pipefail`, which is the
# point. Composite actions declare their own shell and are unaffected.
defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  gate:
    name: gate
    # Workflow-level pre-filter. Rejects two failure classes before any runner
    # spins up:
    #   (a) issue_comment events that are NOT on a PR (github.event.issue.pull_request
    #       is null for plain issue comments) or whose body is not an accepted
    #       spelling of `deploy` or whose author_association is below COLLABORATOR.
    #
    # On the accepted spellings: a YAML `if:` expression cannot trim or
    # lowercase, so the cheap pre-filter is an equality test against a small
    # allow-list covering the real miss cases (phone keyboards auto-capitalise
    # the first word; a trailing space is invisible; `/deploy` reads like a
    # slash command). The `Normalise deploy comment` step below re-asserts the
    # match properly in JS and fails the gate on anything else. Both are
    # equality tests on the WHOLE body, never a substring match, so the word
    # `deploy` inside ordinary PR prose still cannot trigger a live push.
    #   (b) workflow_run events whose triggering Validate ran from a push
    #       (push: main or push: shopify-sync) rather than a PR. validate.yml
    #       fires on both pull_request and push; only the pull_request flavor
    #       corresponds to an auto-deploy candidate.
    if: |
      (github.event_name == 'issue_comment'
        && github.event.issue.pull_request
        && contains(fromJSON('["deploy", "Deploy", "DEPLOY", "/deploy", "/Deploy", "/DEPLOY", "deploy ", "Deploy ", "DEPLOY ", "/deploy ", "/Deploy ", "/DEPLOY ", " deploy", " Deploy", " deploy "]'), github.event.comment.body)
        && contains(fromJSON('["MEMBER", "OWNER", "COLLABORATOR"]'), github.event.comment.author_association))
      || (github.event_name == 'workflow_run'
        && github.event.workflow_run.event == 'pull_request'
        && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      # write on pull-requests so the rejection sticky comment can post when
      # a gate fails; without it the rejection surfaces only as a workflow
      # failure with no in-PR explanation. issues: write is needed for
      # createForIssueComment reactions (eyes/-1/confused on the comment
      # path) because reaction endpoints are routed through the issues API
      # even for PR comments.
      pull-requests: write
      issues: write
      actions: read
      checks: read
    outputs:
      pr_number: ${{ steps.resolve.outputs.pr_number }}
      head_sha: ${{ steps.resolve.outputs.head_sha }}
      short_sha: ${{ steps.resolve.outputs.short_sha }}
      ref: ${{ steps.resolve.outputs.ref }}
      base_ref: ${{ steps.resolve.outputs.base_ref }}
      trigger_path: ${{ steps.resolve.outputs.trigger_path }}
      deployer: ${{ steps.resolve.outputs.deployer }}
      # 'true' if the PR touches any of the 8 theme directories (or renames a
      # file out of one); 'false' for docs/scripts/.github-only PRs, which then
      # skip the live push + smoke but still merge and fast-forward shopify-sync.
      # Fail-safe: defaults to 'true' if file listing errors. Never empty on the
      # deploy path (theme_scope runs whenever pr_number resolves).
      theme_touched: ${{ steps.theme_scope.outputs.theme_touched }}
    steps:
      # Authoritative form of the comment-trigger match. The workflow-level
      # `if:` is a cheap allow-list pre-filter; this normalises the body the
      # way the allow-list cannot (trim, lowercase, drop one leading slash)
      # and fails the gate if the result is not exactly `deploy`. It stays an
      # equality test on the whole normalised body: no substring match, so
      # prose containing the word `deploy` can never reach the live push.
      - name: Normalise deploy comment
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const raw = context.payload.comment.body || '';
            const normalised = raw.trim().toLowerCase().replace(/^\//, '');
            if (normalised !== 'deploy') {
              core.setFailed(`Comment body did not normalise to \`deploy\` (got ${JSON.stringify(normalised)}); refusing to deploy.`);
            }

      - name: React with eyes
        if: github.event_name == 'issue_comment'
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'eyes',
            });

      - name: Resolve trigger context
        id: resolve
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const sameRepoFull = `${owner}/${repo}`;
            const eventName = context.eventName;

            // Single sticky-comment marker for all three trigger paths.
            // Replaces the prior per-workflow markers
            // (<!-- shopify-sync-auto-deploy --> and <!-- dependabot-auto-deploy -->)
            // since one deploy.yml now owns every report.
            const MARKER = '<!-- deploy-result -->';

            // Sticky-comment helper. Upserts a single MARKER-tagged comment per
            // PR and cleans up duplicates. Uses github.paginate so PRs with
            // >100 comments (auto-reconcile PRs that accumulate daily-cron
            // stale notices, or long-lived discussion threads) still find
            // and update the existing sticky instead of posting a duplicate.
            const upsertSticky = async (prNumber, body) => {
              try {
                const comments = await github.paginate(github.rest.issues.listComments, {
                  owner, repo, issue_number: prNumber,
                });
                const existing = comments
                  .filter(c => c.body && c.body.includes(MARKER))
                  .sort((a, b) => a.id - b.id);
                const [keep, ...dupes] = existing;
                if (keep) {
                  await github.rest.issues.updateComment({ owner, repo, comment_id: keep.id, body });
                } else {
                  await github.rest.issues.createComment({ owner, repo, issue_number: prNumber, body });
                }
                for (const d of dupes) {
                  try {
                    await github.rest.issues.deleteComment({ owner, repo, comment_id: d.id });
                  } catch (_) { /* swallowed */ }
                }
              } catch (_) { /* non-critical; setFailed remains authoritative */ }
            };

            const postSkip = async (prNumber, reason, opts = {}) => {
              const { reaction } = opts;
              if (reaction && eventName === 'issue_comment') {
                try {
                  await github.rest.reactions.createForIssueComment({
                    owner, repo, comment_id: context.payload.comment.id, content: reaction,
                  });
                } catch (_) { /* swallowed */ }
              }
              const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
              const body = [
                MARKER,
                '# Deployment Report',
                '',
                `:x: **Deployment refused** at **Pre-deploy Checks**. The PR remains open.`,
                '',
                '| | |',
                '|:--|:--|',
                `| **Reason** | ${reason} |`,
                `| **Workflow run** | [#${context.runNumber}](${runUrl}) |`,
                '',
                '---',
                '',
                ':warning: Address the issue and re-trigger (push a new commit for auto-deploys, or comment `deploy` for manual).',
              ].join('\n');
              if (prNumber) {
                await upsertSticky(prNumber, body);
              }
              core.setFailed(reason);
            };

            // ──────────────────────────────────────────────────────────
            // Branch on trigger.
            // ──────────────────────────────────────────────────────────
            if (eventName === 'issue_comment') {
              const prNumber = context.issue.number;
              const username = context.payload.comment.user.login;

              // Collaborator-permission check via the API (defence in depth
              // above the author_association pre-filter in the workflow-level
              // if:; author_association can lag for borderline accounts).
              try {
                const { data: perm } = await github.rest.repos.getCollaboratorPermissionLevel({
                  owner, repo, username,
                });
                if (!['admin', 'write'].includes(perm.permission)) {
                  await postSkip(prNumber, `@${username} does not have write access; deploy refused.`, { reaction: '-1' });
                  return;
                }
              } catch (err) {
                await postSkip(prNumber, `Permission lookup failed (${err.message}); please retry.`, { reaction: 'confused' });
                return;
              }

              const { data: pr } = await github.rest.pulls.get({
                owner, repo, pull_number: prNumber,
              });
              if (pr.state !== 'open') {
                await postSkip(prNumber, 'This PR is not open; deploy refused.', { reaction: '-1' });
                return;
              }
              if (!pr.head.repo || pr.head.repo.full_name !== sameRepoFull) {
                await postSkip(prNumber, 'Deploy from forks is not supported.', { reaction: '-1' });
                return;
              }

              // Validate-on-HEAD-SHA gate. For the comment path this is the
              // primary integrity check: the user could comment `deploy` on a
              // PR with stale or red validate. The workflow_run path skips
              // this step because the trigger itself proves validate was just
              // green on the trusted SHA.
              //
              // event: 'pull_request' is belt-and-braces. validate.yml is
              // pull_request-only today, but if it ever grows a push: or
              // workflow_dispatch: trigger, a run from one of those events on
              // the same SHA would otherwise pass as "proof of Validate green"
              // for a comment-deploy. They run with different intent and
              // potentially different env, so they should not satisfy this gate.
              const { data: runs } = await github.rest.actions.listWorkflowRuns({
                owner, repo, workflow_id: 'validate.yml', head_sha: pr.head.sha, event: 'pull_request', per_page: 100,
              });
              const validateRuns = runs.workflow_runs || [];
              if (validateRuns.length === 0) {
                await postSkip(prNumber, `No validate run found for \`${pr.head.sha.substring(0,7)}\`. Push to trigger validation first.`, { reaction: '-1' });
                return;
              }
              const pending = validateRuns.find(r => r.status !== 'completed');
              if (pending) {
                await postSkip(prNumber, `Validate is still ${pending.status}; wait for it to finish, then re-comment.`, { reaction: '-1' });
                return;
              }
              const completed = validateRuns
                .filter(r => r.status === 'completed')
                .sort((a, b) => new Date(b.run_started_at || b.created_at) - new Date(a.run_started_at || a.created_at));
              const latest = completed[0];
              if (!latest || latest.conclusion !== 'success') {
                await postSkip(prNumber, `Latest validate run is \`${latest?.conclusion ?? 'unknown'}\`; deploy refused.`, { reaction: '-1' });
                return;
              }

              core.setOutput('pr_number', String(prNumber));
              core.setOutput('head_sha', pr.head.sha);
              core.setOutput('short_sha', pr.head.sha.substring(0, 7));
              core.setOutput('ref', pr.head.ref);
              core.setOutput('base_ref', pr.base.ref);
              core.setOutput('trigger_path', 'comment');
              core.setOutput('deployer', username);
              return;
            }

            // ──────────────────────────────────────────────────────────
            // workflow_run path (shopify-sync or dependabot/**).
            // ──────────────────────────────────────────────────────────
            // Defensive: workflow-level if: should have rejected anything
            // other than issue_comment or workflow_run, but make the
            // unreachable case loud rather than silently mis-routing.
            if (eventName !== 'workflow_run') {
              core.setFailed(`Unexpected event_name \`${eventName}\`; expected issue_comment or workflow_run.`);
              return;
            }
            // Re-fetch the triggering run by id. This is the TRUSTED source
            // for head_sha (the event payload can be replayed; getWorkflowRun
            // returns the live record). Re-assert conclusion=success in case
            // the run was retried or its status mutated between dispatch and
            // execution.
            const { data: run } = await github.rest.actions.getWorkflowRun({
              owner, repo, run_id: context.payload.workflow_run.id,
            });
            if (run.status !== 'completed' || run.conclusion !== 'success') {
              core.setFailed(`Triggering validate run not green (${run.status}/${run.conclusion}).`);
              return;
            }
            if (!run.head_sha) {
              core.setFailed('workflow_run has no head_sha; cannot pin trusted SHA.');
              return;
            }
            const trustedSha = run.head_sha;
            const headBranch = run.head_branch || '';

            // Defensive head_branch routing. The on.workflow_run.branches
            // filter already narrows to shopify-sync and dependabot/**, but
            // re-assert here on the trusted-source value (not the event
            // payload's head_branch).
            let triggerPath, expectedBot, headRefForLookup;
            if (headBranch === 'shopify-sync') {
              triggerPath = 'shopify-sync';
              expectedBot = 'shopify[bot]';
              headRefForLookup = 'shopify-sync';
            } else if (headBranch.startsWith('dependabot/')) {
              triggerPath = 'dependabot';
              expectedBot = 'dependabot[bot]';
              headRefForLookup = headBranch;
            } else {
              // workflow_run.branches filter should have prevented this, so
              // a warning is louder than info but not a hard failure (the
              // workflow filter is the real gate; this is belt-and-braces).
              core.warning(`Unexpected head_branch \`${headBranch}\`; nothing to do.`);
              return;
            }

            // Find the open PR. GitHub guarantees uniqueness of (state, head)
            // for open PRs, so per_page: 1 is sufficient and makes the
            // uniqueness assumption explicit.
            const { data: pulls } = await github.rest.pulls.list({
              owner, repo, state: 'open', head: `${owner}:${headRefForLookup}`, per_page: 1,
            });
            if (pulls.length === 0) {
              core.info(`No open PR from ${headRefForLookup}; nothing to deploy.`);
              return;
            }
            const pr = pulls[0];
            const prNumber = pr.number;

            if (!pr.head.repo || pr.head.repo.full_name !== sameRepoFull) {
              await postSkip(prNumber, `PR head is not in the origin repo (${pr.head.repo?.full_name}).`);
              return;
            }

            // HEAD drift: the trusted SHA from getWorkflowRun is what we will
            // deploy; if the PR has moved past it, abort. The next Validate
            // cycle on the new head fires a fresh workflow_run.
            if (pr.head.sha !== trustedSha) {
              await postSkip(prNumber, `HEAD drifted (validated \`${trustedSha.substring(0,7)}\`, current \`${pr.head.sha.substring(0,7)}\`). The next Validate cycle will retrigger.`);
              return;
            }
            // Defence in depth on top of the pr.head.sha === trustedSha
            // equality above. compareCommits returns 'identical' only when
            // the two refs resolve to the SAME commit object (not when trees
            // are the same but SHAs differ, despite the term's connotation);
            // a same-tree amend or cherry-pick produces a different SHA and
            // returns 'diverged'. So this assertion is functionally redundant
            // with the SHA equality above and exists to catch any path where
            // SHAs end up non-identical (force-push to a different tree,
            // same-tree amend, cherry-pick), including paths a future
            // refactor might accidentally introduce.
            try {
              const { data: cmp } = await github.rest.repos.compareCommits({
                owner, repo, base: trustedSha, head: pr.head.sha,
              });
              if (cmp.status !== 'identical') {
                await postSkip(prNumber, `compareCommits status is \`${cmp.status}\` (expected \`identical\`). Aborting.`);
                return;
              }
            } catch (e) {
              await postSkip(prNumber, `compareCommits failed: ${e.message}.`);
              return;
            }

            core.setOutput('pr_number', String(prNumber));
            core.setOutput('head_sha', trustedSha);
            core.setOutput('short_sha', trustedSha.substring(0, 7));
            core.setOutput('ref', pr.head.ref);
            core.setOutput('base_ref', pr.base.ref);
            core.setOutput('trigger_path', triggerPath);
            core.setOutput('deployer', expectedBot);

      - name: Auto-deploy gates - shopify-sync
        if: steps.resolve.outputs.trigger_path == 'shopify-sync'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ steps.resolve.outputs.pr_number }}
          TRUSTED_SHA: ${{ steps.resolve.outputs.head_sha }}
          EXPECTED_SYNC_PR_OPENER: ${{ vars.EXPECTED_SYNC_PR_OPENER }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prNumber = parseInt(process.env.PR_NUMBER, 10);
            const trustedSha = process.env.TRUSTED_SHA;
            const MARKER = '<!-- deploy-result -->';

            const upsertSticky = async (body) => {
              try {
                const comments = await github.paginate(github.rest.issues.listComments, {
                  owner, repo, issue_number: prNumber,
                });
                const existing = comments
                  .filter(c => c.body && c.body.includes(MARKER))
                  .sort((a, b) => a.id - b.id);
                const [keep, ...dupes] = existing;
                if (keep) {
                  await github.rest.issues.updateComment({ owner, repo, comment_id: keep.id, body });
                } else {
                  await github.rest.issues.createComment({ owner, repo, issue_number: prNumber, body });
                }
                for (const d of dupes) {
                  try { await github.rest.issues.deleteComment({ owner, repo, comment_id: d.id }); }
                  catch (_) { /* swallowed */ }
                }
              } catch (_) { /* non-critical */ }
            };

            const postSkip = async (reason) => {
              const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
              const body = [
                MARKER,
                '# Deployment Report',
                '',
                `:x: **Auto-deploy skipped** at **shopify-sync gates**. The PR remains open.`,
                '',
                '| | |',
                '|:--|:--|',
                `| **Reason** | ${reason} |`,
                `| **Workflow run** | [#${context.runNumber}](${runUrl}) |`,
              ].join('\n');
              await upsertSticky(body);
              core.setFailed(reason);
            };

            const { data: pr } = await github.rest.pulls.get({
              owner, repo, pull_number: prNumber,
            });

            // Draft-PR escape hatch: operator marks the auto-reconcile PR
            // as a draft to halt auto-deploy; convert to ready to resume.
            // Replaces the prior `manual-review` label mechanism.
            if (pr.draft) {
              await postSkip('PR is in draft state; auto-deploy skipped. Mark ready-for-review to resume.');
              return;
            }

            // Bot-identity gate on the underlying commits (NOT the PR opener).
            // After the SYNC_RECONCILE_TOKEN PAT switch, sync.yml's `gh pr
            // create` runs under a fine-grained PAT, so the auto-reconcile
            // PR's `pr.user.login` is the PAT owner's GitHub account (sourced
            // from the `EXPECTED_SYNC_PR_OPENER` repo variable), not
            // `github-actions[bot]` and not `shopify[bot]`. `pr.user.login`
            // is set once at create time; sync.yml's later `gh pr edit`
            // refreshes (which stay on GITHUB_TOKEN by design) do NOT change
            // it. The PR-opener identity is verified separately below to
            // match that variable; this proves "sync.yml or someone with the
            // PAT opened this PR" (a hand-opened shopify-sync PR by any
            // other identity fails that check).
            //
            // The integrity boundary on commit content is `author.login ===
            // shopify[bot]` AND `verification.verified === true`. The GPG /
            // SSH signature on a Shopify-bot commit is bound to that bot's
            // key; rewriting commit content invalidates the signature, so a
            // forged-content commit cannot pass both checks simultaneously.
            // Git-commit-header fields are NOT consulted (those are forgeable);
            // only API-resolved login fields and the API-asserted
            // signature-verification flag.
            //
            // `committer.login` is informational, not load-bearing. It can
            // legitimately be `shopify[bot]` (initial push, never rebased) OR
            // `web-flow` (GitHub's commit identity for any path that applies
            // a commit on a user's behalf: web-UI edits, Update-branch / Rebase
            // buttons, `PUT /contents/{path}` REST calls, etc.). web-flow is
            // not an unimpersonable identity - anyone with `contents: write`
            // can produce a web-flow-committed commit - so it must not be
            // treated as a security signal. Both committer values are
            // accepted to avoid false positives on rebased shopify[bot]
            // commits; the security property is preserved by author + signature.
            //
            // PR-opener trust delta vs the previous github-actions[bot] form:
            // the new expected value (PAT owner) is human-tied and
            // PAT-exfiltrable. Anyone who steals the SYNC_RECONCILE_TOKEN
            // secret could hand-open a stale-base shopify[bot] PR via that
            // identity. The defence-in-depth merge-base assertion below
            // (compareCommits behind_by===0) catches that attack: a stale
            // shopify-sync HEAD is missing main commits and the gate skips.
            // Residual surface is "current-base shopify[bot] commit replay,"
            // which can only ship content shopify[bot] genuinely authored.
            const { data: commit } = await github.rest.repos.getCommit({
              owner, repo, ref: trustedSha,
            });
            const verified = commit.commit?.verification?.verified === true;
            const authorLogin = commit.author?.login;
            const committerLogin = commit.committer?.login;
            // pr.user.login may be `null`/`undefined` for deleted accounts;
            // the empty-string fallback feeds the strict !== comparison below
            // and fails closed (do NOT "fix" the optional chaining).
            const prUserLogin = pr.user?.login;
            const expectedCommitBot = 'shopify[bot]';
            const expectedPrOpener = process.env.EXPECTED_SYNC_PR_OPENER || '';
            const acceptableCommitters = [expectedCommitBot, 'web-flow'];
            if (!expectedPrOpener) {
              await postSkip('EXPECTED_SYNC_PR_OPENER repo variable is unset; refusing to deploy without a verified PR-opener identity. Set it to the SYNC_RECONCILE_TOKEN PAT owner.');
              return;
            }
            if (!verified || authorLogin !== expectedCommitBot || !acceptableCommitters.includes(committerLogin)) {
              await postSkip(`Commit-identity gate failed (verified=${verified}, author=${authorLogin}, committer=${committerLogin}; expected author=${expectedCommitBot}, committer in {${expectedCommitBot}, web-flow}).`);
              return;
            }
            if (prUserLogin !== expectedPrOpener) {
              await postSkip(`PR-opener-identity gate failed (pr.user=${prUserLogin}; expected ${expectedPrOpener}, the SYNC_RECONCILE_TOKEN PAT owner). A hand-opened shopify-sync PR cannot auto-deploy; comment \`deploy\` manually to ship it.`);
              return;
            }

            // Base-staleness: catches "main advanced AFTER the PR was created."
            const { data: main } = await github.rest.repos.getBranch({
              owner, repo, branch: 'main',
            });
            if (main.commit.sha !== pr.base.sha) {
              await postSkip(`\`main\` advanced (base \`${pr.base.sha.substring(0,7)}\`, current \`${main.commit.sha.substring(0,7)}\`). sync.yml will refresh the PR and retrigger.`);
              return;
            }

            // Defence-in-depth merge-base assertion: catches "shopify-sync's
            // PR head was missing main commits AT PR-creation time," which
            // the base-staleness check above does NOT detect (it only
            // compares pr.base to current main, not pr.head's history).
            // This is the deploy-side mirror of sync.yml's prevention guard;
            // it catches misleading-revert PRs even when sync.yml's guard
            // is bypassed (hand-opened PR via PAT exfil). compareCommits
            // with base=main, head=pr.head reports `behind_by` = commits in
            // main that are NOT in pr.head's history.
            const { data: cmp } = await github.rest.repos.compareCommits({
              owner, repo, base: main.commit.sha, head: trustedSha,
            });
            if (cmp.behind_by > 0) {
              await postSkip(`PR head is missing ${cmp.behind_by} commit(s) from main (likely a stale shopify-sync state). A reconcile PR in this state would propose to revert those commits. Recover by force-pushing main onto shopify-sync; see CLAUDE.md "Token rotation call-site catalog" for the snippet.`);
              return;
            }

            // Diff sanity.
            let files = [];
            const perPage = 100;
            for (let page = 1; ; page++) {
              const { data: pageFiles } = await github.rest.pulls.listFiles({
                owner, repo, pull_number: prNumber, per_page: perPage, page,
              });
              files = files.concat(pageFiles);
              if (pageFiles.length < perPage) break;
              if (page > 50) break;
            }
            const protectedHits = files.filter(f =>
              f.filename.startsWith('.github/') ||
              f.filename === 'layout/theme.liquid'
            );
            if (protectedHits.length > 0) {
              await postSkip(`Diff touches protected paths: ${protectedHits.map(f => f.filename).slice(0, 5).join(', ')}.`);
              return;
            }
            const totalLoc = files.reduce((sum, f) => sum + (f.additions ?? 0) + (f.deletions ?? 0), 0);
            if (totalLoc > 1000) {
              await postSkip(`Diff exceeds 1000 LOC (${totalLoc}); admin edits should not be that large.`);
              return;
            }

      - name: Auto-deploy gates - dependabot
        if: steps.resolve.outputs.trigger_path == 'dependabot'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ steps.resolve.outputs.pr_number }}
          TRUSTED_SHA: ${{ steps.resolve.outputs.head_sha }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prNumber = parseInt(process.env.PR_NUMBER, 10);
            const trustedSha = process.env.TRUSTED_SHA;
            const expectedBot = 'dependabot[bot]';
            const MARKER = '<!-- deploy-result -->';

            const upsertSticky = async (body) => {
              try {
                const comments = await github.paginate(github.rest.issues.listComments, {
                  owner, repo, issue_number: prNumber,
                });
                const existing = comments
                  .filter(c => c.body && c.body.includes(MARKER))
                  .sort((a, b) => a.id - b.id);
                const [keep, ...dupes] = existing;
                if (keep) {
                  await github.rest.issues.updateComment({ owner, repo, comment_id: keep.id, body });
                } else {
                  await github.rest.issues.createComment({ owner, repo, issue_number: prNumber, body });
                }
                for (const d of dupes) {
                  try { await github.rest.issues.deleteComment({ owner, repo, comment_id: d.id }); }
                  catch (_) { /* swallowed */ }
                }
              } catch (_) { /* non-critical */ }
            };

            const postSkip = async (reason) => {
              const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
              const body = [
                MARKER,
                '# Deployment Report',
                '',
                `:x: **Auto-deploy skipped** at **dependabot gates**. The PR remains open.`,
                '',
                '| | |',
                '|:--|:--|',
                `| **Reason** | ${reason} |`,
                `| **Workflow run** | [#${context.runNumber}](${runUrl}) |`,
              ].join('\n');
              await upsertSticky(body);
              core.setFailed(reason);
            };

            const { data: pr } = await github.rest.pulls.get({
              owner, repo, pull_number: prNumber,
            });

            // Draft-PR escape hatch: operator converts the Dependabot PR to
            // a draft to halt auto-deploy; convert to ready to resume.
            // Replaces the prior `manual-review` label mechanism.
            if (pr.draft) {
              await postSkip('PR is in draft state; auto-deploy skipped. Mark ready-for-review to resume.');
              return;
            }

            // Bot identity. The integrity boundary on commit content is
            // `author.login === dependabot[bot]` AND `verification.verified
            // === true`. Dependabot's commits are signed with its own key;
            // rewriting commit content invalidates the signature, so a
            // forged-content commit cannot pass both checks simultaneously.
            // `pr.user.login === dependabot[bot]` further requires the PR
            // itself to have been opened by Dependabot (a hand-crafted PR
            // mimicking Dependabot's commit shape would fail this).
            //
            // `committer.login` is informational, not load-bearing. It can
            // legitimately be `dependabot[bot]` (initial push, never rebased)
            // OR `web-flow` (GitHub's commit identity for any path that
            // applies a commit on a user's behalf: web-UI edits, Update-branch
            // / Rebase buttons, `PUT /contents/{path}` REST calls,
            // `@dependabot rebase`, `@dependabot recreate`, etc.). web-flow
            // is NOT an unimpersonable identity - anyone with `contents:
            // write` can produce a web-flow-committed commit - so it must
            // not be treated as a security signal. Both committer values are
            // accepted to avoid false positives on rebased dependabot[bot]
            // commits; the security property is preserved by author +
            // signature + PR-opener identity.
            const { data: commit } = await github.rest.repos.getCommit({
              owner, repo, ref: trustedSha,
            });
            const verified = commit.commit?.verification?.verified === true;
            const authorLogin = commit.author?.login;
            const committerLogin = commit.committer?.login;
            const prUserLogin = pr.user?.login;
            const acceptableCommitters = [expectedBot, 'web-flow'];
            if (!verified || authorLogin !== expectedBot || !acceptableCommitters.includes(committerLogin) || prUserLogin !== expectedBot) {
              await postSkip(`Bot-identity gate failed (verified=${verified}, author=${authorLogin}, committer=${committerLogin}, pr.user=${prUserLogin}; expected author=${expectedBot}, committer in {${expectedBot}, web-flow}, pr.user=${expectedBot}).`);
              return;
            }

            // Base-staleness.
            const { data: main } = await github.rest.repos.getBranch({
              owner, repo, branch: 'main',
            });
            if (main.commit.sha !== pr.base.sha) {
              await postSkip(`\`main\` advanced (base \`${pr.base.sha.substring(0,7)}\`, current \`${main.commit.sha.substring(0,7)}\`); waiting for Dependabot to rebase.`);
              return;
            }

            // Defence-in-depth merge-base assertion (mirrors the shopify-sync
            // arm). The base-staleness check above asserts that pr.base equals
            // main's current tip; in Dependabot's normal flow this is also
            // sufficient because Dependabot rebases its own PRs on every push
            // and updates `pr.base.sha`. The merge-base assertion adds belt
            // and braces against a hypothetical future Dependabot behaviour
            // change where a PR could carry a current pr.base but a head SHA
            // missing main commits (e.g. a partial-rebase race). Same shape
            // as the shopify-sync gate's assertion.
            const { data: cmp } = await github.rest.repos.compareCommits({
              owner, repo, base: main.commit.sha, head: trustedSha,
            });
            if (cmp.behind_by > 0) {
              await postSkip(`PR head is missing ${cmp.behind_by} commit(s) from main (PR base passed staleness check but PR head's history is not on top of main). \`@dependabot rebase\` to refresh.`);
              return;
            }

            // CI-self-modification guard.
            let files = [];
            const perPage = 100;
            for (let page = 1; ; page++) {
              const { data: pageFiles } = await github.rest.pulls.listFiles({
                owner, repo, pull_number: prNumber, per_page: perPage, page,
              });
              files = files.concat(pageFiles);
              if (pageFiles.length < perPage) break;
              if (page > 50) break;
            }
            const ciHits = files.filter(f =>
              f.filename.startsWith('.github/workflows/') ||
              f.filename.startsWith('.github/actions/') ||
              f.filename.startsWith('.github/scripts/')
            );
            if (ciHits.length > 0) {
              await postSkip(`Dependabot PR modifies CI files (\`${ciHits[0].filename}\`); auto-deploy refused. Apply manually with \`deploy\` comment.`);
              return;
            }

            // Major-version detection. Major bumps default-skip auto-deploy
            // (no label opt-in available); operator comments `deploy` on the
            // PR after review to ship a major bump.
            //
            // Two independent signals are consulted and the gate fails closed
            // when both come up empty:
            //   1. PRIMARY: parse Dependabot's structured commit trailers via
            //      pulls.listCommits. Every Dependabot commit includes a block
            //      like:
            //        updated-dependencies:
            //        - dependency-name: actions/github-script
            //          dependency-version: 9.0.0
            //          dependency-type: direct:production
            //          update-type: version-update:semver-major
            //      Grouped-update PRs include one such block per dep in the
            //      same commit. We read every `update-type:` trailer across
            //      every commit on the PR; any `semver-major` value triggers
            //      the postSkip. Authoritative for grouped-update PRs whose
            //      title and body are non-parseable free-form prose.
            //
            //      Prior implementation used dependabot/fetch-metadata@v3.1.0
            //      as a separate step. The action only supports `pull_request`
            //      and `pull_request_target` events; in our `workflow_run`-
            //      triggered gate it hard-failed with "Event payload missing
            //      `pull_request` key", blocking every Dependabot auto-deploy.
            //      The inline trailer parse is the action's own underlying
            //      data source (Dependabot's documented commit-trailer
            //      contract); no dependency, no payload requirement.
            //   2. SECONDARY: parse "Bump|Updates <dep> from A to B" lines
            //      from the PR title and body. Catches:
            //        - A future Dependabot version dropping the structured
            //          commit trailer.
            //        - The trailer parse failing silently (e.g. permissions
            //          issue on listCommits).
            //      The version pattern is permissive (two-segment versions,
            //      leading-v, prerelease / build-metadata suffixes); a major
            //      bump is "first numeric component differs."
            //   3. FAIL-CLOSED: if BOTH signals come up empty on a PR whose
            //      identity already matched dependabot[bot] above, the gate
            //      cannot determine bump severity and must postSkip. Without
            //      this, an unparseable PR would auto-deploy on the implicit
            //      assumption that the absence of "major" signals means
            //      "non-major" - exactly the failure mode we're guarding
            //      against if Dependabot ever changes its output format.
            const prCommits = await github.paginate(github.rest.pulls.listCommits, {
              owner, repo, pull_number: prNumber,
            });
            const trailerRegex = /update-type:\s*version-update:semver-(major|minor|patch|prerelease)/gi;
            const updateTypes = [];
            for (const c of prCommits) {
              const msg = c.commit?.message || '';
              for (const m of msg.matchAll(trailerRegex)) {
                updateTypes.push(m[1].toLowerCase());
              }
            }
            const isMajorByTrailer = updateTypes.includes('major');

            const text = `${pr.title}\n${pr.body || ''}`;
            const lineRegex = /\b(?:Bump|Updates)\s+[`']?[\S]+?[`']?\s+from\s+(v?\d+(?:\.\d+){0,3}(?:[-+][\w.]+)?)\s+to\s+(v?\d+(?:\.\d+){0,3}(?:[-+][\w.]+)?)/gi;
            const extractMajor = (v) => {
              const mm = String(v).match(/^v?(\d+)/);
              return mm ? parseInt(mm[1], 10) : null;
            };
            const matches = Array.from(text.matchAll(lineRegex));
            const majorBumps = matches
              .map(mm => ({ raw: mm[0].trim(), from: extractMajor(mm[1]), to: extractMajor(mm[2]) }))
              .filter(x => x.from != null && x.to != null && x.from !== x.to);

            if (isMajorByTrailer || majorBumps.length > 0) {
              const detail = isMajorByTrailer
                ? `commit trailer reports semver-major across ${updateTypes.filter(t => t === 'major').length} dep(s)`
                : majorBumps.map(x => x.raw).slice(0, 3).join('; ') + (majorBumps.length > 3 ? ` (+${majorBumps.length - 3} more)` : '');
              await postSkip(`Major-version bump(s) detected: ${detail}. Auto-deploy refused for safety. Review the PR and comment \`deploy\` to ship.`);
              return;
            }

            if (updateTypes.length === 0 && matches.length === 0) {
              await postSkip('Could not determine bump severity: no `update-type` commit trailer found and the PR title/body contained no parseable `Bump|Updates X from A to B` lines. Manual review required: comment `deploy` to ship after verifying the bump severity.');
              return;
            }

      # Compute theme_touched for ALL trigger paths (comment / shopify-sync /
      # dependabot). A custom step-level `if:` strips the implicit success()
      # check, so success() is stated explicitly to skip this step once a prior
      # gate step calls core.setFailed. (Even without it the deploy job is
      # skipped when the gate job fails via the job-level needs-skip, but the
      # explicit success() keeps the intent local and matches the Smoke step's
      # convention in action.yml.)
      - name: Compute theme-file scope
        id: theme_scope
        if: success() && steps.resolve.outputs.pr_number != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ steps.resolve.outputs.pr_number }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prNumber = parseInt(process.env.PR_NUMBER, 10);
            // The 8 theme roots Shopify ships. Trailing-slash-anchored so a
            // top-level file named e.g. `assets` (no dir) or `docs/assets/x`
            // does NOT false-match; only real theme-dir paths count.
            const THEME_ROOTS = ['assets/', 'blocks/', 'config/', 'layout/', 'locales/', 'sections/', 'snippets/', 'templates/'];
            const inTheme = (name) => !!name && THEME_ROOTS.some((root) => name.startsWith(root));
            let touched = 'true'; // fail-safe default: push unless proven docs-only
            try {
              const files = await github.paginate(github.rest.pulls.listFiles, {
                owner, repo, pull_number: prNumber, per_page: 100,
              });
              // A file counts if its current path is under a theme root, OR it
              // was renamed OUT of one (previous_filename): renaming
              // snippets/x.liquid -> docs/x.liquid deletes a live theme file and
              // must still trigger a push, or live drifts from main undetected.
              touched = files.some((f) => inTheme(f.filename) || inTheme(f.previous_filename)) ? 'true' : 'false';
              core.info(`theme_touched=${touched} (${files.length} file(s) in PR #${prNumber})`);
            } catch (e) {
              core.warning(`Could not list PR #${prNumber} files (${e.message}); defaulting theme_touched=true (fail-safe push).`);
              touched = 'true';
            }
            core.setOutput('theme_touched', touched);

  deploy:
    name: deploy
    needs: gate
    # Only run if gate produced a pr_number. The gate's resolve step exits
    # early without setting outputs for "no open PR" cases (e.g. a stray
    # workflow_run firing with no associated PR).
    if: needs.gate.outputs.pr_number != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write          # git push to shopify-sync
      pull-requests: write     # pulls.merge + sticky comment
      issues: write            # createForIssueComment reactions (rocket / -1)
      actions: read            # forward-compat: any future step that reads
                               # workflow runs (e.g. to surface the Validate
                               # run id in the deploy report) needs this; the
                               # gate already has it for listWorkflowRuns and
                               # the grant is harmless when unused
    concurrency:
      # Serialises live-theme writes across all three trigger paths. With the
      # unified workflow the comment-driven and auto-deploy paths now contend
      # for the same lock, which can fire base-staleness rejections on the
      # auto-deploy paths if a comment-deploy lands first; auto-deploy self-
      # heals via Dependabot rebase / sync-PR refresh.
      group: deploy-production
      cancel-in-progress: false
    env:
      LIVE_THEME_ID: "181702754604"
    outputs:
      deployed_sha: ${{ steps.merge.outputs.deployed_sha }}
    steps:
      - name: Checkout trusted SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Default fetch-depth (1) is sufficient: the deploy job uses only
          # API calls (pulls.merge, theme push, github-script reports) after
          # this point; nothing reads git history locally. The sync job has
          # its own checkout with fetch-depth: 0 for --force-with-lease.
          ref: ${{ needs.gate.outputs.head_sha }}
          persist-credentials: false

      - name: Live theme push
        id: push
        # Skip the entire push+smoke action for a PR that touches no theme
        # files (docs / scripts / .github only). The action runs both the live
        # push and the smoke step, so gating here skips both; the merge + sync
        # steps below still run, so the PR merges and fast-forwards shopify-sync
        # without touching live. This is the permanent fix for the #56 class
        # (a docs-only PR false-failing the smoke). A skipped step reports
        # outcome == 'skipped', which the report step keys on.
        if: needs.gate.outputs.theme_touched == 'true'
        uses: ./.github/actions/shopify-theme-push
        with:
          mode: live
          shopify-cli-theme-token: ${{ secrets.SHOPIFY_CLI_THEME_TOKEN }}
          shopify-flag-store: ${{ vars.SHOPIFY_FLAG_STORE }}
          live-theme-id: ${{ env.LIVE_THEME_ID }}
          # format() collapses to '' when vars.SHOPIFY_DOMAIN is unset/empty,
          # so the action falls back to the legacy myshopify probe instead of
          # silently constructing the malformed URL `https://`.
          smoke-base-url: ${{ vars.SHOPIFY_DOMAIN && format('https://{0}', vars.SHOPIFY_DOMAIN) || '' }}
          # Optional storefront password: enables locked-mode content probing in
          # the smoke while the store is pre-launch. Repo SECRET, isolated to
          # this job. Empty (absent secret) -> smoke soft-warns, not hard-fails.
          storefront-password: ${{ secrets.STOREFRONT_PASSWORD }}

      - name: Setup Shopify CLI (docs-only)
        # Docs-only counterpart to the push above: no theme files changed, so
        # there is nothing to push, but the deploy report still shows what's
        # currently live. Read-only (`theme list`), reuses the token already
        # scoped to this job; continue-on-error so a Shopify API hiccup can
        # never block a docs-only merge from closing.
        id: live_theme_info
        if: success() && needs.gate.outputs.theme_touched == 'false'
        continue-on-error: true
        uses: ./.github/actions/setup-shopify-cli

      - name: Query live theme
        id: live_theme_query
        # Chained on the setup step's own success so a CLI-setup failure
        # doesn't also produce an uncorrelated failed `npx shopify` log entry
        # underneath it; both are continue-on-error, so the net effect is the
        # same either way (comment falls back to "unknown").
        if: success() && needs.gate.outputs.theme_touched == 'false' && steps.live_theme_info.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          SHOPIFY_CLI_THEME_TOKEN: ${{ secrets.SHOPIFY_CLI_THEME_TOKEN }}
          SHOPIFY_FLAG_STORE: ${{ vars.SHOPIFY_FLAG_STORE }}
          SHOPIFY_CLI_TTY: "0"
          CI: "1"
          SHOPIFY_FLAG_NO_COLOR: "true"
        run: |
          set +x
          set -euo pipefail
          npx shopify theme list --json > themes.json
          # No updated_at field exists on this output: `theme list --json`
          # returns only {id, name, processing, createdAtRuntime, role} (per
          # the installed @shopify/cli's own theme-object formatter);
          # createdAtRuntime is a boolean session flag, not a timestamp.
          ID=$(jq -r '[.[] | select(.role=="live")][0].id // ""' themes.json)
          NAME=$(jq -r '[.[] | select(.role=="live")][0].name // "unknown"' themes.json)
          {
            echo "live_theme_id=${ID}"
            echo "live_theme_name=${NAME}"
          } >> "$GITHUB_OUTPUT"

      - name: Delete preview theme
        id: cleanup
        # Gated on live push success (not merge success): the preview becomes
        # obsolete the moment live serves the new code, regardless of whether
        # the squash-merge has happened yet. Running cleanup BEFORE merge means
        # the operator sees the preview-deletion sticky and the deploy report
        # update on an open PR, with the merge as the final user-visible event.
        #
        # Skipped for Dependabot auto-deploys: preview.yml::deploy-preview is
        # already conditionally skipped for Dependabot PRs (no Shopify token in
        # the Dependabot secrets scope), so there is never a `pr-N-preview`
        # theme to delete on this path. Running the cleanup anyway would
        # produce a misleading ":broom: Preview cleanup: no preview theme
        # found." line in every Dependabot deploy report.
        #
        # Trade-off: a runner crash between cleanup and merge leaves the system
        # in `live deployed + PR open + preview gone`. Live is already serving
        # the new code, so the preview's verification value is moot at this
        # point; the operator merges the PR manually and the system reconverges.
        if: success() && needs.gate.outputs.trigger_path != 'dependabot'
        continue-on-error: true
        uses: ./.github/actions/shopify-theme-push
        with:
          mode: delete-preview
          shopify-cli-theme-token: ${{ secrets.SHOPIFY_CLI_THEME_TOKEN }}
          shopify-flag-store: ${{ vars.SHOPIFY_FLAG_STORE }}
          pr-number: ${{ needs.gate.outputs.pr_number }}

      - name: Update preview comment
        # Updates the `<!-- preview -->` sticky comment originally posted by
        # preview.yml::deploy-preview (saying "Preview theme deployed") to
        # reflect that the preview theme has been deleted by the step above.
        #
        # Runs BEFORE the squash-merge so the operator sees this update on
        # the still-open PR; the merge is the final user-visible event in
        # the chain. preview.yml::cleanup, which would normally update this
        # sticky on `pull_request: closed`, never fires for deploy-chain
        # merges because GitHub suppresses downstream events from
        # GITHUB_TOKEN-driven actions, so the inline update here is the
        # only path that closes the UX gap.
        #
        # Skipped for Dependabot auto-deploys: preview.yml::deploy-preview is
        # skipped for those PRs so there is no preview sticky to update,
        # and the cleanup step above is also skipped (no theme to delete).
        if: success() && needs.gate.outputs.trigger_path != 'dependabot'
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ needs.gate.outputs.pr_number }}
          CLEANUP_OUTCOME: ${{ steps.cleanup.outcome }}
          CLEANUP_STATUS: ${{ steps.cleanup.outputs.cleanup-status }}
        with:
          script: |
            const marker = '<!-- preview -->';
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prNumber = parseInt(process.env.PR_NUMBER, 10);
            const cleanupOutcome = process.env.CLEANUP_OUTCOME || '';
            const cleanupStatus = process.env.CLEANUP_STATUS || '';

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: prNumber,
            });
            const existing = comments
              .filter(c => c.body && c.body.includes(marker))
              .sort((a, b) => a.id - b.id);
            if (existing.length === 0) {
              // No prior preview sticky (e.g. Dependabot PR). Do not create
              // one just to mark it deleted; that would surprise the operator.
              return;
            }

            const body = cleanupOutcome === 'success'
              ? [marker, '# Preview Deployment', '', '🗑️ **Preview theme deleted.** Live theme is now serving this commit.'].join('\n')
              : [
                  marker,
                  '# Preview Deployment',
                  '',
                  `⚠️ **Preview theme cleanup warning.** Live theme is serving this commit but preview deletion may have failed (${cleanupStatus || 'see deploy report'}). Delete manually if the theme persists: \`npx shopify theme delete --theme <id> --force\`.`,
                ].join('\n');

            const [keep, ...dupes] = existing;
            await github.rest.issues.updateComment({
              owner, repo, comment_id: keep.id, body,
            });
            for (const dup of dupes) {
              try {
                await github.rest.issues.deleteComment({
                  owner, repo, comment_id: dup.id,
                });
              } catch (_) { /* swallowed */ }
            }

      - name: React with rocket
        # Reacts on the comment-deploy `deploy` comment now that live push +
        # cleanup + preview-sticky update have all succeeded. Runs BEFORE the
        # squash-merge so the operator gets the rocket on the still-open PR,
        # matching the "deploy report and other actions happen before merge"
        # ordering this chain now follows.
        if: success() && github.event_name == 'issue_comment'
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'rocket',
            });

      - name: Post deploy report
        # Posted BEFORE the squash-merge. The deploy report covers push, smoke
        # test, and preview cleanup; merge and shopify-sync status are
        # deliberately NOT in the body because neither has run yet (the merge
        # step follows; sync follows the merge). The PR's GitHub-rendered
        # "Merged" badge becomes the merge confirmation once the merge step
        # closes the PR; sync status is observable only via the workflow log
        # (sync.yml's daily cron + admin-push retrigger are the self-heal).
        #
        # On merge failure, the merge step calls core.setFailed; the Report
        # failure step then overwrites this sticky with a merge-specific error
        # message.
        if: success()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ needs.gate.outputs.pr_number }}
          PR_SHORT_SHA: ${{ needs.gate.outputs.short_sha }}
          PR_REF: ${{ needs.gate.outputs.ref }}
          PR_BASE_REF: ${{ needs.gate.outputs.base_ref }}
          TRIGGER_PATH: ${{ needs.gate.outputs.trigger_path }}
          DEPLOYER: ${{ needs.gate.outputs.deployer }}
          PUSH_OUTPUT: ${{ steps.push.outputs.push-output }}
          PUSH_OUTCOME: ${{ steps.push.outcome }}
          SMOKE_OUTPUT: ${{ steps.push.outputs.smoke-output }}
          SMOKE_EXIT_CODE: ${{ steps.push.outputs.smoke-exit-code }}
          THEME_ID: ${{ steps.push.outputs.theme-id }}
          LIVE_THEME_ID: ${{ env.LIVE_THEME_ID }}
          QUERIED_LIVE_THEME_ID: ${{ steps.live_theme_query.outputs.live_theme_id }}
          LIVE_THEME_NAME: ${{ steps.live_theme_query.outputs.live_theme_name }}
          CLEANUP_STATUS: ${{ steps.cleanup.outputs.cleanup-status }}
          CLEANUP_OUTCOME: ${{ steps.cleanup.outcome }}
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const path = require('node:path');
            // Shared helper; see .github/scripts/with-retry.js for why it is a
            // file and why the path must be absolute.
            const { makeWithRetry } = require(
              path.resolve(process.env.GITHUB_WORKSPACE, '.github/scripts/with-retry.js')
            );
            const withRetry = makeWithRetry(core);

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const MARKER = '<!-- deploy-result -->';
            const prNumber = parseInt(process.env.PR_NUMBER, 10);
            const shortSha = process.env.PR_SHORT_SHA;
            const ref = process.env.PR_REF;
            const baseRef = process.env.PR_BASE_REF;
            const triggerPath = process.env.TRIGGER_PATH;
            const deployer = process.env.DEPLOYER;
            const pushOutcome = process.env.PUSH_OUTCOME || '';
            const smokeExitCode = process.env.SMOKE_EXIT_CODE || '';
            // Push+smoke skipped for a docs/scripts-only PR (theme_touched=false).
            const pushSkipped = pushOutcome === 'skipped';
            const pushOutput = process.env.PUSH_OUTPUT || 'No output captured.';
            const smokeOutput = process.env.SMOKE_OUTPUT || '';
            // Smoke exited 0 but surfaced at least one SOFT-WARN (throttle,
            // enumeration skipped, or wrong/absent password). Deploy proceeds;
            // the report flags it so it is not mistaken for a clean pass.
            const smokeSoftWarned = !pushSkipped && smokeExitCode === '0' && /SOFT-WARN/.test(smokeOutput);
            const themeId = process.env.THEME_ID || '';
            const liveThemeId = process.env.LIVE_THEME_ID || '';
            const queriedLiveThemeId = process.env.QUERIED_LIVE_THEME_ID || '';
            const liveThemeName = process.env.LIVE_THEME_NAME || '';
            // The docs-only report displays liveThemeId (the hardcoded
            // constant this pipeline assumes is live), but the query above
            // independently asked Shopify what is actually live right now.
            // If they disagree, that's the out-of-band-change scenario this
            // repo's docs call out ("no automated drift detection; live =
            // main is operator discipline") actually happening; say so
            // instead of silently showing the assumed ID next to real data.
            const liveThemeIdDrift = pushSkipped && queriedLiveThemeId && queriedLiveThemeId !== liveThemeId;
            const cleanupStatus = process.env.CLEANUP_STATUS || '';
            const cleanupOutcome = process.env.CLEANUP_OUTCOME || '';
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;

            // Dynamically import the report-formatting helpers from the
            // checked-out (trusted) SHA, not main's HEAD. Wrapped so an
            // import failure or an unanticipated render exception can never
            // suppress this report; on failure everything falls back to the
            // pre-existing raw-text rendering.
            //
            // Trust-boundary note: "trusted" above means the gate/signed-
            // commit/merge-base chain verified this SHA's permissions and
            // (for auto-deploy paths) bot identity, NOT that it was vetted
            // for .github/-directory tampering the way the shopify-sync and
            // dependabot paths explicitly are. This import pulls PR-branch
            // content (report-format.mjs) into execution inside the same
            // github-script process that holds this job's contents:write /
            // pull-requests:write token, for the comment-deploy path too.
            // Accepted under this repo's existing threat model ("a
            // compromised contents:write collaborator... could already
            // exfiltrate any secret via a malicious workflow change"; see
            // CLAUDE.md's Deploy gate trust delta), not a categorically new
            // hole, but it is a real, deliberate widening from the prior
            // Shopify-token-only exposure on this specific path.
            let renderSmokeMarkdownTable, formatLiveThemeRow, formatLastDeployRow;
            try {
              const mod = await import(
                pathToFileURL(path.resolve(process.env.GITHUB_WORKSPACE, '.github/actions/shopify-theme-push/report-format.mjs')).href
              );
              ({ renderSmokeMarkdownTable, formatLiveThemeRow, formatLastDeployRow } = mod);
            } catch (e) {
              core.warning(`report-format.mjs import failed (${e.message}); falling back to raw output.`);
            }

            // Last-actually-deployed marker (docs-only path only). A 404 is
            // the expected "no marker yet" case (pre-feature, or the very
            // first-ever deploy was docs-only) and stays silent; anything
            // else is a real problem and should not look identical to that.
            let lastDeploySha = '', lastDeployMsg = '', lastDeployDate = '';
            if (pushSkipped) {
              try {
                const { data: markerRef } = await github.rest.git.getRef({ owner, repo, ref: 'deploy-markers/live' });
                const { data: commit } = await github.rest.repos.getCommit({ owner, repo, ref: markerRef.object.sha });
                lastDeploySha = commit.sha.substring(0, 7);
                lastDeployMsg = (commit.commit.message || '').split('\n')[0];
                // committer.date, not author.date: the marker's own write
                // guard (Record live-deploy marker) orders by committer.date
                // (the API-set squash-merge time, monotonic across deploys),
                // so the displayed date must match what actually gated the
                // write, not the original PR commit's authoring time.
                lastDeployDate = commit.commit.committer?.date || '';
              } catch (e) {
                if (e.status !== 404) core.warning(`Could not read live-deploy marker: ${e.message}`);
              }
            }

            const titleByPath = {
              'comment': 'Deployment Report',
              'shopify-sync': 'Auto-deploy Report (shopify-sync)',
              'dependabot': 'Auto-deploy Report (dependabot)',
            };
            const title = titleByPath[triggerPath] || 'Deployment Report';

            // cleanupOutcome reflects the Delete preview theme step. Empty
            // when the step was skipped (Dependabot path). The skipped case
            // is rendered with a neutral info line since there is no preview
            // theme to delete on that path by design.
            let cleanupLine;
            if (cleanupOutcome === 'success') {
              cleanupLine = `:broom: Preview cleanup: ${cleanupStatus || 'no preview theme found'}.`;
            } else if (cleanupOutcome === 'skipped' || cleanupOutcome === '') {
              cleanupLine = ':information_source: Preview cleanup skipped (no preview for this trigger path).';
            } else {
              cleanupLine = `:warning: **Preview cleanup warning:** ${cleanupStatus || 'see workflow run for details'}. The preview theme may have leaked; delete it manually with \`npx shopify theme delete --theme <id> --force\`.`;
            }

            const headline = pushSkipped
              ? ':page_facing_up: **Docs-only PR.** No theme files changed, so the live theme was not touched. This PR was merged and `shopify-sync` fast-forwarded without a deploy.'
              : ':white_check_mark: **Live theme deployed.** Storefront is now serving this commit.';

            const body = [
              MARKER,
              `# ${title}`,
              '',
              headline,
            ];
            if (smokeSoftWarned) {
              body.push(
                '',
                ':warning: **Smoke soft-warning:** the deploy proceeded, but one or more probes were inconclusive (throttling, product-enumeration skipped, or password fallback). See the Smoke test section below.',
              );
            }
            if (liveThemeIdDrift) {
              body.push(
                '',
                `:warning: **Live theme ID drift detected:** this pipeline assumes \`${liveThemeId}\`, but Shopify currently reports \`${queriedLiveThemeId}\` as live. The live theme may have changed out-of-band; investigate before trusting this report's "unchanged" framing.`,
              );
            }
            body.push(
              '',
              '| | |',
              '|:--|:--|',
              `| **Commit** | \`${shortSha}\` |`,
              `| **Branch** | \`${ref}\` -> \`${baseRef}\` |`,
            );
            if (pushSkipped) {
              const liveThemeRow = formatLiveThemeRow
                ? formatLiveThemeRow({ liveThemeName, liveThemeId })
                : `\`${liveThemeName || 'unknown'}\` (ID \`${liveThemeId}\`)`;
              const lastDeployRow = formatLastDeployRow
                ? formatLastDeployRow({ lastDeploySha, lastDeployMsg, lastDeployDate })
                : (lastDeploySha ? `\`${lastDeploySha}\`: ${lastDeployMsg} (${lastDeployDate})` : '_no marker found_');
              body.push(
                `| **Live theme (unchanged)** | ${liveThemeRow} |`,
                `| **Last live deploy (this pipeline)** | ${lastDeployRow} |`,
              );
            } else {
              body.push(`| **Theme ID** | \`${themeId}\` |`);
            }
            body.push(
              `| **Deployed by** | ${deployer.startsWith('@') ? deployer : (triggerPath === 'comment' ? '@' + deployer : deployer)} |`,
              `| **Workflow run** | [#${context.runNumber}](${runUrl}) |`,
              '',
              '---',
              '',
            );
            if (!pushSkipped) {
              let smokeSection;
              try {
                if (!renderSmokeMarkdownTable) throw new Error('renderer unavailable');
                const { summaryLine, markdown } = renderSmokeMarkdownTable(smokeOutput);
                smokeSection = [
                  `<details open><summary><strong>Smoke test</strong>: ${summaryLine}</summary>`,
                  '',
                  markdown,
                  '',
                  '</details>',
                ];
              } catch (e) {
                core.warning(`Smoke table rendering failed (${e.message}); falling back to raw output.`);
                smokeSection = [
                  '<details open><summary><strong>Smoke test</strong></summary>',
                  '',
                  '```',
                  smokeOutput || 'No output captured.',
                  '```',
                  '',
                  '</details>',
                ];
              }
              body.push(
                '<details><summary><strong>Push output</strong> (last 30 lines)</summary>',
                '',
                '```',
                pushOutput,
                '```',
                '',
                '</details>',
                '',
                ...smokeSection,
                '',
                '---',
                '',
              );
            }
            body.push(cleanupLine);
            const bodyText = body.join('\n');

            // Upsert sticky comment. github.paginate handles PRs with >100
            // comments (auto-reconcile PRs that accumulate daily-cron stale
            // notices), avoiding the duplicate-posting bug a bare listComments
            // call would produce when the existing sticky lives past page 1.
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: prNumber,
            });
            const existing = comments
              .filter(c => c.body && c.body.includes(MARKER))
              .sort((a, b) => a.id - b.id);
            const [keep, ...dupes] = existing;
            if (keep) {
              await withRetry(
                () => github.rest.issues.updateComment({ owner, repo, comment_id: keep.id, body: bodyText }),
                { attempts: 3, delayMs: 2000, label: 'Update deploy comment' }
              );
            } else {
              await withRetry(
                () => github.rest.issues.createComment({ owner, repo, issue_number: prNumber, body: bodyText }),
                { attempts: 3, delayMs: 2000, label: 'Post deploy comment' }
              );
            }
            for (const d of dupes) {
              try { await github.rest.issues.deleteComment({ owner, repo, comment_id: d.id }); }
              catch (_) { /* swallowed */ }
            }

      - name: Squash merge
        # Runs AFTER the deploy report, preview cleanup, sticky update, and
        # rocket reaction. The merge closes the PR; from the operator's
        # perspective the PR-close moment is the final user-visible event of
        # the deploy chain.
        #
        # On merge failure, calls core.setFailed so the job enters failure
        # mode and the Report failure step (below) overwrites the deploy
        # report sticky with a merge-specific error message. Without
        # setFailed, the success-path deploy-report sticky would persist
        # next to an unmerged PR, which is the surprising state to debug.
        id: merge
        if: success()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ needs.gate.outputs.pr_number }}
          PR_SHA: ${{ needs.gate.outputs.head_sha }}
          PR_REF: ${{ needs.gate.outputs.ref }}
          TRIGGER_PATH: ${{ needs.gate.outputs.trigger_path }}
        with:
          script: |
            // Shared helper; see .github/scripts/with-retry.js.
            const withRetry = require(
              require('node:path').resolve(process.env.GITHUB_WORKSPACE, '.github/scripts/with-retry.js')
            ).makeWithRetry(core);

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prNumber = parseInt(process.env.PR_NUMBER, 10);
            const sha = process.env.PR_SHA;
            const ref = process.env.PR_REF;
            const triggerPath = process.env.TRIGGER_PATH;

            // Pre-merge HEAD drift recheck for auto-deploy paths. Between the
            // gate's compareCommits and now, the PR tip could have moved. The
            // live deploy already shipped the trusted SHA; we cannot squash-
            // merge a different tree.
            let merged = true;
            let mergeError = '';
            let deployedSha = '';
            const { data: prNow } = await github.rest.pulls.get({
              owner, repo, pull_number: prNumber,
            });
            if (prNow.head.sha !== sha) {
              merged = false;
              mergeError = `HEAD drifted post-deploy (validated \`${sha.substring(0,7)}\`, current \`${prNow.head.sha.substring(0,7)}\`). Live theme is on the deployed SHA; PR left open.`;
            } else {
              try {
                const { data: mergeResult } = await withRetry(
                  () => github.rest.pulls.merge({
                    owner, repo, pull_number: prNumber, merge_method: 'squash',
                    // sha: TOCTOU guard. If the branch tip moved between
                    // checkout and merge, GitHub returns 409 and we surface
                    // "merge failed" rather than merging the wrong tree.
                    sha,
                  }),
                  { attempts: 3, delayMs: 2000, label: 'Squash merge' }
                );
                deployedSha = mergeResult.sha;
                // Defensive: the squash-merge API response is documented to
                // return the new merge-commit SHA in the `sha` field. Asserting
                // non-empty here means a future response-shape change can't
                // silently produce an empty refspec for the downstream sync
                // job (`git push origin :shopify-sync` would DELETE the
                // branch). The sync job is `needs: deploy` and reads this
                // value via `needs.deploy.outputs.deployed_sha`.
                if (!deployedSha) {
                  merged = false;
                  mergeError = 'merge API returned no SHA in response; refusing to push an empty refspec to shopify-sync.';
                }
              } catch (e) {
                merged = false;
                mergeError = e.message;
              }
            }

            // Long-lived branches must never be deleted. shopify-sync is the
            // Shopify-GitHub-Integration target; deleting it breaks the
            // admin-edit pipeline.
            const longLived = new Set(['main', 'shopify-sync']);
            const branchRetained = longLived.has(ref);
            let branchDeleted = false;
            if (merged && !branchRetained) {
              try {
                await withRetry(
                  () => github.rest.git.deleteRef({
                    owner, repo, ref: `heads/${ref}`,
                  }),
                  { attempts: 2, delayMs: 1000, label: 'Delete branch' }
                );
                branchDeleted = true;
              } catch (_) { /* swallowed */ }
            }

            core.setOutput('merged', merged ? 'true' : 'false');
            core.setOutput('merge_error', mergeError);
            core.setOutput('branch_deleted', branchDeleted ? 'true' : 'false');
            core.setOutput('branch_retained', branchRetained ? 'true' : 'false');
            core.setOutput('deployed_sha', deployedSha);

            // Fail the step on merge failure so the failure path (React
            // with -1 + Report failure) fires and overwrites the pre-merge
            // deploy-report sticky with a merge-specific error message.
            // Without this, the pre-merge sticky would persist next to an
            // unmerged PR with no indication that the merge step failed.
            if (!merged) {
              core.setFailed(mergeError);
            }

      - name: Record live-deploy marker
        # Force-moves refs/deploy-markers/live (deliberately outside
        # refs/tags/ so it does not clutter the public repo's Tags UI) to the
        # squash-merge commit whenever a REAL live deploy just succeeded.
        # This is what lets a later docs-only PR's report answer "what was
        # last actually deployed" without a new API round-trip. Bookkeeping
        # metadata only: continue-on-error, never allowed to fail a deploy.
        if: success() && steps.push.outcome != 'skipped'
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          DEPLOYED_SHA: ${{ steps.merge.outputs.deployed_sha }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const deployedSha = process.env.DEPLOYED_SHA;
            if (!deployedSha) {
              core.warning('Record live-deploy marker: no deployed_sha available; skipping.');
              return;
            }
            try {
              let current = null;
              try {
                const { data } = await github.rest.git.getRef({ owner, repo, ref: 'deploy-markers/live' });
                current = data;
              } catch (e) {
                if (e.status !== 404) throw e;
              }
              let shouldWrite = true;
              if (current) {
                // Timestamp guard, not graph ancestry: squash commits are
                // never ancestors of each other, so compareCommits'
                // ahead/behind does not hold across squashes. Commit date is
                // the ordering signal that survives that. Skip-and-warn
                // rather than blindly force-overwriting if the new commit
                // is not actually newer than what is already marked.
                const [{ data: currentCommit }, { data: newCommit }] = await Promise.all([
                  github.rest.repos.getCommit({ owner, repo, ref: current.object.sha }),
                  github.rest.repos.getCommit({ owner, repo, ref: deployedSha }),
                ]);
                const currentDate = new Date(currentCommit.commit.committer.date);
                const newDate = new Date(newCommit.commit.committer.date);
                if (newDate <= currentDate) {
                  shouldWrite = false;
                  core.warning(`Skipping live-deploy marker update: ${deployedSha.substring(0,7)} (${newDate.toISOString()}) is not newer than the current marker ${current.object.sha.substring(0,7)} (${currentDate.toISOString()}).`);
                }
              }
              if (shouldWrite) {
                if (current) {
                  await github.rest.git.updateRef({ owner, repo, ref: 'deploy-markers/live', sha: deployedSha, force: true });
                } else {
                  await github.rest.git.createRef({ owner, repo, ref: 'refs/deploy-markers/live', sha: deployedSha });
                }
              }
            } catch (e) {
              core.warning(`Could not update live-deploy marker: ${e.message}`);
            }

      - name: React with -1
        # Fires for any failure in the deploy job, including the merge step's
        # core.setFailed on merge failure. The sync job is `needs: deploy`,
        # so its failures do not propagate to this reaction (sync failures
        # surface as workflow-run annotations and self-heal via sync.yml).
        # For comment-deploy triggers only.
        if: failure() && github.event_name == 'issue_comment'
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: '-1',
            });

      - name: Report failure
        if: failure() && needs.gate.outputs.pr_number != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ needs.gate.outputs.pr_number }}
          PR_SHORT_SHA: ${{ needs.gate.outputs.short_sha }}
          PR_REF: ${{ needs.gate.outputs.ref }}
          TRIGGER_PATH: ${{ needs.gate.outputs.trigger_path }}
          PUSH_EXIT_CODE: ${{ steps.push.outputs.push-exit-code }}
          PUSH_OUTCOME: ${{ steps.push.outcome }}
          PUSH_OUTPUT: ${{ steps.push.outputs.push-output }}
          SMOKE_EXIT_CODE: ${{ steps.push.outputs.smoke-exit-code }}
          SMOKE_OUTPUT: ${{ steps.push.outputs.smoke-output }}
          # New in the reorder: surface the merge step's structured error so
          # Report failure can render merge-specific failure copy (live is
          # deployed; PR is open; do NOT click Merge in the UI without
          # reviewing the new head if HEAD drifted).
          MERGED: ${{ steps.merge.outputs.merged }}
          MERGE_ERROR: ${{ steps.merge.outputs.merge_error }}
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const path = require('node:path');
            // Shared helper; see .github/scripts/with-retry.js.
            const withRetry = require(
              path.resolve(process.env.GITHUB_WORKSPACE, '.github/scripts/with-retry.js')
            ).makeWithRetry(core);

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const MARKER = '<!-- deploy-result -->';
            const prNumber = parseInt(process.env.PR_NUMBER, 10);
            const shortSha = process.env.PR_SHORT_SHA;
            const ref = process.env.PR_REF;
            const triggerPath = process.env.TRIGGER_PATH;
            // When the push+smoke step was SKIPPED (docs-only PR,
            // theme_touched=false), its exit outputs are empty. Treat them as
            // success so failure attribution falls through to the merge /
            // post-merge branches instead of misreporting "Pre-deploy Checks"
            // (empty pushExit would otherwise match the first branch).
            const pushSkipped = (process.env.PUSH_OUTCOME || '') === 'skipped';
            const pushExit = pushSkipped ? '0' : (process.env.PUSH_EXIT_CODE || '');
            const pushOutput = process.env.PUSH_OUTPUT || '';
            const smokeExit = pushSkipped ? '0' : (process.env.SMOKE_EXIT_CODE || '');
            const smokeOutput = process.env.SMOKE_OUTPUT || '';
            const merged = process.env.MERGED === 'true';
            const mergeError = process.env.MERGE_ERROR || '';
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;

            const titleByPath = {
              'comment': 'Deployment Report',
              'shopify-sync': 'Auto-deploy Report (shopify-sync)',
              'dependabot': 'Auto-deploy Report (dependabot)',
            };
            const title = titleByPath[triggerPath] || 'Deployment Report';

            // Detect HEAD-drifted-post-deploy specifically so the operator
            // sees the loudest possible warning against reflex-clicking Merge
            // in the GitHub UI (live is on the deployed SHA; the PR head has
            // moved past it; a manual merge would land different commits).
            const headDrifted = mergeError && /HEAD drifted post-deploy/i.test(mergeError);

            let failStage, errorDetail;
            if (pushExit === '') {
              failStage = 'Pre-deploy Checks';
              errorDetail = 'Gate checks or checkout failed before push. See the workflow run.';
            } else if (pushExit === '99') {
              failStage = 'Live theme ID assertion';
              errorDetail = pushOutput || 'Live theme ID did not match the expected value.';
            } else if (pushExit === '97') {
              // The CLI exited 0 but Shopify refused one or more assets, and
              // the retry did not clear them. Files that validated DID upload,
              // so live is in a mixed state: partly on this SHA, partly on
              // whatever the rejected files were before.
              failStage = 'Theme push (assets rejected by Shopify)';
              errorDetail = `${pushOutput || 'One or more assets were rejected. See the workflow run.'}\n\n**The live theme is partially updated.** Files that validated were written; the rejected ones were not, so live is a mix of this SHA and the previous state. A JSON template is validated against the section schema already stored on the theme, so the usual causes are a setting value outside its schema range, or a template whose schema change has not landed yet. Fix the value or the schema, then re-deploy.`;
            } else if (pushExit !== '0') {
              failStage = 'Theme push (shopify theme push --live)';
              errorDetail = pushOutput || 'Push exited non-zero. See the workflow run.';
            // Order matters: every pushExit arm above must be checked before
            // this one. The smoke step only runs after a successful push, so a
            // failed push leaves smokeExit unset (or stale), and testing it
            // first would report a smoke failure for a deploy that never
            // reached the storefront.
            } else if (smokeExit !== '0') {
              failStage = 'Smoke test (live theme is currently serving this SHA)';
              // Raw smokeOutput no longer embedded here: rendered as its own
              // table below (see smokeSection) so the offending path is easy
              // to spot instead of buried in a wall of text.
              errorDetail = `One or more storefront paths failed verification. See the Smoke test table below.\n\nThe push succeeded, so the storefront is now on \`${shortSha}\`. Either fix and re-deploy, or roll back per the procedure in README.md (revert PR or break-glass \`shopify theme push --live\`).`;
            } else if (mergeError && headDrifted) {
              // mergeError-present guard: distinguishes "merge step ran and
              // failed" from "merge step never ran" (e.g. a future reorder
              // that puts merge branches above push/smoke branches would
              // otherwise misattribute an unrelated failure as a merge failure).
              failStage = 'Squash merge (HEAD drifted post-deploy)';
              errorDetail = `${mergeError}\n\n**Live theme is on the SHA Validate ran against. The PR head has moved past it since deploy.**\n\nDo NOT click Merge in the GitHub UI without first reviewing the diff between the deployed SHA and the current PR head. Two recovery paths:\n  1. Re-deploy the new head: push a no-op commit to retrigger Validate, then comment \`deploy\` after Validate passes.\n  2. Merge manually only after reviewing the new commits with full awareness that the merge will land different code than what is currently live.`;
            } else if (mergeError) {
              failStage = 'Squash merge';
              errorDetail = `${mergeError}\n\nLive theme is on \`${shortSha}\`. The PR remains open; review the workflow log and merge manually if appropriate.`;
            } else {
              failStage = 'Post-merge';
              // After the sync-job extraction this arm is effectively dead
              // code (no remaining deploy-job step can fail between merge
              // and the failure handlers), but kept as defensive catch-all
              // for any future reorder that adds a post-merge step.
              errorDetail = 'A post-merge step failed after a successful merge. See the workflow run for details.';
            }

            const retryHint = triggerPath === 'comment'
              ? ':warning: Fix the issue, push a new commit, wait for validation to pass, then comment `deploy` to retry.'
              : ':warning: Investigate the failure. Auto-deploy will retry on the next Validate cycle once the underlying issue is resolved; manual `deploy` comment remains available as an escape hatch.';

            const isSmokeFailure = failStage === 'Smoke test (live theme is currently serving this SHA)';
            let smokeTableSection = [];
            if (isSmokeFailure) {
              // Same dynamic-import trust-boundary note as "Post deploy
              // report" above: this pulls PR-branch content into a step
              // holding this job's write token. See that step's comment.
              try {
                const { renderSmokeMarkdownTable } = await import(
                  pathToFileURL(path.resolve(process.env.GITHUB_WORKSPACE, '.github/actions/shopify-theme-push/report-format.mjs')).href
                );
                const { summaryLine, markdown } = renderSmokeMarkdownTable(smokeOutput);
                smokeTableSection = [
                  '',
                  `<details open><summary><strong>Smoke test</strong>: ${summaryLine}</summary>`,
                  '',
                  markdown,
                  '',
                  '</details>',
                ];
              } catch (e) {
                core.warning(`Smoke table rendering failed (${e.message}); falling back to raw output.`);
                smokeTableSection = [
                  '',
                  '<details open><summary><strong>Smoke test</strong></summary>',
                  '',
                  '```',
                  smokeOutput || 'No output captured.',
                  '```',
                  '',
                  '</details>',
                ];
              }
            }

            const body = [
              MARKER,
              `# ${title}`,
              '',
              `:x: **Deployment failed** at **${failStage}**. The PR remains open.`,
              '',
              '| | |',
              '|:--|:--|',
              `| **Commit** | \`${shortSha}\` |`,
              `| **Branch** | \`${ref}\` |`,
              `| **Failed stage** | ${failStage} |`,
              `| **Workflow run** | [#${context.runNumber}](${runUrl}) |`,
              '',
              '---',
              '',
              '<details open><summary><strong>Error details</strong></summary>',
              '',
              '```',
              errorDetail,
              '```',
              '',
              '</details>',
              ...smokeTableSection,
              '',
              '---',
              '',
              retryHint,
            ].join('\n');

            // Paginate so a failure on a high-comment-count PR still finds
            // the existing sticky instead of posting a duplicate. Same
            // rationale as the deploy-report upsert above.
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: prNumber,
            });
            const existing = comments
              .filter(c => c.body && c.body.includes(MARKER))
              .sort((a, b) => a.id - b.id);
            const [keep, ...dupes] = existing;
            if (keep) {
              await withRetry(
                () => github.rest.issues.updateComment({ owner, repo, comment_id: keep.id, body }),
                { attempts: 3, delayMs: 2000, label: 'Update failure comment' }
              );
            } else {
              await withRetry(
                () => github.rest.issues.createComment({ owner, repo, issue_number: prNumber, body }),
                { attempts: 3, delayMs: 2000, label: 'Post failure comment' }
              );
            }
            for (const d of dupes) {
              try { await github.rest.issues.deleteComment({ owner, repo, comment_id: d.id }); }
              catch (_) { /* swallowed */ }
            }

      - name: Report pre-identification failure
        if: failure() && needs.gate.outputs.pr_number == ''
        run: |
          {
            echo "## deploy: pre-identification failure"
            echo ""
            echo "Failed before a candidate PR was identified, so no PR comment was posted."
            echo "See the workflow run output for details."
          } >> "$GITHUB_STEP_SUMMARY"

  sync:
    # Post-merge reconcile of shopify-sync with the deployed SHA. Extracted
    # from the deploy job so SHOPIFY_SYNC_DEPLOY_KEY is isolated by job
    # boundary from SHOPIFY_CLI_THEME_TOKEN: a bug in this job's bash cannot
    # leak the Shopify token because the Shopify token structurally does not
    # exist in this job's scope. Mirrors the gate/deploy split's no-shared-
    # secrets property.
    name: sync
    needs: deploy
    if: needs.deploy.result == 'success' && needs.deploy.outputs.deployed_sha != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      # Serialise shopify-sync pushes across overlapping runs. The deploy
      # job's `deploy-production` mutex releases when the deploy job exits,
      # which is BEFORE this sync job starts (sync is `needs: deploy`). Two
      # back-to-back deploys could therefore start their sync jobs in close
      # succession and race on the shopify-sync ref. `--force-with-lease`
      # catches the race correctly (the later sync sees a stale lease and
      # falls into the warning + sync.yml-self-heal path), so this is
      # defence in depth, not a correctness fix. Separate group from
      # `deploy-production` so a manual `deploy` comment landing during an
      # in-flight sync does not block the next deploy's live-push.
      group: shopify-sync-reconcile
      cancel-in-progress: false
    permissions:
      # contents: write is for the fast-forward arm's HTTPS+GITHUB_TOKEN push
      # (which is NOT a force push and does not need the deploy-key bypass).
      # The phantom-orphan force-with-lease arm authenticates via SSH+deploy-
      # key, not GITHUB_TOKEN, so it does not rely on this grant.
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}                              # HTTPS fetch + HTTPS fast-forward push
      DEPLOYED_SHA: ${{ needs.deploy.outputs.deployed_sha }}     # squash-merge SHA from the deploy job
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # fetch-depth: 0 so the in-step `git rev-list` AHEAD/BEHIND counts
          # and `--force-with-lease` lease-SHA computation have full history.
          fetch-depth: 0
          ref: main
          persist-credentials: false

      - name: Validate sync preconditions
        # Empty-secret guard in its own step (no continue-on-error) so a missing
        # SHOPIFY_SYNC_DEPLOY_KEY halts the job visibly (red X) instead of being
        # swallowed by the next step's continue-on-error. Mirrors sync.yml's
        # SYNC_RECONCILE_TOKEN guard in both text and step-failure semantics.
        env:
          SHOPIFY_SYNC_DEPLOY_KEY: ${{ secrets.SHOPIFY_SYNC_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SHOPIFY_SYNC_DEPLOY_KEY:-}" ]; then
            echo "::error::SHOPIFY_SYNC_DEPLOY_KEY is unset; cannot force-push shopify-sync past the 'Block force pushes' rule. See CLAUDE.md 'Token rotation call-site catalog'."
            exit 1
          fi

      - name: Sync main -> shopify-sync
        id: reconcile
        # Replaces the prior sync-reconcile.yml `push: main` fast-forward arm,
        # which was dead (GITHUB_TOKEN-driven pushes do not retrigger workflows).
        # Anchored on the deployed SHA returned by the squash-merge in the
        # deploy job, NOT on origin/main re-resolved later, so this push is
        # tied to what just went live.
        #
        # Two push call-sites with DIFFERENT auth schemes:
        #
        #   fetch: HTTPS+GITHUB_TOKEN (read-only, no bypass needed; reuses
        #          AUTH_HEADER for forward-compat if the repo is ever flipped
        #          to private).
        #
        #   fast-forward push: HTTPS+GITHUB_TOKEN. A strict fast-forward to a
        #          tip-descendant of shopify-sync is NOT a force push; the
        #          shopify-sync-protection ruleset's "Block force pushes" rule
        #          does not apply. The empirical evidence in workflow run
        #          25704994159 (PR #21) was that ONLY the phantom-orphan
        #          force-with-lease arm hit GH013.
        #
        #   phantom-orphan force-with-lease push: SSH+deploy-key. The push
        #          rewrites shopify-sync's history (abandons orphan commits,
        #          resets tip to the deployed SHA). "Block force pushes"
        #          applies. GITHUB_TOKEN identity github-actions[bot] is a
        #          synthetic per-workflow identity with no role membership, so
        #          the ruleset's role-based bypass entries do not match it
        #          (empirically confirmed on workflow run 25704994159).
        #          SHOPIFY_SYNC_DEPLOY_KEY is on the ruleset's bypass-actor
        #          list as a "Deploy keys" row.
        #
        # Failures surface as `::warning::` annotations on the workflow run
        # and self-heal via sync.yml on the next admin push or the 13:00 UTC
        # daily cron. The empty-secret case is handled by the prior Validate
        # step and fails red.
        continue-on-error: true
        env:
          SHOPIFY_SYNC_DEPLOY_KEY: ${{ secrets.SHOPIFY_SYNC_DEPLOY_KEY }}
        run: |
          set -euo pipefail

          # Tempfile cleanup BEFORE resource creation: a failure during secret
          # write, ssh-keyscan, or any later command still triggers cleanup
          # because the trap is already installed. Empty-string fallbacks make
          # the rm -f harmless if either variable is never assigned. INT/TERM/
          # HUP coverage is defence in depth; on GitHub-hosted runners the VM
          # is destroyed with the job so the tmpfs is gone either way.
          SSH_KEY_FILE=""
          SSH_KNOWN_HOSTS=""
          SSH_KEYSCAN_ERR=""
          # shellcheck disable=SC2064
          trap 'rm -f -- "$SSH_KEY_FILE" "$SSH_KNOWN_HOSTS" "$SSH_KEYSCAN_ERR"' EXIT INT TERM HUP

          # Defence-in-depth secret masking: GitHub auto-masks literal secret
          # values line-by-line, but multi-line PEM bodies may not be masked
          # reliably under a future `set -x` insertion. Register each line
          # explicitly so each base64 body line is independently a registered
          # mask token. Mirrors the AUTH_B64 explicit-mask precedent below.
          while IFS= read -r mask_line; do
            [ -n "$mask_line" ] && echo "::add-mask::$mask_line"
          done <<< "$SHOPIFY_SYNC_DEPLOY_KEY"

          # umask 077 closes the mktemp 0600-mode race window across all
          # runner profiles (ubuntu-24.04 mktemp defaults to 0600, but
          # ubuntu-latest-4-cores and future profiles do not necessarily).
          # The explicit chmod 600 below is then documentary, not load-bearing.
          umask 077
          SSH_KEY_FILE=$(mktemp -t shopify-sync-key-XXXXXX)
          SSH_KNOWN_HOSTS=$(mktemp -t shopify-sync-hosts-XXXXXX)
          SSH_KEYSCAN_ERR=$(mktemp -t shopify-sync-keyscan-err-XXXXXX)
          chmod 600 "$SSH_KEY_FILE"

          # Normalise line endings: if the secret was pasted into the GitHub
          # secret UI from a Windows clipboard, internal CRLFs may remain.
          # OpenSSH on Linux can be strict about PEM line endings; enforce LF
          # here rather than debug "Load key: invalid format" later.
          printf '%s' "$SHOPIFY_SYNC_DEPLOY_KEY" | tr -d '\r' > "$SSH_KEY_FILE"
          printf '\n' >> "$SSH_KEY_FILE"
          # Shrink the shell-env exposure window. After unset, a later
          # accidental `echo "$SHOPIFY_SYNC_DEPLOY_KEY"` produces empty.
          unset SHOPIFY_SYNC_DEPLOY_KEY

          # Populate known_hosts. OpenSSH 8+ prefers ed25519 then ecdsa during
          # host-key selection; including rsa is unnecessary noise and would
          # couple this workflow to any future GitHub RSA-key rotation event.
          # Capture stderr to a tempfile so an empty-result diagnostic is
          # available in the warning path.
          ssh-keyscan -t ed25519,ecdsa github.com > "$SSH_KNOWN_HOSTS" 2> "$SSH_KEYSCAN_ERR"
          if [ ! -s "$SSH_KNOWN_HOSTS" ]; then
            echo "::warning::ssh-keyscan github.com returned empty; cannot force-push to shopify-sync. sync.yml will retry on next admin push or 13:00 UTC cron."
            echo "ssh-keyscan stderr:"
            cat "$SSH_KEYSCAN_ERR"
            echo "sync-status=ssh-keyscan empty; deferred to sync.yml" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # SSH command options:
          #   IdentitiesOnly=yes               - only the explicit -i key is offered (no agent fallthrough).
          #   PreferredAuthentications=publickey - rules out password / keyboard-interactive / gssapi.
          #   BatchMode=yes                    - never prompt (would hang the runner).
          #   StrictHostKeyChecking=yes        - reject unknown host keys (known_hosts above is the source of truth).
          #   LogLevel=ERROR                   - suppress informational ssh noise.
          export GIT_SSH_COMMAND="ssh -i $SSH_KEY_FILE -o IdentitiesOnly=yes -o PreferredAuthentications=publickey -o BatchMode=yes -o UserKnownHostsFile=$SSH_KNOWN_HOSTS -o StrictHostKeyChecking=yes -o LogLevel=ERROR"

          # Derive the SSH push URL from github.repository so an org/repo
          # rename does not silently leave a stale hardcoded URL behind.
          SSH_PUSH_URL="git@github.com:${{ github.repository }}.git"

          # HTTPS auth for the read-only fetch and the fast-forward push.
          # GitHub's git-over-HTTPS endpoint expects HTTP Basic auth with
          # `x-access-token` as the username and GITHUB_TOKEN as the password;
          # `AUTHORIZATION: bearer <token>` is silently ignored by the smart
          # HTTP server and git falls back to credential prompting.
          AUTH_B64=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w 0)
          # The base64-wrapped form is a different literal than the bare
          # GITHUB_TOKEN that Actions auto-masks; register it explicitly so a
          # future debug echo or git error message containing the assembled
          # http.extraheader cannot leak the token in base64-plaintext-
          # equivalent form.
          echo "::add-mask::$AUTH_B64"
          AUTH_HEADER="http.extraheader=AUTHORIZATION: basic $AUTH_B64"

          # Fetch ONCE. Do NOT git fetch between the lease-SHA computation
          # and the push; that would break --force-with-lease's race-detection
          # invariant. The explicit dst ref overwrite guarantees the local
          # origin/shopify-sync matches the remote tip even on a non-fast-
          # forward update so the lease-SHA below reflects the true current
          # tip. The auth is forward-compat: the repo is public today and an
          # anonymous fetch works, but flipping to private would otherwise
          # break with the same `could not read Username` error a Bearer-auth
          # push would produce.
          git -c "$AUTH_HEADER" fetch --prune --no-tags origin \
              "$DEPLOYED_SHA" \
              '+refs/heads/shopify-sync:refs/remotes/origin/shopify-sync'

          AHEAD=$(git rev-list --count "$DEPLOYED_SHA..origin/shopify-sync")
          BEHIND=$(git rev-list --count "origin/shopify-sync..$DEPLOYED_SHA")

          if [ "$AHEAD" -eq 0 ] && [ "$BEHIND" -gt 0 ]; then
            # Normal: shopify-sync reachable from deployed SHA; fast-forward
            # via HTTPS+GITHUB_TOKEN. Not a force push, no bypass needed.
            # Do NOT introduce a pipe inside the $() here; the if-then tests
            # the captured exit code.
            if PUSH_ERR=$(git -c "$AUTH_HEADER" \
                push origin "$DEPLOYED_SHA:shopify-sync" 2>&1); then
              echo "::notice::Fast-forwarded shopify-sync $BEHIND commit(s) to deployed SHA"
              echo "sync-status=fast-forwarded $BEHIND commit(s)" >> "$GITHUB_OUTPUT"
            else
              echo "::warning::Fast-forward push failed: $PUSH_ERR"
              echo "sync-status=push failed; sync.yml will retry on next admin push or 13:00 UTC cron" >> "$GITHUB_OUTPUT"
            fi
          elif [ "$AHEAD" -gt 0 ]; then
            DIFF_LOC=$(git diff --numstat "$DEPLOYED_SHA..origin/shopify-sync" \
              | awk '{ sum += $1 + $2 } END { print sum + 0 }')
            if [ "$DIFF_LOC" -eq 0 ]; then
              # Phantom orphan: trees identical (the just-merged auto-reconcile
              # PR squashed those orphan commits into main). Force-reset
              # shopify-sync to the deployed SHA via SSH+deploy-key (bypasses
              # "Block force pushes"). --force-with-lease catches an admin
              # commit racing this push.
              EXPECTED=$(git rev-parse origin/shopify-sync)
              # Do NOT introduce a pipe inside the $() here; the if-then tests
              # the captured exit code.
              if PUSH_ERR=$(git push --force-with-lease="shopify-sync:$EXPECTED" \
                  "$SSH_PUSH_URL" \
                  "$DEPLOYED_SHA:shopify-sync" 2>&1); then
                echo "::notice::Cleared $AHEAD orphan commit(s); trees identical to deployed SHA"
                echo "sync-status=cleared $AHEAD orphan(s)" >> "$GITHUB_OUTPUT"
              else
                # Multi-pattern stderr classifier covering the three failure
                # modes documented in CLAUDE.md "Token rotation call-site
                # catalog" for SHOPIFY_SYNC_DEPLOY_KEY:
                #   - Permission denied / Load key / Host key verification  --> key invalid
                #   - GH013 / Cannot force-push                             --> bypass row removed
                #   - empty $PUSH_ERR                                       --> network-layer abort, transient
                #   - anything else                                         --> raw stderr only
                if grep -qE 'Permission denied \(publickey[^)]*\)|Load key .*: (invalid format|bad permissions|error in libcrypto)|Host key verification failed' <<< "$PUSH_ERR"; then
                  echo "::warning::SHOPIFY_SYNC_DEPLOY_KEY appears invalid (revoked/regenerated/malformed/host-key-mismatch). See CLAUDE.md 'Token rotation call-site catalog'."
                elif grep -qE 'GH013|Cannot force-push to this branch' <<< "$PUSH_ERR"; then
                  echo "::warning::Push rejected by branch ruleset (likely the Deploy keys bypass-actor row was removed from shopify-sync-protection). See CLAUDE.md 'Token rotation call-site catalog'."
                elif [ -z "$PUSH_ERR" ]; then
                  echo "::warning::Phantom cleanup push failed with no captured stderr; likely a network-layer abort. sync.yml will retry."
                fi
                echo "::warning::Phantom cleanup push failed: $PUSH_ERR"
                echo "sync-status=push failed; sync.yml will retry on next admin push or 13:00 UTC cron" >> "$GITHUB_OUTPUT"
              fi
            else
              # Real divergence: an admin commit landed during this deploy.
              # sync.yml on the admin push will open the next reconcile PR.
              echo "::warning::shopify-sync has $AHEAD commit(s) ahead with real diff; deferring to sync.yml"
              echo "sync-status=deferred (admin commit landed mid-deploy)" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "::notice::shopify-sync already at deployed SHA"
            echo "sync-status=already in sync" >> "$GITHUB_OUTPUT"
          fi
