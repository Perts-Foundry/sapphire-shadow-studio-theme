# Unified deploy chain. One workflow handles three trigger paths:
#
#   1. issue_comment  - Dev PRs. A write+ collaborator comments `deploy`;
#                       the gate job runs the collaborator-permission check
#                       and the validate-on-HEAD-SHA re-verification.
#   2. workflow_run   - Auto-deploy for shopify-sync admin commits. Validate
#       (shopify-sync)  succeeds on the auto-reconcile PR; this workflow
#                       fires; the gate runs the shopify-sync gates (signed-
#                       commit, label, diff-sanity, base-staleness).
#   3. workflow_run   - Auto-deploy for Dependabot PRs. Same shape as (2),
#       (dependabot/**) with dependabot-specific gates (no CI-file changes,
#                       major-version label requirement, manual-review
#                       escape hatch).
#
# Two jobs in this workflow:
#   gate   - no Shopify token, no concurrency on deploy-production. Catches
#            non-collaborators and stale validate before any token is in scope
#            and before the live-deploy mutex is held. Resolves the trusted
#            SHA via getWorkflowRun().head_sha (workflow_run paths) or via
#            pulls.get().head.sha after the collaborator-permission check
#            (comment path).
#   deploy - contents+pulls write, concurrency: deploy-production. Reads the
#            Shopify token from a repo-level secret and the store handle /
#            canonical domain from repo-level variables. Inherits the trusted
#            head SHA from gate via needs.gate.outputs.head_sha. Includes a
#            synchronous `Sync main -> shopify-sync` post-merge step that
#            keeps shopify-sync caught up with main (replaces the prior
#            sync-reconcile.yml push: main fast-forward arm, which was dead
#            because GITHUB_TOKEN-driven pushes do not retrigger workflows).
#
# WARNING: workflow_run.workflows hardcodes the literal name "validate";
# renaming validate.yml silently breaks the auto-deploy paths. The
# workflow_run.branches filter (shopify-sync, dependabot/**) also depends on
# Dependabot's branch-naming convention.
name: deploy

on:
  issue_comment:
    types: [created]
  workflow_run:
    workflows: ["validate"]
    types: [completed]
    branches: ["shopify-sync", "dependabot/**"]

# Dynamic run-name keeps the three trigger paths visually distinct in the
# Actions tab. Without it, every run is named "deploy" and the operator must
# open the run to see which path fired.
run-name: >-
  deploy (${{
    github.event_name == 'issue_comment'
      && format('comment #{0} by @{1}', github.event.issue.number, github.event.comment.user.login)
      || format('{0} @ {1}', github.event.workflow_run.head_branch, github.event.workflow_run.display_title)
  }})

permissions: {}

jobs:
  gate:
    name: gate
    # Workflow-level pre-filter. Rejects two failure classes before any runner
    # spins up:
    #   (a) issue_comment events that are NOT on a PR (github.event.issue.pull_request
    #       is null for plain issue comments) or whose body is not `deploy`
    #       or whose author_association is below COLLABORATOR.
    #   (b) workflow_run events whose triggering Validate ran from a push
    #       (push: main or push: shopify-sync) rather than a PR. validate.yml
    #       fires on both pull_request and push; only the pull_request flavor
    #       corresponds to an auto-deploy candidate.
    if: |
      (github.event_name == 'issue_comment'
        && github.event.issue.pull_request
        && github.event.comment.body == 'deploy'
        && contains(fromJSON('["MEMBER", "OWNER", "COLLABORATOR"]'), github.event.comment.author_association))
      || (github.event_name == 'workflow_run'
        && github.event.workflow_run.event == 'pull_request'
        && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      # write on pull-requests so the rejection sticky comment can post when
      # a gate fails; without it the rejection surfaces only as a workflow
      # failure with no in-PR explanation. issues: write is needed for
      # createForIssueComment reactions (eyes/-1/confused on the comment
      # path) because reaction endpoints are routed through the issues API
      # even for PR comments.
      pull-requests: write
      issues: write
      actions: read
      checks: read
    outputs:
      pr_number: ${{ steps.resolve.outputs.pr_number }}
      head_sha: ${{ steps.resolve.outputs.head_sha }}
      short_sha: ${{ steps.resolve.outputs.short_sha }}
      ref: ${{ steps.resolve.outputs.ref }}
      base_ref: ${{ steps.resolve.outputs.base_ref }}
      trigger_path: ${{ steps.resolve.outputs.trigger_path }}
      deployer: ${{ steps.resolve.outputs.deployer }}
    steps:
      - name: React with eyes
        if: github.event_name == 'issue_comment'
        continue-on-error: true
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'eyes',
            });

      - name: Resolve trigger context
        id: resolve
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const sameRepoFull = `${owner}/${repo}`;
            const eventName = context.eventName;

            // Single sticky-comment marker for all three trigger paths.
            // Replaces the prior per-workflow markers
            // (<!-- shopify-sync-auto-deploy --> and <!-- dependabot-auto-deploy -->)
            // since one deploy.yml now owns every report.
            const MARKER = '<!-- deploy-result -->';

            // Sticky-comment helper. Upserts a single MARKER-tagged comment per
            // PR and cleans up duplicates. Uses github.paginate so PRs with
            // >100 comments (auto-reconcile PRs that accumulate daily-cron
            // stale notices, or long-lived discussion threads) still find
            // and update the existing sticky instead of posting a duplicate.
            const upsertSticky = async (prNumber, body) => {
              try {
                const comments = await github.paginate(github.rest.issues.listComments, {
                  owner, repo, issue_number: prNumber,
                });
                const existing = comments
                  .filter(c => c.body && c.body.includes(MARKER))
                  .sort((a, b) => a.id - b.id);
                const [keep, ...dupes] = existing;
                if (keep) {
                  await github.rest.issues.updateComment({ owner, repo, comment_id: keep.id, body });
                } else {
                  await github.rest.issues.createComment({ owner, repo, issue_number: prNumber, body });
                }
                for (const d of dupes) {
                  try {
                    await github.rest.issues.deleteComment({ owner, repo, comment_id: d.id });
                  } catch (_) { /* swallowed */ }
                }
              } catch (_) { /* non-critical; setFailed remains authoritative */ }
            };

            const postSkip = async (prNumber, reason, opts = {}) => {
              const { reaction } = opts;
              if (reaction && eventName === 'issue_comment') {
                try {
                  await github.rest.reactions.createForIssueComment({
                    owner, repo, comment_id: context.payload.comment.id, content: reaction,
                  });
                } catch (_) { /* swallowed */ }
              }
              const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
              const body = [
                MARKER,
                '# Deployment Report',
                '',
                `:x: **Deployment refused** at **Pre-deploy Checks**. The PR remains open.`,
                '',
                '| | |',
                '|:--|:--|',
                `| **Reason** | ${reason} |`,
                `| **Workflow run** | [#${context.runNumber}](${runUrl}) |`,
                '',
                '---',
                '',
                ':warning: Address the issue and re-trigger (push a new commit for auto-deploys, or comment `deploy` for manual).',
              ].join('\n');
              if (prNumber) {
                await upsertSticky(prNumber, body);
              }
              core.setFailed(reason);
            };

            // ──────────────────────────────────────────────────────────
            // Branch on trigger.
            // ──────────────────────────────────────────────────────────
            if (eventName === 'issue_comment') {
              const prNumber = context.issue.number;
              const username = context.payload.comment.user.login;

              // Collaborator-permission check via the API (defence in depth
              // above the author_association pre-filter in the workflow-level
              // if:; author_association can lag for borderline accounts).
              try {
                const { data: perm } = await github.rest.repos.getCollaboratorPermissionLevel({
                  owner, repo, username,
                });
                if (!['admin', 'write'].includes(perm.permission)) {
                  await postSkip(prNumber, `@${username} does not have write access; deploy refused.`, { reaction: '-1' });
                  return;
                }
              } catch (err) {
                await postSkip(prNumber, `Permission lookup failed (${err.message}); please retry.`, { reaction: 'confused' });
                return;
              }

              const { data: pr } = await github.rest.pulls.get({
                owner, repo, pull_number: prNumber,
              });
              if (pr.state !== 'open') {
                await postSkip(prNumber, 'This PR is not open; deploy refused.', { reaction: '-1' });
                return;
              }
              if (!pr.head.repo || pr.head.repo.full_name !== sameRepoFull) {
                await postSkip(prNumber, 'Deploy from forks is not supported.', { reaction: '-1' });
                return;
              }

              // Validate-on-HEAD-SHA gate. For the comment path this is the
              // primary integrity check: the user could comment `deploy` on a
              // PR with stale or red validate. The workflow_run path skips
              // this step because the trigger itself proves validate was just
              // green on the trusted SHA.
              //
              // event: 'pull_request' is belt-and-braces. validate.yml is
              // pull_request-only today, but if it ever grows a push: or
              // workflow_dispatch: trigger, a run from one of those events on
              // the same SHA would otherwise pass as "proof of Validate green"
              // for a comment-deploy. They run with different intent and
              // potentially different env, so they should not satisfy this gate.
              const { data: runs } = await github.rest.actions.listWorkflowRuns({
                owner, repo, workflow_id: 'validate.yml', head_sha: pr.head.sha, event: 'pull_request', per_page: 100,
              });
              const validateRuns = runs.workflow_runs || [];
              if (validateRuns.length === 0) {
                await postSkip(prNumber, `No validate run found for \`${pr.head.sha.substring(0,7)}\`. Push to trigger validation first.`, { reaction: '-1' });
                return;
              }
              const pending = validateRuns.find(r => r.status !== 'completed');
              if (pending) {
                await postSkip(prNumber, `Validate is still ${pending.status}; wait for it to finish, then re-comment.`, { reaction: '-1' });
                return;
              }
              const completed = validateRuns
                .filter(r => r.status === 'completed')
                .sort((a, b) => new Date(b.run_started_at || b.created_at) - new Date(a.run_started_at || a.created_at));
              const latest = completed[0];
              if (!latest || latest.conclusion !== 'success') {
                await postSkip(prNumber, `Latest validate run is \`${latest?.conclusion ?? 'unknown'}\`; deploy refused.`, { reaction: '-1' });
                return;
              }

              core.setOutput('pr_number', String(prNumber));
              core.setOutput('head_sha', pr.head.sha);
              core.setOutput('short_sha', pr.head.sha.substring(0, 7));
              core.setOutput('ref', pr.head.ref);
              core.setOutput('base_ref', pr.base.ref);
              core.setOutput('trigger_path', 'comment');
              core.setOutput('deployer', username);
              return;
            }

            // ──────────────────────────────────────────────────────────
            // workflow_run path (shopify-sync or dependabot/**).
            // ──────────────────────────────────────────────────────────
            // Defensive: workflow-level if: should have rejected anything
            // other than issue_comment or workflow_run, but make the
            // unreachable case loud rather than silently mis-routing.
            if (eventName !== 'workflow_run') {
              core.setFailed(`Unexpected event_name \`${eventName}\`; expected issue_comment or workflow_run.`);
              return;
            }
            // Re-fetch the triggering run by id. This is the TRUSTED source
            // for head_sha (the event payload can be replayed; getWorkflowRun
            // returns the live record). Re-assert conclusion=success in case
            // the run was retried or its status mutated between dispatch and
            // execution.
            const { data: run } = await github.rest.actions.getWorkflowRun({
              owner, repo, run_id: context.payload.workflow_run.id,
            });
            if (run.status !== 'completed' || run.conclusion !== 'success') {
              core.setFailed(`Triggering validate run not green (${run.status}/${run.conclusion}).`);
              return;
            }
            if (!run.head_sha) {
              core.setFailed('workflow_run has no head_sha; cannot pin trusted SHA.');
              return;
            }
            const trustedSha = run.head_sha;
            const headBranch = run.head_branch || '';

            // Defensive head_branch routing. The on.workflow_run.branches
            // filter already narrows to shopify-sync and dependabot/**, but
            // re-assert here on the trusted-source value (not the event
            // payload's head_branch).
            let triggerPath, expectedBot, headRefForLookup;
            if (headBranch === 'shopify-sync') {
              triggerPath = 'shopify-sync';
              expectedBot = 'shopify[bot]';
              headRefForLookup = 'shopify-sync';
            } else if (headBranch.startsWith('dependabot/')) {
              triggerPath = 'dependabot';
              expectedBot = 'dependabot[bot]';
              headRefForLookup = headBranch;
            } else {
              // workflow_run.branches filter should have prevented this, so
              // a warning is louder than info but not a hard failure (the
              // workflow filter is the real gate; this is belt-and-braces).
              core.warning(`Unexpected head_branch \`${headBranch}\`; nothing to do.`);
              return;
            }

            // Find the open PR. GitHub guarantees uniqueness of (state, head)
            // for open PRs, so per_page: 1 is sufficient and makes the
            // uniqueness assumption explicit.
            const { data: pulls } = await github.rest.pulls.list({
              owner, repo, state: 'open', head: `${owner}:${headRefForLookup}`, per_page: 1,
            });
            if (pulls.length === 0) {
              core.info(`No open PR from ${headRefForLookup}; nothing to deploy.`);
              return;
            }
            const pr = pulls[0];
            const prNumber = pr.number;

            if (!pr.head.repo || pr.head.repo.full_name !== sameRepoFull) {
              await postSkip(prNumber, `PR head is not in the origin repo (${pr.head.repo?.full_name}).`);
              return;
            }

            // HEAD drift: the trusted SHA from getWorkflowRun is what we will
            // deploy; if the PR has moved past it, abort. The next Validate
            // cycle on the new head fires a fresh workflow_run.
            if (pr.head.sha !== trustedSha) {
              await postSkip(prNumber, `HEAD drifted (validated \`${trustedSha.substring(0,7)}\`, current \`${pr.head.sha.substring(0,7)}\`). The next Validate cycle will retrigger.`);
              return;
            }
            // Defence in depth on top of the pr.head.sha === trustedSha
            // equality above. compareCommits returns 'identical' only when
            // the two refs resolve to the SAME commit object (not when trees
            // are the same but SHAs differ, despite the term's connotation);
            // a same-tree amend or cherry-pick produces a different SHA and
            // returns 'diverged'. So this assertion is functionally redundant
            // with the SHA equality above and exists to catch any path where
            // SHAs end up non-identical (force-push to a different tree,
            // same-tree amend, cherry-pick), including paths a future
            // refactor might accidentally introduce.
            try {
              const { data: cmp } = await github.rest.repos.compareCommits({
                owner, repo, base: trustedSha, head: pr.head.sha,
              });
              if (cmp.status !== 'identical') {
                await postSkip(prNumber, `compareCommits status is \`${cmp.status}\` (expected \`identical\`). Aborting.`);
                return;
              }
            } catch (e) {
              await postSkip(prNumber, `compareCommits failed: ${e.message}.`);
              return;
            }

            core.setOutput('pr_number', String(prNumber));
            core.setOutput('head_sha', trustedSha);
            core.setOutput('short_sha', trustedSha.substring(0, 7));
            core.setOutput('ref', pr.head.ref);
            core.setOutput('base_ref', pr.base.ref);
            core.setOutput('trigger_path', triggerPath);
            core.setOutput('deployer', expectedBot);

      - name: Auto-deploy gates - shopify-sync
        if: steps.resolve.outputs.trigger_path == 'shopify-sync'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          PR_NUMBER: ${{ steps.resolve.outputs.pr_number }}
          TRUSTED_SHA: ${{ steps.resolve.outputs.head_sha }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prNumber = parseInt(process.env.PR_NUMBER, 10);
            const trustedSha = process.env.TRUSTED_SHA;
            const MARKER = '<!-- deploy-result -->';

            const upsertSticky = async (body) => {
              try {
                const comments = await github.paginate(github.rest.issues.listComments, {
                  owner, repo, issue_number: prNumber,
                });
                const existing = comments
                  .filter(c => c.body && c.body.includes(MARKER))
                  .sort((a, b) => a.id - b.id);
                const [keep, ...dupes] = existing;
                if (keep) {
                  await github.rest.issues.updateComment({ owner, repo, comment_id: keep.id, body });
                } else {
                  await github.rest.issues.createComment({ owner, repo, issue_number: prNumber, body });
                }
                for (const d of dupes) {
                  try { await github.rest.issues.deleteComment({ owner, repo, comment_id: d.id }); }
                  catch (_) { /* swallowed */ }
                }
              } catch (_) { /* non-critical */ }
            };

            const postSkip = async (reason) => {
              const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
              const body = [
                MARKER,
                '# Deployment Report',
                '',
                `:x: **Auto-deploy skipped** at **shopify-sync gates**. The PR remains open.`,
                '',
                '| | |',
                '|:--|:--|',
                `| **Reason** | ${reason} |`,
                `| **Workflow run** | [#${context.runNumber}](${runUrl}) |`,
              ].join('\n');
              await upsertSticky(body);
              core.setFailed(reason);
            };

            const { data: pr } = await github.rest.pulls.get({
              owner, repo, pull_number: prNumber,
            });

            // Draft-PR escape hatch: operator marks the auto-reconcile PR
            // as a draft to halt auto-deploy; convert to ready to resume.
            // Replaces the prior `manual-review` label mechanism.
            if (pr.draft) {
              await postSkip('PR is in draft state; auto-deploy skipped. Mark ready-for-review to resume.');
              return;
            }

            // Bot identity gate on the underlying commits (not the PR opener).
            // sync.yml opens the auto-reconcile PR using GITHUB_TOKEN, so
            // pr.user.login is `github-actions[bot]`, not `shopify[bot]`. The
            // integrity assertion is that the COMMITS on shopify-sync were
            // authored and committed by shopify[bot] with a verified signature.
            // Uses only GitHub-API-resolved login fields; Git commit headers
            // are forgeable. The PR opener identity is also verified to be
            // GitHub-Actions (proves sync.yml opened it; a hand-opened
            // shopify-sync PR would fail this).
            const { data: commit } = await github.rest.repos.getCommit({
              owner, repo, ref: trustedSha,
            });
            const verified = commit.commit?.verification?.verified === true;
            const authorLogin = commit.author?.login;
            const committerLogin = commit.committer?.login;
            const prUserLogin = pr.user?.login;
            const expectedCommitBot = 'shopify[bot]';
            const expectedPrBot = 'github-actions[bot]';
            if (!verified || authorLogin !== expectedCommitBot || committerLogin !== expectedCommitBot) {
              await postSkip(`Commit-identity gate failed (verified=${verified}, author=${authorLogin}, committer=${committerLogin}; expected ${expectedCommitBot}).`);
              return;
            }
            if (prUserLogin !== expectedPrBot) {
              await postSkip(`PR-opener-identity gate failed (pr.user=${prUserLogin}; expected ${expectedPrBot}, which means the PR was opened by sync.yml). A hand-opened shopify-sync PR cannot auto-deploy; comment \`deploy\` manually to ship it.`);
              return;
            }

            // Base-staleness.
            const { data: main } = await github.rest.repos.getBranch({
              owner, repo, branch: 'main',
            });
            if (main.commit.sha !== pr.base.sha) {
              await postSkip(`\`main\` advanced (base \`${pr.base.sha.substring(0,7)}\`, current \`${main.commit.sha.substring(0,7)}\`). sync.yml will refresh the PR and retrigger.`);
              return;
            }

            // Diff sanity.
            let files = [];
            const perPage = 100;
            for (let page = 1; ; page++) {
              const { data: pageFiles } = await github.rest.pulls.listFiles({
                owner, repo, pull_number: prNumber, per_page: perPage, page,
              });
              files = files.concat(pageFiles);
              if (pageFiles.length < perPage) break;
              if (page > 50) break;
            }
            const protectedHits = files.filter(f =>
              f.filename.startsWith('.github/') ||
              f.filename === 'layout/theme.liquid'
            );
            if (protectedHits.length > 0) {
              await postSkip(`Diff touches protected paths: ${protectedHits.map(f => f.filename).slice(0, 5).join(', ')}.`);
              return;
            }
            const totalLoc = files.reduce((sum, f) => sum + (f.additions ?? 0) + (f.deletions ?? 0), 0);
            if (totalLoc > 1000) {
              await postSkip(`Diff exceeds 1000 LOC (${totalLoc}); admin edits should not be that large.`);
              return;
            }

      - name: Fetch Dependabot metadata
        # Parses dependabot[bot]'s structured commit trailers to determine the
        # highest update-type across all deps in the PR. Authoritative source
        # for grouped-update PRs whose titles are non-parseable prose (e.g.
        # "bump the github-actions group with 3 updates") and whose body lines
        # depend on a free-form template Dependabot owns. The downstream gate
        # also keeps a "Bump|Updates X from A to B" regex pass as belt-and-
        # braces and fails closed when BOTH signals come up empty.
        #
        # Only runs for the Dependabot trigger path. The action reads the PR
        # context from the workflow_run event payload and short-circuits on
        # non-Dependabot PRs anyway, but the explicit `if:` keeps the gate's
        # responsibility readable.
        id: dependabot-metadata
        if: steps.resolve.outputs.trigger_path == 'dependabot'
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      - name: Auto-deploy gates - dependabot
        if: steps.resolve.outputs.trigger_path == 'dependabot'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          PR_NUMBER: ${{ steps.resolve.outputs.pr_number }}
          TRUSTED_SHA: ${{ steps.resolve.outputs.head_sha }}
          # update-type is the highest-severity SemVer update across the deps
          # in this PR ('version-update:semver-major' if any dep is a major
          # bump). Empty string when fetch-metadata cannot resolve the PR or
          # when the PR is not a Dependabot PR (defensive; the bot-identity
          # gate already enforces the latter).
          FETCH_METADATA_UPDATE_TYPE: ${{ steps.dependabot-metadata.outputs.update-type }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prNumber = parseInt(process.env.PR_NUMBER, 10);
            const trustedSha = process.env.TRUSTED_SHA;
            const expectedBot = 'dependabot[bot]';
            const MARKER = '<!-- deploy-result -->';

            const upsertSticky = async (body) => {
              try {
                const comments = await github.paginate(github.rest.issues.listComments, {
                  owner, repo, issue_number: prNumber,
                });
                const existing = comments
                  .filter(c => c.body && c.body.includes(MARKER))
                  .sort((a, b) => a.id - b.id);
                const [keep, ...dupes] = existing;
                if (keep) {
                  await github.rest.issues.updateComment({ owner, repo, comment_id: keep.id, body });
                } else {
                  await github.rest.issues.createComment({ owner, repo, issue_number: prNumber, body });
                }
                for (const d of dupes) {
                  try { await github.rest.issues.deleteComment({ owner, repo, comment_id: d.id }); }
                  catch (_) { /* swallowed */ }
                }
              } catch (_) { /* non-critical */ }
            };

            const postSkip = async (reason) => {
              const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
              const body = [
                MARKER,
                '# Deployment Report',
                '',
                `:x: **Auto-deploy skipped** at **dependabot gates**. The PR remains open.`,
                '',
                '| | |',
                '|:--|:--|',
                `| **Reason** | ${reason} |`,
                `| **Workflow run** | [#${context.runNumber}](${runUrl}) |`,
              ].join('\n');
              await upsertSticky(body);
              core.setFailed(reason);
            };

            const { data: pr } = await github.rest.pulls.get({
              owner, repo, pull_number: prNumber,
            });

            // Draft-PR escape hatch: operator converts the Dependabot PR to
            // a draft to halt auto-deploy; convert to ready to resume.
            // Replaces the prior `manual-review` label mechanism.
            if (pr.draft) {
              await postSkip('PR is in draft state; auto-deploy skipped. Mark ready-for-review to resume.');
              return;
            }

            // Bot identity.
            const { data: commit } = await github.rest.repos.getCommit({
              owner, repo, ref: trustedSha,
            });
            const verified = commit.commit?.verification?.verified === true;
            const authorLogin = commit.author?.login;
            const committerLogin = commit.committer?.login;
            const prUserLogin = pr.user?.login;
            if (!verified || authorLogin !== expectedBot || committerLogin !== expectedBot || prUserLogin !== expectedBot) {
              await postSkip(`Bot-identity gate failed (verified=${verified}, author=${authorLogin}, committer=${committerLogin}, pr.user=${prUserLogin}; expected ${expectedBot}).`);
              return;
            }

            // Base-staleness.
            const { data: main } = await github.rest.repos.getBranch({
              owner, repo, branch: 'main',
            });
            if (main.commit.sha !== pr.base.sha) {
              await postSkip(`\`main\` advanced (base \`${pr.base.sha.substring(0,7)}\`, current \`${main.commit.sha.substring(0,7)}\`); waiting for Dependabot to rebase.`);
              return;
            }

            // CI-self-modification guard.
            let files = [];
            const perPage = 100;
            for (let page = 1; ; page++) {
              const { data: pageFiles } = await github.rest.pulls.listFiles({
                owner, repo, pull_number: prNumber, per_page: perPage, page,
              });
              files = files.concat(pageFiles);
              if (pageFiles.length < perPage) break;
              if (page > 50) break;
            }
            const ciHits = files.filter(f =>
              f.filename.startsWith('.github/workflows/') ||
              f.filename.startsWith('.github/actions/') ||
              f.filename.startsWith('.github/scripts/')
            );
            if (ciHits.length > 0) {
              await postSkip(`Dependabot PR modifies CI files (\`${ciHits[0].filename}\`); auto-deploy refused. Apply manually with \`deploy\` comment.`);
              return;
            }

            // Major-version detection. Major bumps default-skip auto-deploy
            // (no label opt-in available); operator comments `deploy` on the
            // PR after review to ship a major bump.
            //
            // Two independent signals are consulted and the gate fails closed
            // when both come up empty:
            //   1. PRIMARY: dependabot/fetch-metadata parses structured commit
            //      trailers and exposes the highest update-type across all
            //      deps via outputs.update-type ('version-update:semver-major'
            //      when any dep in the PR is a major bump). Authoritative for
            //      grouped-update PRs whose title and body are non-parseable
            //      free-form prose ("bump the github-actions group with N
            //      updates").
            //   2. SECONDARY: parse "Bump|Updates <dep> from A to B" lines
            //      from the PR title and body. Catches:
            //        - Timing / payload edge cases where fetch-metadata
            //          returns an empty update-type (e.g. workflow_run
            //          payload missing the PR; rare but documented).
            //        - Future format changes in Dependabot's trailers that
            //          would silently break the action's output.
            //      The version pattern is permissive (two-segment versions,
            //      leading-v, prerelease / build-metadata suffixes); a major
            //      bump is "first numeric component differs."
            //   3. FAIL-CLOSED: if BOTH signals are empty on a PR whose
            //      identity already matched dependabot[bot] above, the gate
            //      cannot determine bump severity and must postSkip. Without
            //      this, an unparseable PR would auto-deploy on the implicit
            //      assumption that the absence of "major" signals means
            //      "non-major" - exactly the failure mode we're guarding
            //      against if Dependabot ever changes its output format.
            const fetchMetadataUpdateType = process.env.FETCH_METADATA_UPDATE_TYPE || '';
            const isMajorByMetadata = fetchMetadataUpdateType === 'version-update:semver-major';

            const text = `${pr.title}\n${pr.body || ''}`;
            const lineRegex = /\b(?:Bump|Updates)\s+[`']?[\S]+?[`']?\s+from\s+(v?\d+(?:\.\d+){0,3}(?:[-+][\w.]+)?)\s+to\s+(v?\d+(?:\.\d+){0,3}(?:[-+][\w.]+)?)/gi;
            const extractMajor = (v) => {
              const mm = String(v).match(/^v?(\d+)/);
              return mm ? parseInt(mm[1], 10) : null;
            };
            const matches = Array.from(text.matchAll(lineRegex));
            const majorBumps = matches
              .map(mm => ({ raw: mm[0].trim(), from: extractMajor(mm[1]), to: extractMajor(mm[2]) }))
              .filter(x => x.from != null && x.to != null && x.from !== x.to);

            if (isMajorByMetadata || majorBumps.length > 0) {
              const detail = isMajorByMetadata
                ? `fetch-metadata reports update-type=\`${fetchMetadataUpdateType}\``
                : majorBumps.map(x => x.raw).slice(0, 3).join('; ') + (majorBumps.length > 3 ? ` (+${majorBumps.length - 3} more)` : '');
              await postSkip(`Major-version bump(s) detected: ${detail}. Auto-deploy refused for safety. Review the PR and comment \`deploy\` to ship.`);
              return;
            }

            if (!fetchMetadataUpdateType && matches.length === 0) {
              await postSkip('Could not determine bump severity: `dependabot/fetch-metadata` returned no `update-type` and the PR title/body contained no parseable `Bump|Updates X from A to B` lines. Manual review required: comment `deploy` to ship after verifying the bump severity.');
              return;
            }

  deploy:
    name: deploy
    needs: gate
    # Only run if gate produced a pr_number. The gate's resolve step exits
    # early without setting outputs for "no open PR" cases (e.g. a stray
    # workflow_run firing with no associated PR).
    if: needs.gate.outputs.pr_number != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write          # git push to shopify-sync
      pull-requests: write     # pulls.merge + sticky comment
      issues: write            # createForIssueComment reactions (rocket / -1)
      actions: read            # forward-compat: any future step that reads
                               # workflow runs (e.g. to surface the Validate
                               # run id in the deploy report) needs this; the
                               # gate already has it for listWorkflowRuns and
                               # the grant is harmless when unused
    concurrency:
      # Serialises live-theme writes across all three trigger paths. With the
      # unified workflow the comment-driven and auto-deploy paths now contend
      # for the same lock, which can fire base-staleness rejections on the
      # auto-deploy paths if a comment-deploy lands first; auto-deploy self-
      # heals via Dependabot rebase / sync-PR refresh.
      group: deploy-production
      cancel-in-progress: false
    env:
      LIVE_THEME_ID: "181702754604"
      GH_TOKEN: ${{ github.token }}      # for the Sync step's git push
    outputs:
      deployed_sha: ${{ steps.merge.outputs.deployed_sha }}
    steps:
      - name: Checkout trusted SHA
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # fetch-depth: 0 is REQUIRED for the Sync step. --force-with-lease
          # lease-SHA computation and AHEAD/BEHIND counts need full history.
          fetch-depth: 0
          ref: ${{ needs.gate.outputs.head_sha }}
          persist-credentials: false

      - name: Live theme push
        id: push
        uses: ./.github/actions/shopify-theme-push
        with:
          mode: live
          shopify-cli-theme-token: ${{ secrets.SHOPIFY_CLI_THEME_TOKEN }}
          shopify-flag-store: ${{ vars.SHOPIFY_FLAG_STORE }}
          live-theme-id: ${{ env.LIVE_THEME_ID }}
          # format() collapses to '' when vars.SHOPIFY_DOMAIN is unset/empty,
          # so the action falls back to the legacy myshopify probe instead of
          # silently constructing the malformed URL `https://`.
          smoke-base-url: ${{ vars.SHOPIFY_DOMAIN && format('https://{0}', vars.SHOPIFY_DOMAIN) || '' }}

      - name: Squash merge
        id: merge
        if: success()
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          PR_NUMBER: ${{ needs.gate.outputs.pr_number }}
          PR_SHA: ${{ needs.gate.outputs.head_sha }}
          PR_REF: ${{ needs.gate.outputs.ref }}
          TRIGGER_PATH: ${{ needs.gate.outputs.trigger_path }}
        with:
          script: |
            const RETRYABLE = new Set([500, 502, 503, 504]);
            const NON_RETRYABLE = new Set([400, 401, 403, 404, 405, 409, 422]);
            const isTransient = (err) => {
              if (NON_RETRYABLE.has(err.status)) return false;
              if (RETRYABLE.has(err.status)) return true;
              const m = err.message || '';
              return /Unexpected end of JSON|ECONNRESET|ETIMEDOUT|socket hang up|network|fetch failed/.test(m);
            };
            const withRetry = async (fn, { attempts = 3, delayMs = 2000, label = 'API call' } = {}) => {
              for (let i = 1; i <= attempts; i++) {
                try { return await fn(); }
                catch (err) {
                  if (i < attempts && isTransient(err)) {
                    const wait = delayMs * Math.pow(2, i - 1);
                    core.warning(`${label} attempt ${i}/${attempts} failed: ${err.message}. Retrying in ${wait}ms.`);
                    await new Promise(r => setTimeout(r, wait));
                  } else { throw err; }
                }
              }
            };

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prNumber = parseInt(process.env.PR_NUMBER, 10);
            const sha = process.env.PR_SHA;
            const ref = process.env.PR_REF;
            const triggerPath = process.env.TRIGGER_PATH;

            // Pre-merge HEAD drift recheck for auto-deploy paths. Between the
            // gate's compareCommits and now, the PR tip could have moved. The
            // live deploy already shipped the trusted SHA; we cannot squash-
            // merge a different tree.
            let merged = true;
            let mergeError = '';
            let deployedSha = '';
            const { data: prNow } = await github.rest.pulls.get({
              owner, repo, pull_number: prNumber,
            });
            if (prNow.head.sha !== sha) {
              merged = false;
              mergeError = `HEAD drifted post-deploy (validated \`${sha.substring(0,7)}\`, current \`${prNow.head.sha.substring(0,7)}\`). Live theme is on the deployed SHA; PR left open.`;
            } else {
              try {
                const { data: mergeResult } = await withRetry(
                  () => github.rest.pulls.merge({
                    owner, repo, pull_number: prNumber, merge_method: 'squash',
                    // sha: TOCTOU guard. If the branch tip moved between
                    // checkout and merge, GitHub returns 409 and we surface
                    // "merge failed" rather than merging the wrong tree.
                    sha,
                  }),
                  { attempts: 3, delayMs: 2000, label: 'Squash merge' }
                );
                deployedSha = mergeResult.sha;
                // Defensive: the squash-merge API response is documented to
                // return the new merge-commit SHA in the `sha` field. Asserting
                // non-empty here means a future response-shape change can't
                // silently produce an empty refspec for the Sync step
                // (`git push origin :shopify-sync` would DELETE the branch).
                if (!deployedSha) {
                  merged = false;
                  mergeError = 'merge API returned no SHA in response; refusing to push an empty refspec to shopify-sync.';
                }
              } catch (e) {
                merged = false;
                mergeError = e.message;
              }
            }

            // Long-lived branches must never be deleted. shopify-sync is the
            // Shopify-GitHub-Integration target; deleting it breaks the
            // admin-edit pipeline.
            const longLived = new Set(['main', 'shopify-sync']);
            const branchRetained = longLived.has(ref);
            let branchDeleted = false;
            if (merged && !branchRetained) {
              try {
                await withRetry(
                  () => github.rest.git.deleteRef({
                    owner, repo, ref: `heads/${ref}`,
                  }),
                  { attempts: 2, delayMs: 1000, label: 'Delete branch' }
                );
                branchDeleted = true;
              } catch (_) { /* swallowed */ }
            }

            core.setOutput('merged', merged ? 'true' : 'false');
            core.setOutput('merge_error', mergeError);
            core.setOutput('branch_deleted', branchDeleted ? 'true' : 'false');
            core.setOutput('branch_retained', branchRetained ? 'true' : 'false');
            core.setOutput('deployed_sha', deployedSha);

      - name: Delete preview theme
        id: cleanup
        # Skipped for Dependabot auto-deploys: preview.yml::deploy-preview is
        # already conditionally skipped for Dependabot PRs (no Shopify token in
        # the Dependabot secrets scope), so there is never a `pr-N-preview`
        # theme to delete on this path. Running the cleanup anyway would
        # produce a misleading ":broom: Preview cleanup: no preview theme
        # found." line in every Dependabot deploy report.
        if: success() && steps.merge.outputs.merged == 'true' && needs.gate.outputs.trigger_path != 'dependabot'
        # Cleanup runs AFTER successful merge so a runner crash or non-transient
        # cleanup failure cannot leave the system in `live deployed + PR open +
        # preview gone`. continue-on-error keeps a leaked preview from blocking
        # the post-deploy report; the cleanup-status output surfaces failures.
        continue-on-error: true
        uses: ./.github/actions/shopify-theme-push
        with:
          mode: delete-preview
          shopify-cli-theme-token: ${{ secrets.SHOPIFY_CLI_THEME_TOKEN }}
          shopify-flag-store: ${{ vars.SHOPIFY_FLAG_STORE }}
          pr-number: ${{ needs.gate.outputs.pr_number }}

      - name: Sync main -> shopify-sync
        id: sync
        # Replaces the prior sync-reconcile.yml `push: main` fast-forward arm,
        # which was dead (GITHUB_TOKEN-driven pushes do not retrigger workflows).
        # Anchored on the deployed SHA returned by the squash-merge, NOT on
        # origin/main re-resolved later, so this push is tied to what just
        # went live.
        if: success() && steps.merge.outputs.merged == 'true' && steps.merge.outputs.deployed_sha != ''
        continue-on-error: true
        env:
          # Passing via env: instead of inline ${{ }} interpolation prevents
          # any future change to the merge response from injecting shell syntax;
          # the value is a GitHub-API-returned SHA-1, but defence in depth.
          DEPLOYED_SHA: ${{ steps.merge.outputs.deployed_sha }}
        run: |
          set -euo pipefail

          # GitHub's git-over-HTTPS endpoint expects HTTP Basic auth with
          # `x-access-token` as the username and the GITHUB_TOKEN as the
          # password (the same scheme actions/checkout's persisted creds use).
          # `AUTHORIZATION: bearer <token>` is silently ignored by the smart
          # HTTP server; git then falls back to credential prompting and
          # fails with:
          #   fatal: could not read Username for 'https://github.com':
          #         No such device or address
          # Build the header once so both pushes below share the encoded form.
          AUTH_B64=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w 0)
          # GitHub Actions auto-masks literal occurrences of secret values
          # (including github.token) in logs. The base64-wrapped form is a
          # different literal that Actions has not been told about; register
          # it explicitly so a future debug echo / set -x / git error message
          # containing the assembled http.extraheader can't leak the token in
          # base64-plaintext-equivalent form.
          echo "::add-mask::$AUTH_B64"
          AUTH_HEADER="http.extraheader=AUTHORIZATION: basic $AUTH_B64"

          # Fetch ONCE. Do NOT git fetch between the lease-SHA computation and
          # the push; that would break --force-with-lease's race-detection
          # invariant. The checkout above used persist-credentials: false so
          # there are no leftover credentials; we inject the token via
          # http.extraheader per-command above.
          #
          # $DEPLOYED_SHA is the squash-merge commit returned by pulls.merge.
          # It is brand-new on the remote and is NOT yet in the local clone
          # (the checkout fetched the PR head SHA, not the merged SHA).
          # Explicitly fetch it so `git rev-list` / `git diff` can resolve it
          # as a commit object below.
          #
          # Auth and explicit-destination refspec both matter:
          #   * Auth: the repo is public today, so an anonymous fetch works,
          #     but if the repo is ever flipped to private (sensitive-data
          #     scrub, compliance lockdown, etc.) the unauthed fetch fails
          #     with the same `could not read Username` error the Bearer push
          #     used to produce. Cost-free immunisation by reusing AUTH_HEADER.
          #   * Explicit dst (`+refs/heads/shopify-sync:refs/remotes/origin/shopify-sync`):
          #     guarantees the local `origin/shopify-sync` ref is overwritten
          #     with the remote tip even on a non-fast-forward update, so the
          #     `EXPECTED=$(git rev-parse origin/shopify-sync)` lease-SHA used
          #     by --force-with-lease below reflects the true current tip.
          git -c "$AUTH_HEADER" fetch --prune --no-tags origin \
              "$DEPLOYED_SHA" \
              '+refs/heads/shopify-sync:refs/remotes/origin/shopify-sync'

          AHEAD=$(git rev-list --count "$DEPLOYED_SHA..origin/shopify-sync")
          BEHIND=$(git rev-list --count "origin/shopify-sync..$DEPLOYED_SHA")

          if [ "$AHEAD" -eq 0 ] && [ "$BEHIND" -gt 0 ]; then
            # Normal: shopify-sync reachable from deployed SHA; fast-forward.
            if PUSH_ERR=$(git -c "$AUTH_HEADER" \
                push origin "$DEPLOYED_SHA:shopify-sync" 2>&1); then
              echo "::notice::Fast-forwarded shopify-sync $BEHIND commit(s) to deployed SHA"
              echo "sync-status=fast-forwarded $BEHIND commit(s)" >> "$GITHUB_OUTPUT"
            else
              # Surface the underlying git error verbatim; do not pre-classify
              # the cause (admin-commit race, auth failure, network blip, etc.
              # all surface the same way here and need the raw error to triage).
              echo "::warning::Fast-forward push failed: $PUSH_ERR"
              echo "sync-status=push failed; sync.yml will retry on next admin push or 13:00 UTC cron" >> "$GITHUB_OUTPUT"
            fi
          elif [ "$AHEAD" -gt 0 ]; then
            DIFF_LOC=$(git diff --numstat "$DEPLOYED_SHA..origin/shopify-sync" \
              | awk '{ sum += $1 + $2 } END { print sum + 0 }')
            if [ "$DIFF_LOC" -eq 0 ]; then
              # Phantom orphan: shopify-sync has commits ahead, but trees are
              # identical (the just-merged auto-reconcile PR squashed those
              # orphan commits into main). Force-reset shopify-sync to the
              # deployed SHA; --force-with-lease catches an admin commit
              # racing this push.
              EXPECTED=$(git rev-parse origin/shopify-sync)
              if PUSH_ERR=$(git -c "$AUTH_HEADER" \
                  push --force-with-lease="shopify-sync:$EXPECTED" \
                  origin "$DEPLOYED_SHA:shopify-sync" 2>&1); then
                echo "::notice::Cleared $AHEAD orphan commit(s); trees identical to deployed SHA"
                echo "sync-status=cleared $AHEAD orphan(s)" >> "$GITHUB_OUTPUT"
              else
                echo "::warning::Phantom cleanup push failed: $PUSH_ERR"
                echo "sync-status=push failed; sync.yml will retry on next admin push or 13:00 UTC cron" >> "$GITHUB_OUTPUT"
              fi
            else
              # Real divergence: an admin commit landed during this deploy.
              # sync.yml on the admin push will open the next reconcile PR.
              echo "::notice::shopify-sync has $AHEAD commit(s) ahead with real diff; deferring to sync.yml"
              echo "sync-status=deferred (admin commit landed mid-deploy)" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "::notice::shopify-sync already at deployed SHA"
            echo "sync-status=already in sync" >> "$GITHUB_OUTPUT"
          fi

      - name: Update preview comment after merge
        # Updates the `<!-- preview -->` sticky comment originally posted by
        # preview.yml::deploy-preview (saying "Preview theme deployed") to
        # reflect that the preview theme has been deleted as part of this
        # merge. preview.yml::cleanup, which would normally do this on
        # `pull_request: closed`, never fires for deploy-chain merges because
        # GitHub suppresses downstream events from GITHUB_TOKEN-driven
        # actions. The deploy chain's Delete preview theme step (above)
        # handles the actual theme deletion; this step closes the UX gap
        # by updating the sticky so the merged PR doesn't appear to still
        # have a live preview.
        #
        # Skipped for Dependabot auto-deploys: preview.yml::deploy-preview is
        # skipped for those PRs so there is no preview sticky to update,
        # and the cleanup step above is also skipped (no theme to delete).
        if: success() && steps.merge.outputs.merged == 'true' && needs.gate.outputs.trigger_path != 'dependabot'
        continue-on-error: true
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          PR_NUMBER: ${{ needs.gate.outputs.pr_number }}
          CLEANUP_OUTCOME: ${{ steps.cleanup.outcome }}
          CLEANUP_STATUS: ${{ steps.cleanup.outputs.cleanup-status }}
        with:
          script: |
            const marker = '<!-- preview -->';
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prNumber = parseInt(process.env.PR_NUMBER, 10);
            const cleanupOutcome = process.env.CLEANUP_OUTCOME || '';
            const cleanupStatus = process.env.CLEANUP_STATUS || '';

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: prNumber,
            });
            const existing = comments
              .filter(c => c.body && c.body.includes(marker))
              .sort((a, b) => a.id - b.id);
            if (existing.length === 0) {
              // No prior preview sticky (e.g. Dependabot PR). Do not create
              // one just to mark it deleted; that would surprise the operator.
              return;
            }

            const body = cleanupOutcome === 'success'
              ? [marker, '# Preview Deployment', '', '🗑️ **Preview theme deleted** — PR merged.'].join('\n')
              : [
                  marker,
                  '# Preview Deployment',
                  '',
                  `⚠️ **Preview theme cleanup warning** — PR merged but preview deletion may have failed (${cleanupStatus || 'see deploy report'}). Delete manually if the theme persists: \`npx shopify theme delete --theme <id> --force\`.`,
                ].join('\n');

            const [keep, ...dupes] = existing;
            await github.rest.issues.updateComment({
              owner, repo, comment_id: keep.id, body,
            });
            for (const dup of dupes) {
              try {
                await github.rest.issues.deleteComment({
                  owner, repo, comment_id: dup.id,
                });
              } catch (_) { /* swallowed */ }
            }

      - name: React with rocket
        if: success() && github.event_name == 'issue_comment'
        continue-on-error: true
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'rocket',
            });

      - name: React with -1
        if: failure() && github.event_name == 'issue_comment'
        continue-on-error: true
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: '-1',
            });

      - name: Post deploy report
        # `if: success()` is correct, NOT `always()`. The cleanup and sync
        # steps' `continue-on-error: true` masks their non-zero exits so the
        # job stays green; success() therefore still passes here. Switching
        # to always() would double-report alongside the Report failure step.
        if: success()
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          PR_NUMBER: ${{ needs.gate.outputs.pr_number }}
          PR_SHORT_SHA: ${{ needs.gate.outputs.short_sha }}
          PR_REF: ${{ needs.gate.outputs.ref }}
          PR_BASE_REF: ${{ needs.gate.outputs.base_ref }}
          TRIGGER_PATH: ${{ needs.gate.outputs.trigger_path }}
          DEPLOYER: ${{ needs.gate.outputs.deployer }}
          PUSH_OUTPUT: ${{ steps.push.outputs.push-output }}
          SMOKE_OUTPUT: ${{ steps.push.outputs.smoke-output }}
          THEME_ID: ${{ steps.push.outputs.theme-id }}
          MERGED: ${{ steps.merge.outputs.merged }}
          MERGE_ERROR: ${{ steps.merge.outputs.merge_error }}
          BRANCH_DELETED: ${{ steps.merge.outputs.branch_deleted }}
          BRANCH_RETAINED: ${{ steps.merge.outputs.branch_retained }}
          CLEANUP_STATUS: ${{ steps.cleanup.outputs.cleanup-status }}
          CLEANUP_OUTCOME: ${{ steps.cleanup.outcome }}
          SYNC_STATUS: ${{ steps.sync.outputs.sync-status }}
          SYNC_OUTCOME: ${{ steps.sync.outcome }}
        with:
          script: |
            const RETRYABLE = new Set([500, 502, 503, 504]);
            const NON_RETRYABLE = new Set([400, 401, 403, 404, 405, 409, 422]);
            const isTransient = (err) => {
              if (NON_RETRYABLE.has(err.status)) return false;
              if (RETRYABLE.has(err.status)) return true;
              const m = err.message || '';
              return /Unexpected end of JSON|ECONNRESET|ETIMEDOUT|socket hang up|network|fetch failed/.test(m);
            };
            const withRetry = async (fn, { attempts = 3, delayMs = 2000, label = 'API call' } = {}) => {
              for (let i = 1; i <= attempts; i++) {
                try { return await fn(); }
                catch (err) {
                  if (i < attempts && isTransient(err)) {
                    const wait = delayMs * Math.pow(2, i - 1);
                    core.warning(`${label} attempt ${i}/${attempts} failed: ${err.message}. Retrying in ${wait}ms.`);
                    await new Promise(r => setTimeout(r, wait));
                  } else { throw err; }
                }
              }
            };

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const MARKER = '<!-- deploy-result -->';
            const prNumber = parseInt(process.env.PR_NUMBER, 10);
            const shortSha = process.env.PR_SHORT_SHA;
            const ref = process.env.PR_REF;
            const baseRef = process.env.PR_BASE_REF;
            const triggerPath = process.env.TRIGGER_PATH;
            const deployer = process.env.DEPLOYER;
            const pushOutput = process.env.PUSH_OUTPUT || 'No output captured.';
            const smokeOutput = process.env.SMOKE_OUTPUT || 'No output captured.';
            const themeId = process.env.THEME_ID || '';
            const merged = process.env.MERGED === 'true';
            const mergeError = process.env.MERGE_ERROR || '';
            const branchDeleted = process.env.BRANCH_DELETED === 'true';
            const branchRetained = process.env.BRANCH_RETAINED === 'true';
            const cleanupStatus = process.env.CLEANUP_STATUS || '';
            const cleanupOutcome = process.env.CLEANUP_OUTCOME || '';
            const syncStatus = process.env.SYNC_STATUS || '';
            const syncOutcome = process.env.SYNC_OUTCOME || '';
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;

            const titleByPath = {
              'comment': 'Deployment Report',
              'shopify-sync': 'Auto-deploy Report (shopify-sync)',
              'dependabot': 'Auto-deploy Report (dependabot)',
            };
            const title = titleByPath[triggerPath] || 'Deployment Report';

            const branchSuffix = branchDeleted
              ? ' and deleted the branch.'
              : branchRetained
                ? ' (branch retained: long-lived integration target).'
                : '.';
            // Special-case the HEAD-drifted-post-deploy failure mode: live
            // has the trusted SHA, but the PR head has moved since deploy,
            // so a manual merge would land different commits than what's
            // on the storefront. Make this discrepancy loud so the operator
            // doesn't reflexively click Merge in the GitHub UI.
            const headDrifted = !merged && /HEAD drifted post-deploy/i.test(mergeError);
            let mergeStatus;
            if (merged) {
              mergeStatus = `:twisted_rightwards_arrows: Merged \`${ref}\` -> \`${baseRef}\`${branchSuffix}`;
            } else if (headDrifted) {
              mergeStatus = `:rotating_light: **Merge skipped (HEAD drifted post-deploy):** ${mergeError}\n\n**Do NOT click Merge in the UI without reviewing the new commits first.** The live theme is serving the SHA Validate ran against, but the PR head has moved past it. Review the diff between the deployed SHA and the current PR head, then either re-deploy the new head (push validates fresh and comment \`deploy\`) or merge manually with full awareness of the divergence.`;
            } else {
              mergeStatus = `:warning: **Merge skipped:** ${mergeError}\n\nThe deployment is live, but the PR must be merged manually.`;
            }

            let cleanupLine;
            if (!merged) {
              cleanupLine = ':information_source: Preview cleanup skipped (merge did not succeed).';
            } else if (cleanupOutcome === 'success') {
              cleanupLine = `:broom: Preview cleanup: ${cleanupStatus || 'no preview theme found'}.`;
            } else {
              cleanupLine = `:warning: **Preview cleanup warning:** ${cleanupStatus || 'see workflow run for details'}. The preview theme may have leaked; delete it manually with \`npx shopify theme delete --theme <id> --force\`.`;
            }

            // steps.sync.outcome reports 'success' even when the Sync step's
            // bash detected a push failure, because the bash explicitly
            // handles errors with `if PUSH_ERR=...; then ... else ... fi` and
            // exits 0 either way. Inspect the sync-status content as the
            // primary signal: `push failed` and `deferred` prefixes indicate
            // the operator needs to be aware (push error or real admin-commit
            // divergence that sync.yml will pick up). syncOutcome is still
            // consulted so that a hard bash failure before any status is
            // written (e.g. `git fetch` errors and `set -e` fires) also lands
            // on the warning path instead of falling through to the success
            // branch with an empty status.
            const syncStatusLower = syncStatus.toLowerCase();
            const syncHadIssue =
              syncOutcome !== 'success'
              || syncStatusLower.startsWith('push failed')
              || syncStatusLower.startsWith('deferred');
            let syncLine;
            if (!merged) {
              syncLine = ':information_source: shopify-sync sync skipped (merge did not succeed).';
            } else if (!syncHadIssue) {
              syncLine = `:white_check_mark: shopify-sync: ${syncStatus || 'unknown'}.`;
            } else {
              syncLine = `:warning: **shopify-sync sync warning:** ${syncStatus || 'see workflow run for details'}. \`sync.yml\` will retry on the next admin push, or at the 13:00 UTC daily cron (whichever comes first).`;
            }

            const body = [
              MARKER,
              `# ${title}`,
              '',
              ':white_check_mark: **Deployed successfully** to live theme. Storefront is now serving this commit.',
              '',
              '| | |',
              '|:--|:--|',
              `| **Commit** | \`${shortSha}\` |`,
              `| **Branch** | \`${ref}\` -> \`${baseRef}\` |`,
              `| **Theme ID** | \`${themeId}\` |`,
              `| **Deployed by** | ${deployer.startsWith('@') ? deployer : (triggerPath === 'comment' ? '@' + deployer : deployer)} |`,
              `| **Workflow run** | [#${context.runNumber}](${runUrl}) |`,
              '',
              '---',
              '',
              '<details><summary><strong>Push output</strong> (last 30 lines)</summary>',
              '',
              '```',
              pushOutput,
              '```',
              '',
              '</details>',
              '',
              '<details><summary><strong>Smoke test</strong></summary>',
              '',
              '```',
              smokeOutput,
              '```',
              '',
              '</details>',
              '',
              '---',
              '',
              mergeStatus,
              '',
              cleanupLine,
              '',
              syncLine,
            ].join('\n');

            // Upsert sticky comment. github.paginate handles PRs with >100
            // comments (auto-reconcile PRs that accumulate daily-cron stale
            // notices), avoiding the duplicate-posting bug a bare listComments
            // call would produce when the existing sticky lives past page 1.
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: prNumber,
            });
            const existing = comments
              .filter(c => c.body && c.body.includes(MARKER))
              .sort((a, b) => a.id - b.id);
            const [keep, ...dupes] = existing;
            if (keep) {
              await withRetry(
                () => github.rest.issues.updateComment({ owner, repo, comment_id: keep.id, body }),
                { attempts: 3, delayMs: 2000, label: 'Update deploy comment' }
              );
            } else {
              await withRetry(
                () => github.rest.issues.createComment({ owner, repo, issue_number: prNumber, body }),
                { attempts: 3, delayMs: 2000, label: 'Post deploy comment' }
              );
            }
            for (const d of dupes) {
              try { await github.rest.issues.deleteComment({ owner, repo, comment_id: d.id }); }
              catch (_) { /* swallowed */ }
            }

      - name: Report failure
        if: failure() && needs.gate.outputs.pr_number != ''
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          PR_NUMBER: ${{ needs.gate.outputs.pr_number }}
          PR_SHORT_SHA: ${{ needs.gate.outputs.short_sha }}
          PR_REF: ${{ needs.gate.outputs.ref }}
          TRIGGER_PATH: ${{ needs.gate.outputs.trigger_path }}
          PUSH_EXIT_CODE: ${{ steps.push.outputs.push-exit-code }}
          PUSH_OUTPUT: ${{ steps.push.outputs.push-output }}
          SMOKE_EXIT_CODE: ${{ steps.push.outputs.smoke-exit-code }}
          SMOKE_OUTPUT: ${{ steps.push.outputs.smoke-output }}
        with:
          script: |
            const RETRYABLE = new Set([500, 502, 503, 504]);
            const NON_RETRYABLE = new Set([400, 401, 403, 404, 405, 409, 422]);
            const isTransient = (err) => {
              if (NON_RETRYABLE.has(err.status)) return false;
              if (RETRYABLE.has(err.status)) return true;
              const m = err.message || '';
              return /Unexpected end of JSON|ECONNRESET|ETIMEDOUT|socket hang up|network|fetch failed/.test(m);
            };
            const withRetry = async (fn, { attempts = 3, delayMs = 2000, label = 'API call' } = {}) => {
              for (let i = 1; i <= attempts; i++) {
                try { return await fn(); }
                catch (err) {
                  if (i < attempts && isTransient(err)) {
                    const wait = delayMs * Math.pow(2, i - 1);
                    core.warning(`${label} attempt ${i}/${attempts} failed: ${err.message}. Retrying in ${wait}ms.`);
                    await new Promise(r => setTimeout(r, wait));
                  } else { throw err; }
                }
              }
            };

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const MARKER = '<!-- deploy-result -->';
            const prNumber = parseInt(process.env.PR_NUMBER, 10);
            const shortSha = process.env.PR_SHORT_SHA;
            const ref = process.env.PR_REF;
            const triggerPath = process.env.TRIGGER_PATH;
            const pushExit = process.env.PUSH_EXIT_CODE || '';
            const pushOutput = process.env.PUSH_OUTPUT || '';
            const smokeExit = process.env.SMOKE_EXIT_CODE || '';
            const smokeOutput = process.env.SMOKE_OUTPUT || '';
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;

            const titleByPath = {
              'comment': 'Deployment Report',
              'shopify-sync': 'Auto-deploy Report (shopify-sync)',
              'dependabot': 'Auto-deploy Report (dependabot)',
            };
            const title = titleByPath[triggerPath] || 'Deployment Report';

            let failStage, errorDetail;
            if (pushExit === '') {
              failStage = 'Pre-deploy Checks';
              errorDetail = 'Gate checks or checkout failed before push. See the workflow run.';
            } else if (pushExit === '99') {
              failStage = 'Live theme ID assertion';
              errorDetail = pushOutput || 'Live theme ID did not match the expected value.';
            } else if (pushExit !== '0') {
              failStage = 'Theme push (shopify theme push --live)';
              errorDetail = pushOutput || 'Push exited non-zero. See the workflow run.';
            } else if (smokeExit !== '0') {
              failStage = 'Smoke test (live theme is currently serving this SHA)';
              errorDetail = `${smokeOutput || 'A storefront path returned non-200.'}\n\nThe push succeeded, so the storefront is now on \`${shortSha}\`. Either fix and re-deploy, or roll back per the procedure in README.md (revert PR or break-glass \`shopify theme push --live\`).`;
            } else {
              failStage = 'Post-push';
              errorDetail = 'Merge or comment posting failed. See the workflow run.';
            }

            const retryHint = triggerPath === 'comment'
              ? ':warning: Fix the issue, push a new commit, wait for validation to pass, then comment `deploy` to retry.'
              : ':warning: Investigate the failure. Auto-deploy will retry on the next Validate cycle once the underlying issue is resolved; manual `deploy` comment remains available as an escape hatch.';

            const body = [
              MARKER,
              `# ${title}`,
              '',
              `:x: **Deployment failed** at **${failStage}**. The PR remains open.`,
              '',
              '| | |',
              '|:--|:--|',
              `| **Commit** | \`${shortSha}\` |`,
              `| **Branch** | \`${ref}\` |`,
              `| **Failed stage** | ${failStage} |`,
              `| **Workflow run** | [#${context.runNumber}](${runUrl}) |`,
              '',
              '---',
              '',
              '<details open><summary><strong>Error details</strong></summary>',
              '',
              '```',
              errorDetail,
              '```',
              '',
              '</details>',
              '',
              '---',
              '',
              retryHint,
            ].join('\n');

            // Paginate so a failure on a high-comment-count PR still finds
            // the existing sticky instead of posting a duplicate. Same
            // rationale as the deploy-report upsert above.
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: prNumber,
            });
            const existing = comments
              .filter(c => c.body && c.body.includes(MARKER))
              .sort((a, b) => a.id - b.id);
            const [keep, ...dupes] = existing;
            if (keep) {
              await withRetry(
                () => github.rest.issues.updateComment({ owner, repo, comment_id: keep.id, body }),
                { attempts: 3, delayMs: 2000, label: 'Update failure comment' }
              );
            } else {
              await withRetry(
                () => github.rest.issues.createComment({ owner, repo, issue_number: prNumber, body }),
                { attempts: 3, delayMs: 2000, label: 'Post failure comment' }
              );
            }
            for (const d of dupes) {
              try { await github.rest.issues.deleteComment({ owner, repo, comment_id: d.id }); }
              catch (_) { /* swallowed */ }
            }

      - name: Report pre-identification failure
        if: failure() && needs.gate.outputs.pr_number == ''
        run: |
          {
            echo "## deploy: pre-identification failure"
            echo ""
            echo "Failed before a candidate PR was identified, so no PR comment was posted."
            echo "See the workflow run output for details."
          } >> "$GITHUB_STEP_SUMMARY"
