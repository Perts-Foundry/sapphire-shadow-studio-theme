name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: deploy-live
  cancel-in-progress: false

env:
  SHOPIFY_CLI_TTY: "0"
  CI: "1"
  SHOPIFY_FLAG_NO_COLOR: "true"
  LIVE_THEME_ID: "181702754604"

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: shopify-write
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Reset to tip-of-main
        run: |
          set -euo pipefail
          git fetch --prune --no-tags origin main shopify-sync
          git reset --hard origin/main

      - name: Deploy guard - shopify-sync must not be ahead
        run: |
          set -euo pipefail
          AHEAD=$(git rev-list --count origin/main..origin/shopify-sync)
          if [ "$AHEAD" -gt 0 ]; then
            gh issue create \
              --title "Deploy aborted: shopify-sync ${AHEAD} commits ahead of main" \
              --label deploy-attention \
              --body "Run \`workflow_dispatch sync-reconcile.yml\` to merge shopify-sync into main, then re-trigger deploy." || true
            echo "::error::shopify-sync ahead of main (${AHEAD} commits); aborting"
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"
          cache: npm

      - name: Install Shopify CLI
        run: npm ci

      - name: Live theme ID assertion
        env:
          SHOPIFY_CLI_THEME_TOKEN: ${{ secrets.SHOPIFY_CLI_THEME_TOKEN }}
          SHOPIFY_FLAG_STORE: ${{ vars.SHOPIFY_FLAG_STORE }}
        run: |
          set -euo pipefail
          npx shopify theme list --json > themes.json
          ACTUAL=$(jq -r '[.[] | select(.role=="live")][0].id // empty' themes.json)
          if [ "$ACTUAL" != "$LIVE_THEME_ID" ]; then
            gh issue create \
              --title "Deploy aborted: live theme ID mismatch" \
              --label deploy-attention \
              --body "Expected live theme \`${LIVE_THEME_ID}\`; found \`${ACTUAL}\`. Investigate before deploying." || true
            echo "::error::live theme ID mismatch (expected ${LIVE_THEME_ID}, got ${ACTUAL})"
            exit 1
          fi

      - name: Push to live (with retry)
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        env:
          SHOPIFY_CLI_THEME_TOKEN: ${{ secrets.SHOPIFY_CLI_THEME_TOKEN }}
          SHOPIFY_FLAG_STORE: ${{ vars.SHOPIFY_FLAG_STORE }}
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 60
          shell: bash
          command: |
            set -euo pipefail
            npx shopify theme push --live --allow-live --json > push.json
            jq '{id: .theme.id, name: .theme.name, role: .theme.role}' push.json > push-summary.json
            cat push-summary.json

      - name: Smoke test
        env:
          SHOPIFY_FLAG_STORE: ${{ vars.SHOPIFY_FLAG_STORE }}
        run: |
          set -euo pipefail
          for path in "/" "/cart"; do
            CODE=$(curl -fsSL --max-time 30 -o "/tmp/page${path//\//-}.html" -w '%{http_code}' "https://${SHOPIFY_FLAG_STORE}${path}" || echo "000")
            if [ "$CODE" != "200" ]; then
              echo "::error::Smoke test failed: ${path} returned ${CODE}"
              exit 1
            fi
            echo "OK: ${path} -> 200"
          done

      - name: Hotfix audit
        if: ${{ startsWith(github.event.head_commit.message, '[hotfix]') }}
        run: |
          gh issue create \
            --title "Hotfix deployed: ${{ github.sha }}" \
            --label hotfix-bypass \
            --body "Commit \`${{ github.sha }}\` deployed via [hotfix] bypass at $(date -u +%Y-%m-%dT%H:%M:%SZ)."

      - name: File issue on failure
        if: failure()
        run: |
          gh issue create \
            --title "Deploy failed at ${{ github.sha }}" \
            --label deploy-attention \
            --body "Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
