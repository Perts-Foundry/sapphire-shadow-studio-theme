# Unit tests for the size-chart operator tooling (scripts/size-chart/**).
#
# This is NOT a required check and is deliberately kept off branch protection: it exercises
# operator tooling (a Node renderer + template writer), not shipped theme code, so it must never
# gate a theme deploy or the shopify-sync / dependabot auto-deploy paths in deploy.yml. It runs
# only when the size-chart tooling itself changes.
name: size-chart-tests

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'scripts/size-chart/**'
      - '.github/workflows/size-chart-tests.yml'

permissions: {}

concurrency:
  group: size-chart-tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout PR head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: npm

      # Full install (not --ignore-scripts): the render smoke test needs sharp's prebuilt binary.
      - name: Install dependencies
        run: npm ci

      - name: Run size-chart tests
        run: node --test scripts/size-chart/test/*.test.mjs
