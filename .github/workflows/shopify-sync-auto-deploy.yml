# Auto-deploy the shopify-sync auto-reconcile PR after Validate succeeds.
# Triggered by `workflow_run` so the deploy chain stays driven by the same
# Validate-on-HEAD-SHA gate as the human comment-deploy path.
#
# Security backbone: every API call uses `trustedSha` resolved from
# `actions.getWorkflowRun(workflow_run.id).head_sha`, never `pr.head.sha`. A
# force-push to `shopify-sync` between Validate completion and this workflow
# firing will fail the drift check and abort with a skip-comment.
#
# WARNING: triggered by validate.yml's exact name; renaming validate.yml
# silently breaks this workflow.
name: shopify-sync-auto-deploy

on:
  workflow_run:
    workflows: ["validate"]
    types: [completed]
    branches: ["shopify-sync"]

permissions: {}

concurrency:
  # Shared with deploy.yml + dependabot-auto-deploy.yml; serialises live-theme
  # writes across the three deploy paths. Renaming this group fragments the
  # live-write mutex.
  group: deploy-production
  cancel-in-progress: false

jobs:
  auto-deploy:
    name: auto-deploy
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      checks: read
    env:
      LIVE_THEME_ID: "181702754604"
    steps:
      - name: Resolve trusted SHA from workflow_run
        id: trusted
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const { data: run } = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.payload.workflow_run.id,
            });
            if (!run.head_sha) {
              core.setFailed('workflow_run has no head_sha; cannot pin trusted SHA.');
              return;
            }
            core.setOutput('sha', run.head_sha);
            core.setOutput('triggering_run_id', run.id.toString());

      - name: Find PR and verify auto-reconcile gates
        id: pr
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          TRUSTED_SHA: ${{ steps.trusted.outputs.sha }}
        with:
          script: |
            const trustedSha = process.env.TRUSTED_SHA;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const sameRepoFull = `${owner}/${repo}`;

            const postSkip = async (prNumber, reason) => {
              const marker = '<!-- shopify-sync-auto-deploy -->';
              const body = `${marker}\n\n:no_entry: **Auto-deploy skipped.**\n\nReason: ${reason}`;
              const { data: comments } = await github.rest.issues.listComments({
                owner, repo, issue_number: prNumber, per_page: 100,
              });
              const existing = comments
                .filter(c => c.body && c.body.includes(marker))
                .sort((a, b) => a.id - b.id);
              const [keep, ...dupes] = existing;
              if (keep) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: keep.id, body });
              } else {
                await github.rest.issues.createComment({ owner, repo, issue_number: prNumber, body });
              }
              for (const d of dupes) {
                await github.rest.issues.deleteComment({ owner, repo, comment_id: d.id });
              }
            };

            const { data: pulls } = await github.rest.pulls.list({
              owner, repo, state: 'open', head: `${owner}:shopify-sync`, per_page: 5,
            });
            if (pulls.length === 0) {
              core.info('No open PR from shopify-sync; nothing to deploy.');
              return;
            }
            const pr = pulls[0];
            const prNumber = pr.number;

            // Same-repo defence-in-depth (Dependabot / shopify[bot] only push
            // to origin's protected branches, but the explicit assertion is
            // cheap insurance).
            if (!pr.head.repo || pr.head.repo.full_name !== sameRepoFull) {
              await postSkip(prNumber, `PR head is not in the origin repo (${pr.head.repo?.full_name}).`);
              return;
            }

            // HEAD drift check: did the branch tip move between Validate and now?
            if (pr.head.sha !== trustedSha) {
              await postSkip(prNumber, `HEAD drifted between Validate and auto-deploy (validated \`${trustedSha.substring(0,7)}\`, current head \`${pr.head.sha.substring(0,7)}\`). The next Validate cycle will retrigger.`);
              return;
            }
            // Tree-equivalence belt-and-braces: a same-tree force-push amend
            // is ok; a different tree is not.
            try {
              const { data: cmp } = await github.rest.repos.compareCommits({
                owner, repo, base: trustedSha, head: pr.head.sha,
              });
              if (cmp.status !== 'identical') {
                await postSkip(prNumber, `compareCommits status is \`${cmp.status}\` (expected \`identical\`). Aborting.`);
                return;
              }
            } catch (e) {
              await postSkip(prNumber, `compareCommits failed: ${e.message}.`);
              return;
            }

            // auto-reconcile label gate.
            if (!pr.labels.some(l => l.name === 'auto-reconcile')) {
              core.info('PR does not carry auto-reconcile label; ignoring.');
              return;
            }

            // manual-review escape hatch.
            if (pr.labels.some(l => l.name === 'manual-review')) {
              await postSkip(prNumber, '`manual-review` label present; auto-deploy skipped.');
              return;
            }

            // Bot identity gate: defends against forged author/committer git
            // headers. Use only the GitHub-API-resolved login fields.
            const { data: commit } = await github.rest.repos.getCommit({
              owner, repo, ref: trustedSha,
            });
            const verified = commit.commit?.verification?.verified === true;
            const authorLogin = commit.author?.login;
            const committerLogin = commit.committer?.login;
            const prUserLogin = pr.user?.login;
            const expected = 'shopify[bot]';
            if (!verified || authorLogin !== expected || committerLogin !== expected || prUserLogin !== expected) {
              await postSkip(prNumber, `Bot-identity gate failed (verified=${verified}, author=${authorLogin}, committer=${committerLogin}, pr.user=${prUserLogin}; expected ${expected}).`);
              return;
            }

            // Base-staleness: main must not have advanced past the PR's base.
            const { data: main } = await github.rest.repos.getBranch({
              owner, repo, branch: 'main',
            });
            if (main.commit.sha !== pr.base.sha) {
              await postSkip(prNumber, `\`main\` advanced (base \`${pr.base.sha.substring(0,7)}\`, current \`${main.commit.sha.substring(0,7)}\`). sync-reconcile will refresh the PR and retrigger.`);
              return;
            }

            // Diff sanity: paginate listFiles. Defence-in-depth against
            // sync-reconcile.yml's own check (which ran at PR-open, before any
            // hypothetical force-push).
            let files = [];
            const perPage = 100;
            for (let page = 1; ; page++) {
              const { data: pageFiles } = await github.rest.pulls.listFiles({
                owner, repo, pull_number: prNumber, per_page: perPage, page,
              });
              files = files.concat(pageFiles);
              if (pageFiles.length < perPage) break;
              if (page > 50) break; // 5000-file safety bound
            }
            // `.github/` covers workflows/, actions/, scripts/, plus
            // dependabot.yml, zizmor.yml, CODEOWNERS, etc. Admin edits
            // should never touch CI config; layout/theme.liquid is rarely
            // edited from admin.
            const protectedHits = files.filter(f =>
              f.filename.startsWith('.github/') ||
              f.filename === 'layout/theme.liquid'
            );
            if (protectedHits.length > 0) {
              await postSkip(prNumber, `Diff touches protected paths: ${protectedHits.map(f => f.filename).slice(0, 5).join(', ')}.`);
              return;
            }
            const totalLoc = files.reduce((sum, f) => sum + (f.additions ?? 0) + (f.deletions ?? 0), 0);
            if (totalLoc > 1000) {
              await postSkip(prNumber, `Diff exceeds 1000 LOC (${totalLoc}); admin edits should not be that large.`);
              return;
            }

            core.setOutput('number', prNumber.toString());
            core.setOutput('sha', trustedSha);
            core.setOutput('short_sha', trustedSha.substring(0, 7));
            core.setOutput('ref', pr.head.ref);
            core.setOutput('base_ref', pr.base.ref);

      - name: Verify triggering validate run is still green
        if: steps.pr.outputs.number != ''
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            // Re-fetch the triggering workflow_run by id and re-assert
            // conclusion=success. The job-level `if:` already gates on
            // workflow_run.conclusion == 'success' at trigger time; this
            // re-fetch defends against the (rare) case where the workflow_run
            // record is mutated between trigger and execution.
            const { data: run } = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.payload.workflow_run.id,
            });
            if (run.status !== 'completed' || run.conclusion !== 'success') {
              core.setFailed(`Triggering validate run not green (${run.status}/${run.conclusion}).`);
              return;
            }

      - name: Checkout trusted SHA
        if: steps.pr.outputs.number != ''
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ steps.trusted.outputs.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Live theme push
        id: push
        if: steps.pr.outputs.number != ''
        uses: ./.github/actions/shopify-theme-push
        with:
          mode: live
          shopify-cli-theme-token: ${{ secrets.SHOPIFY_CLI_THEME_TOKEN }}
          shopify-flag-store: ${{ vars.SHOPIFY_FLAG_STORE }}
          live-theme-id: ${{ env.LIVE_THEME_ID }}
          # See deploy.yml for the format() guard rationale.
          smoke-base-url: ${{ vars.SHOPIFY_DOMAIN && format('https://{0}', vars.SHOPIFY_DOMAIN) || '' }}

      - name: Squash merge
        id: merge
        if: success() && steps.pr.outputs.number != ''
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          PR_SHA: ${{ steps.pr.outputs.sha }}
          PR_REF: ${{ steps.pr.outputs.ref }}
        with:
          script: |
            const RETRYABLE = new Set([500, 502, 503, 504]);
            const NON_RETRYABLE = new Set([400, 401, 403, 404, 405, 409, 422]);
            const isTransient = (err) => {
              if (NON_RETRYABLE.has(err.status)) return false;
              if (RETRYABLE.has(err.status)) return true;
              const m = err.message || '';
              return /Unexpected end of JSON|ECONNRESET|ETIMEDOUT|socket hang up|network|fetch failed/.test(m);
            };
            const withRetry = async (fn, { attempts = 3, delayMs = 2000, label = 'API call' } = {}) => {
              for (let i = 1; i <= attempts; i++) {
                try { return await fn(); }
                catch (err) {
                  if (i < attempts && isTransient(err)) {
                    const wait = delayMs * Math.pow(2, i - 1);
                    core.warning(`${label} attempt ${i}/${attempts} failed: ${err.message}. Retrying in ${wait}ms.`);
                    await new Promise(r => setTimeout(r, wait));
                  } else { throw err; }
                }
              }
            };

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prNumber = parseInt(process.env.PR_NUMBER, 10);
            const sha = process.env.PR_SHA;
            const ref = process.env.PR_REF;

            // Pre-merge HEAD drift recheck: between deploy and merge, did the
            // PR tip move? If yes, the live deploy already shipped (it was the
            // trusted SHA), but we cannot safely squash-merge a different tree.
            let merged = true;
            let mergeError = '';
            const { data: prNow } = await github.rest.pulls.get({
              owner, repo, pull_number: prNumber,
            });
            if (prNow.head.sha !== sha) {
              merged = false;
              mergeError = `HEAD drifted post-deploy (validated \`${sha.substring(0,7)}\`, current \`${prNow.head.sha.substring(0,7)}\`). Live theme is on the deployed SHA; PR left open for manual reconciliation.`;
            } else {
              try {
                await withRetry(
                  () => github.rest.pulls.merge({
                    owner, repo, pull_number: prNumber, merge_method: 'squash', sha,
                  }),
                  { attempts: 3, delayMs: 2000, label: 'Squash merge' }
                );
              } catch (e) {
                merged = false;
                mergeError = e.message;
              }
            }

            // Long-lived branches must never be deleted by auto-merge.
            // shopify-sync is the integration target the Shopify GitHub
            // Integration writes admin edits to; deleting it would break the
            // admin-edit pipeline.
            const longLived = new Set(['main', 'shopify-sync']);
            const branchRetained = longLived.has(ref);
            let branchDeleted = false;
            if (merged && !branchRetained) {
              try {
                await withRetry(
                  () => github.rest.git.deleteRef({
                    owner, repo, ref: `heads/${ref}`,
                  }),
                  { attempts: 2, delayMs: 1000, label: 'Delete branch' }
                );
                branchDeleted = true;
              } catch (_) { /* swallowed */ }
            }

            core.setOutput('merged', merged ? 'true' : 'false');
            core.setOutput('merge_error', mergeError);
            core.setOutput('branch_deleted', branchDeleted ? 'true' : 'false');
            core.setOutput('branch_retained', branchRetained ? 'true' : 'false');

      - name: Delete preview theme
        id: cleanup
        if: success() && steps.pr.outputs.number != '' && steps.merge.outputs.merged == 'true'
        # Cleanup runs AFTER successful merge so a runner crash or non-transient
        # cleanup failure cannot leave the system in `live deployed + PR open +
        # preview gone`. continue-on-error keeps a leaked preview from blocking
        # the post-deploy report; the cleanup_status line surfaces failures.
        # Runs even when the branch is retained (shopify-sync long-lived) because
        # the PR is closed regardless.
        continue-on-error: true
        uses: ./.github/actions/shopify-theme-push
        with:
          mode: delete-preview
          shopify-cli-theme-token: ${{ secrets.SHOPIFY_CLI_THEME_TOKEN }}
          shopify-flag-store: ${{ vars.SHOPIFY_FLAG_STORE }}
          pr-number: ${{ steps.pr.outputs.number }}

      - name: Post auto-deploy report
        # `if: success()` is correct, NOT `always()`. The cleanup step's
        # `continue-on-error: true` masks its non-zero exit so the job stays
        # green; success() therefore still passes here. Switching to
        # always() would double-report alongside the Report failure step.
        if: success() && steps.pr.outputs.number != ''
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          PR_SHORT_SHA: ${{ steps.pr.outputs.short_sha }}
          PR_REF: ${{ steps.pr.outputs.ref }}
          PR_BASE_REF: ${{ steps.pr.outputs.base_ref }}
          PUSH_OUTPUT: ${{ steps.push.outputs.push-output }}
          SMOKE_OUTPUT: ${{ steps.push.outputs.smoke-output }}
          THEME_ID: ${{ steps.push.outputs.theme-id }}
          MERGED: ${{ steps.merge.outputs.merged }}
          MERGE_ERROR: ${{ steps.merge.outputs.merge_error }}
          BRANCH_DELETED: ${{ steps.merge.outputs.branch_deleted }}
          BRANCH_RETAINED: ${{ steps.merge.outputs.branch_retained }}
          CLEANUP_STATUS: ${{ steps.cleanup.outputs.cleanup-status }}
          CLEANUP_OUTCOME: ${{ steps.cleanup.outcome }}
        with:
          script: |
            const RETRYABLE = new Set([500, 502, 503, 504]);
            const NON_RETRYABLE = new Set([400, 401, 403, 404, 405, 409, 422]);
            const isTransient = (err) => {
              if (NON_RETRYABLE.has(err.status)) return false;
              if (RETRYABLE.has(err.status)) return true;
              const m = err.message || '';
              return /Unexpected end of JSON|ECONNRESET|ETIMEDOUT|socket hang up|network|fetch failed/.test(m);
            };
            const withRetry = async (fn, { attempts = 3, delayMs = 2000, label = 'API call' } = {}) => {
              for (let i = 1; i <= attempts; i++) {
                try { return await fn(); }
                catch (err) {
                  if (i < attempts && isTransient(err)) {
                    const wait = delayMs * Math.pow(2, i - 1);
                    core.warning(`${label} attempt ${i}/${attempts} failed: ${err.message}. Retrying in ${wait}ms.`);
                    await new Promise(r => setTimeout(r, wait));
                  } else { throw err; }
                }
              }
            };

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const marker = '<!-- shopify-sync-auto-deploy -->';
            const prNumber = parseInt(process.env.PR_NUMBER, 10);
            const shortSha = process.env.PR_SHORT_SHA;
            const ref = process.env.PR_REF;
            const baseRef = process.env.PR_BASE_REF;
            const pushOutput = process.env.PUSH_OUTPUT || 'No output captured.';
            const smokeOutput = process.env.SMOKE_OUTPUT || 'No output captured.';
            const themeId = process.env.THEME_ID || '';
            const merged = process.env.MERGED === 'true';
            const mergeError = process.env.MERGE_ERROR || '';
            const branchDeleted = process.env.BRANCH_DELETED === 'true';
            const branchRetained = process.env.BRANCH_RETAINED === 'true';
            const cleanupStatus = process.env.CLEANUP_STATUS || '';
            const cleanupOutcome = process.env.CLEANUP_OUTCOME || '';
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;

            const branchSuffix = branchDeleted
              ? ' and deleted the branch.'
              : branchRetained
                ? ' (branch retained: long-lived integration target).'
                : '.';
            const mergeStatus = merged
              ? `:twisted_rightwards_arrows: Merged \`${ref}\` -> \`${baseRef}\`${branchSuffix}`
              : `:warning: **Merge skipped:** ${mergeError}`;

            let cleanupLine;
            if (!merged) {
              cleanupLine = ':information_source: Preview cleanup skipped (merge did not succeed).';
            } else if (cleanupOutcome === 'success') {
              cleanupLine = `:broom: Preview cleanup: ${cleanupStatus || 'no preview theme found'}.`;
            } else {
              cleanupLine = `:warning: **Preview cleanup warning:** ${cleanupStatus || 'see workflow run for details'}. The preview theme may have leaked; delete it manually with \`npx shopify theme delete --theme <id> --force\`.`;
            }

            const body = [
              marker,
              '# Auto-deploy Report (shopify-sync)',
              '',
              ':white_check_mark: **Deployed successfully** to live theme.',
              '',
              '| | |',
              '|:--|:--|',
              `| **Commit** | \`${shortSha}\` |`,
              `| **Branch** | \`${ref}\` -> \`${baseRef}\` |`,
              `| **Theme ID** | \`${themeId}\` |`,
              `| **Workflow run** | [#${context.runNumber}](${runUrl}) |`,
              '',
              '---',
              '',
              '<details><summary><strong>Push output</strong> (last 30 lines)</summary>',
              '',
              '```',
              pushOutput,
              '```',
              '',
              '</details>',
              '',
              '<details><summary><strong>Smoke test</strong></summary>',
              '',
              '```',
              smokeOutput,
              '```',
              '',
              '</details>',
              '',
              '---',
              '',
              mergeStatus,
              '',
              cleanupLine,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number: prNumber, per_page: 100,
            });
            const existing = comments
              .filter(c => c.body && c.body.includes(marker))
              .sort((a, b) => a.id - b.id);
            const [keep, ...dupes] = existing;
            if (keep) {
              await withRetry(
                () => github.rest.issues.updateComment({ owner, repo, comment_id: keep.id, body }),
                { attempts: 3, delayMs: 2000, label: 'Update auto-deploy comment' }
              );
            } else {
              await withRetry(
                () => github.rest.issues.createComment({ owner, repo, issue_number: prNumber, body }),
                { attempts: 3, delayMs: 2000, label: 'Post auto-deploy comment' }
              );
            }
            for (const d of dupes) {
              try {
                await github.rest.issues.deleteComment({ owner, repo, comment_id: d.id });
              } catch (_) { /* swallowed */ }
            }

      - name: Report failure
        if: failure() && steps.pr.outputs.number != ''
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          PR_SHORT_SHA: ${{ steps.pr.outputs.short_sha }}
          PR_REF: ${{ steps.pr.outputs.ref }}
          PUSH_EXIT_CODE: ${{ steps.push.outputs.push-exit-code }}
          PUSH_OUTPUT: ${{ steps.push.outputs.push-output }}
          SMOKE_EXIT_CODE: ${{ steps.push.outputs.smoke-exit-code }}
          SMOKE_OUTPUT: ${{ steps.push.outputs.smoke-output }}
        with:
          script: |
            const RETRYABLE = new Set([500, 502, 503, 504]);
            const NON_RETRYABLE = new Set([400, 401, 403, 404, 405, 409, 422]);
            const isTransient = (err) => {
              if (NON_RETRYABLE.has(err.status)) return false;
              if (RETRYABLE.has(err.status)) return true;
              const m = err.message || '';
              return /Unexpected end of JSON|ECONNRESET|ETIMEDOUT|socket hang up|network|fetch failed/.test(m);
            };
            const withRetry = async (fn, { attempts = 3, delayMs = 2000, label = 'API call' } = {}) => {
              for (let i = 1; i <= attempts; i++) {
                try { return await fn(); }
                catch (err) {
                  if (i < attempts && isTransient(err)) {
                    const wait = delayMs * Math.pow(2, i - 1);
                    core.warning(`${label} attempt ${i}/${attempts} failed: ${err.message}. Retrying in ${wait}ms.`);
                    await new Promise(r => setTimeout(r, wait));
                  } else { throw err; }
                }
              }
            };

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const marker = '<!-- shopify-sync-auto-deploy -->';
            const prNumber = parseInt(process.env.PR_NUMBER, 10);
            const shortSha = process.env.PR_SHORT_SHA;
            const ref = process.env.PR_REF;
            const pushExit = process.env.PUSH_EXIT_CODE || '';
            const pushOutput = process.env.PUSH_OUTPUT || '';
            const smokeExit = process.env.SMOKE_EXIT_CODE || '';
            const smokeOutput = process.env.SMOKE_OUTPUT || '';
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;

            let failStage, errorDetail;
            if (pushExit === '') {
              failStage = 'Pre-deploy Checks';
              errorDetail = 'Validation correlation, gate checks, or checkout failed before push. See the workflow run.';
            } else if (pushExit === '99') {
              failStage = 'Live theme ID assertion';
              errorDetail = pushOutput || 'Live theme ID did not match the expected value.';
            } else if (pushExit !== '0') {
              failStage = 'Theme push (shopify theme push --live)';
              errorDetail = pushOutput || 'Push exited non-zero. See the workflow run.';
            } else if (smokeExit !== '0') {
              failStage = 'Smoke test (live theme is currently serving this SHA)';
              errorDetail = `${smokeOutput || 'A storefront path returned non-200.'}\n\nThe push succeeded, so the storefront is now on \`${shortSha}\`. Investigate and either fix and re-deploy, or roll back per the procedure in README.md (revert PR or break-glass \`shopify theme push --live\`).`;
            } else {
              failStage = 'Post-push';
              errorDetail = 'Merge or comment posting failed. See the workflow run.';
            }

            const body = [
              marker,
              '# Auto-deploy Report (shopify-sync)',
              '',
              `:x: **Auto-deploy failed** at **${failStage}**. The PR remains open.`,
              '',
              '| | |',
              '|:--|:--|',
              `| **Commit** | \`${shortSha}\` |`,
              `| **Branch** | \`${ref}\` |`,
              `| **Failed stage** | ${failStage} |`,
              `| **Workflow run** | [#${context.runNumber}](${runUrl}) |`,
              '',
              '---',
              '',
              '<details open><summary><strong>Error details</strong></summary>',
              '',
              '```',
              errorDetail,
              '```',
              '',
              '</details>',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number: prNumber, per_page: 100,
            });
            const existing = comments
              .filter(c => c.body && c.body.includes(marker))
              .sort((a, b) => a.id - b.id);
            const [keep, ...dupes] = existing;
            if (keep) {
              await withRetry(
                () => github.rest.issues.updateComment({ owner, repo, comment_id: keep.id, body }),
                { attempts: 3, delayMs: 2000, label: 'Update failure comment' }
              );
            } else {
              await withRetry(
                () => github.rest.issues.createComment({ owner, repo, issue_number: prNumber, body }),
                { attempts: 3, delayMs: 2000, label: 'Post failure comment' }
              );
            }
            for (const d of dupes) {
              try {
                await github.rest.issues.deleteComment({ owner, repo, comment_id: d.id });
              } catch (_) { /* swallowed */ }
            }

      - name: Report pre-identification failure
        if: failure() && steps.pr.outputs.number == ''
        run: |
          {
            echo "## shopify-sync-auto-deploy: pre-identification failure"
            echo ""
            echo "Failed before a candidate PR was identified, so no PR comment was posted."
            echo "See the workflow run output for details."
          } >> "$GITHUB_STEP_SUMMARY"
