# Reconciles shopify-sync <-> main. Two arms in one workflow:
#   (1) push: main fast-forwards shopify-sync to main when shopify-sync has
#       no commits ahead. Push uses GITHUB_TOKEN, which does not retrigger
#       this workflow's push: shopify-sync arm. Do not switch to a PAT or
#       deploy key without adding an actor filter.
#   (2) push: shopify-sync opens or refreshes the auto-reconcile-labelled
#       PR; this primarily covers the cold-start case (no PR yet). Once a
#       PR is open, validate.yml's pull_request: synchronize trigger picks
#       up subsequent admin commits without sync-reconcile re-running.
# The 13:00 UTC cron is a safety net for both arms.
#
# WARNING: arms (1) and (2) deliberately do NOT share the deploy-production
# concurrency group with shopify-sync-auto-deploy.yml; the fast-forward
# step needs to run while the deploy chain is winding down post-merge.
# Only one git push happens per run, in the fast-forward step itself.
name: sync-reconcile

on:
  schedule:
    # 13:00 UTC = 09:00 EDT (Mar-Nov) / 08:00 EST (Nov-Mar). GitHub cron runs in UTC; no TZ.
    - cron: '0 13 * * *'
  push:
    branches: [main, shopify-sync]
  workflow_dispatch:

permissions: {}

concurrency:
  group: sync-reconcile
  cancel-in-progress: false

jobs:
  sync-reconcile:
    name: sync-reconcile
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout shopify-sync
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          ref: shopify-sync
          persist-credentials: false

      - name: Fast-forward shopify-sync to main when clean
        run: |
          set -euo pipefail
          git fetch --prune --no-tags origin main
          AHEAD=$(git rev-list --count origin/main..HEAD)
          BEHIND=$(git rev-list --count HEAD..origin/main)
          if [ "$AHEAD" -eq 0 ] && [ "$BEHIND" -gt 0 ]; then
            git merge --ff-only origin/main
            # Unforced `git push` is load-bearing: a non-fast-forward
            # rejection is exactly how we detect an admin commit racing
            # this push. Do not "fix" by adding --force or
            # --force-with-lease without re-thinking race semantics.
            # Token is injected via http.extraheader per-command (checkout
            # uses persist-credentials: false) so the credential stays out
            # of .git/config for the rest of the job. $GH_TOKEN is the
            # built-in GITHUB_TOKEN (auto-redacted in workflow logs).
            if PUSH_ERR=$(git -c "http.extraheader=AUTHORIZATION: bearer $GH_TOKEN" push origin shopify-sync 2>&1); then
              echo "::notice::Fast-forwarded shopify-sync $BEHIND commits to match origin/main"
            else
              echo "::warning::Fast-forward push failed (likely raced an admin commit); next cycle will retry. git push said: $PUSH_ERR"
            fi
          elif [ "$AHEAD" -gt 0 ]; then
            echo "Skipping fast-forward: shopify-sync has $AHEAD commit(s) ahead; existing reconcile flow handles."
          else
            echo "Already in sync."
          fi

      - name: Determine sync status
        id: status
        run: |
          set -euo pipefail
          # Intentional re-fetch: keeps this step independently re-runnable
          # via workflow_dispatch even if the fast-forward step ever moves
          # or is removed. The cost is a sub-second no-op against the warm
          # remote.
          git fetch --prune --no-tags origin main
          AHEAD=$(git rev-list --count origin/main..HEAD)
          echo "ahead=$AHEAD" >> "$GITHUB_OUTPUT"
          if [ "$AHEAD" -gt 0 ]; then
            git log --oneline origin/main..HEAD > /tmp/commits.txt
            DIFF_FILES=$(git diff --name-only origin/main..HEAD)
            DIFF_LOC=$(git diff --numstat origin/main..HEAD | awk '{ sum += $1 + $2 } END { print sum + 0 }')
            {
              echo "files<<EOF"
              echo "$DIFF_FILES"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            echo "loc=$DIFF_LOC" >> "$GITHUB_OUTPUT"
            if [ "$DIFF_LOC" -eq 0 ]; then
              # Phantom state: shopify-sync has commits ahead of main but
              # the tree is identical (typically because the previous
              # auto-reconcile PR was squash-merged into main, leaving the
              # original bot commit orphaned on shopify-sync). The
              # downstream "Diff sanity check" and "Open or refresh
              # reconcile PR" steps both gate on `loc != '0'` so the
              # phantom does not produce empty-diff PRs. Layered defense
              # with shopify-sync-auto-deploy.yml's tree-equivalence check
              # (compareCommits.status === 'identical'). Self-clears when
              # the next real admin commit arrives and a subsequent
              # push:main fast-forwards shopify-sync past the orphans.
              echo "::notice::shopify-sync ahead by $AHEAD but tree is identical to origin/main (phantom state from a prior squash-merge); skipping reconcile PR until a real admin commit arrives."
            fi
          fi

      - name: Diff sanity check
        if: steps.status.outputs.ahead != '0' && steps.status.outputs.loc != '0'
        env:
          FILES: ${{ steps.status.outputs.files }}
          LOC: ${{ steps.status.outputs.loc }}
        run: |
          set -euo pipefail
          SUSPICIOUS=0
          REASONS=""
          if echo "$FILES" | grep -E '^\.github/' >/dev/null; then
            SUSPICIOUS=1
            REASONS="${REASONS}- touches .github/ (admin edits should not modify CI config)\n"
          fi
          if echo "$FILES" | grep -E '^layout/theme\.liquid$' >/dev/null; then
            SUSPICIOUS=1
            REASONS="${REASONS}- modifies layout/theme.liquid (rare from admin)\n"
          fi
          if [ "${LOC:-0}" -gt 1000 ]; then
            SUSPICIOUS=1
            REASONS="${REASONS}- exceeds 1000 LOC ($LOC lines changed)\n"
          fi
          if [ "$SUSPICIOUS" -eq 1 ]; then
            printf "Sync-reconcile diff looks unusual:\n%b\nFiles changed:\n\`\`\`\n%s\n\`\`\`\n\nReview manually before merging shopify-sync into main." "$REASONS" "$FILES" > /tmp/sanity-body.md
            gh issue create \
              --title "Suspicious sync-reconcile diff (LOC=${LOC})" \
              --label deploy-attention \
              --body-file /tmp/sanity-body.md
            echo "::error::Diff sanity check failed; auto-PR aborted. Issue filed."
            exit 1
          fi

      - name: Open or refresh reconcile PR
        if: steps.status.outputs.ahead != '0' && steps.status.outputs.loc != '0'
        env:
          AHEAD: ${{ steps.status.outputs.ahead }}
        run: |
          set -euo pipefail
          DATE=$(date -u +%Y-%m-%d)
          TITLE="chore: reconcile shopify-sync -> main (${AHEAD} commits, ${DATE})"
          # Auto-merge is no longer enabled here. After Validate succeeds on
          # this PR, shopify-sync-auto-deploy.yml deploys to live and squash-
          # merges via the deploy chain.
          printf 'Auto-generated reconcile of admin-side commits on `shopify-sync`.\n\nValidate runs automatically; on success, `shopify-sync-auto-deploy.yml` ships it to live and merges this PR.\n\nCommits:\n```\n%s\n```\n' "$(cat /tmp/commits.txt)" > /tmp/pr-body.md
          EXISTING=$(gh pr list --head shopify-sync --base main --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh pr edit "$EXISTING" --title "$TITLE" --body-file /tmp/pr-body.md
          else
            gh pr create --base main --head shopify-sync --label auto-reconcile --title "$TITLE" --body-file /tmp/pr-body.md
          fi

      - name: Stale auto-reconcile PR alarm
        if: always()
        run: |
          set -euo pipefail
          STALE=$(gh pr list --label auto-reconcile --state open --json number,createdAt \
            --jq '[.[] | select((now - (.createdAt | fromdateiso8601)) > 259200)] | .[].number')
          if [ -n "$STALE" ]; then
            for n in $STALE; do
              printf "PR #%s has been open more than 3 days. Validate may be failing or shopify-sync-auto-deploy stalled. Investigate the validate run, the auto-deploy run, or any merge conflict." "$n" > /tmp/stale-body.md
              gh issue create \
                --title "Stale auto-reconcile PR #$n" \
                --label deploy-attention \
                --body-file /tmp/stale-body.md || true
            done
            echo "::error::Stale auto-reconcile PRs detected"
            exit 1
          fi
