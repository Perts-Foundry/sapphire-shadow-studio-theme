name: drift-watch

on:
  schedule:
    - cron: '0 14 * * 1'  # Mondays 14:00 UTC
  workflow_dispatch:

permissions: {}

env:
  SHOPIFY_CLI_TTY: "0"
  CI: "1"
  SHOPIFY_FLAG_NO_COLOR: "true"

jobs:
  drift-watch:
    name: drift-watch
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: shopify-deploy
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"
          cache: npm

      - name: Install Shopify CLI
        run: npm ci --ignore-scripts

      - name: Pull live theme
        env:
          SHOPIFY_CLI_THEME_TOKEN: ${{ secrets.SHOPIFY_CLI_THEME_TOKEN }}
          SHOPIFY_FLAG_STORE: ${{ secrets.SHOPIFY_FLAG_STORE }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/live
          npx shopify theme pull --live --nodelete --path /tmp/live

      - name: Diff vs main
        id: diff
        run: |
          set -euo pipefail
          # Only compare theme directories; ignore repo-only files (CI config, docs, lockfiles).
          diff -ruN \
            --exclude='.git' --exclude='.github' --exclude='node_modules' \
            --exclude='.gitignore' --exclude='package*.json' --exclude='*.md' \
            --exclude='.theme-check.yml' \
            . /tmp/live > /tmp/drift.diff || true
          if [ -s /tmp/drift.diff ]; then
            echo "drift=true" >> "$GITHUB_OUTPUT"
            head -200 /tmp/drift.diff > /tmp/drift-head.txt
          else
            echo "drift=false" >> "$GITHUB_OUTPUT"
          fi

      - name: File issue on drift
        if: steps.diff.outputs.drift == 'true'
        run: |
          set -euo pipefail
          printf 'Live theme differs from `main` as of %s.\n\nFirst 200 lines of diff:\n```diff\n%s\n```\n\nLikely cause: someone edited the live theme directly via admin Customize / Code editor. All edits should go through the **EDIT HERE - Admin Sync** theme so they are captured on `shopify-sync` and reconciled into `main`.' \
            "$(date -u)" "$(cat /tmp/drift-head.txt)" > /tmp/drift-body.md
          gh issue create \
            --title "Live theme drifts from main ($(date -u +%Y-%m-%d))" \
            --label deploy-attention \
            --body-file /tmp/drift-body.md

      - name: Sweep stale rollback snapshots and orphaned previews
        env:
          SHOPIFY_CLI_THEME_TOKEN: ${{ secrets.SHOPIFY_CLI_THEME_TOKEN }}
          SHOPIFY_FLAG_STORE: ${{ secrets.SHOPIFY_FLAG_STORE }}
        run: |
          set -euo pipefail
          npx shopify theme list --json > themes.json
          # Delete rollback snapshots older than 14 days (name pattern: rollback-YYYYMMDDTHHMMSSZ)
          CUTOFF=$(date -u -d '14 days ago' +%Y%m%dT%H%M%SZ)
          jq -r --arg cutoff "$CUTOFF" \
            '.[] | select(.name | startswith("rollback-")) | select((.name | sub("^rollback-"; "")) < $cutoff) | .id' \
            themes.json | while read -r id; do
              [ -z "$id" ] && continue
              echo "Deleting stale rollback snapshot ${id}"
              npx shopify theme delete --theme "$id" --force || true
            done
          # Sweep orphan pr-N-preview themes whose PR is closed/merged
          jq -r '.[] | select(.name | test("^pr-[0-9]+-preview$")) | "\(.id):\(.name)"' themes.json \
            | while IFS=: read -r id name; do
              num="${name#pr-}"
              num="${num%-preview}"
              STATE=$(gh pr view "$num" --json state --jq '.state' 2>/dev/null || echo "UNKNOWN")
              if [ "$STATE" = "CLOSED" ] || [ "$STATE" = "MERGED" ]; then
                echo "Deleting orphan preview theme ${id} (PR #${num} is ${STATE})"
                npx shopify theme delete --theme "$id" --force || true
              fi
            done
