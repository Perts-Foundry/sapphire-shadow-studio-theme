# Combined PR-time checks. Four parallel jobs share this file because they
# all gate PR merge, hold no Shopify-CLI token, and run on overlapping
# trigger surfaces:
#
#   theme-check        - Shopify theme linter. PR + push to main/shopify-sync
#                        (push-on-shopify-sync gives admin-edit lint failures
#                        ~30s feedback; push-on-main is a tripwire for any
#                        admin-bypass commits).
#   pr-reconcile-check - Enforces the shopify-sync-merged invariant. PR only.
#   lint-workflows     - actionlint + zizmor. PR only, gated to changes
#                        touching .github/workflows/** or .github/dependabot.yml.
#   secret-scan        - Gitleaks against the full git history. PR only.
#                        Catches token-shaped strings (shpat_, ghp_, AKIA, JWT,
#                        etc.). Personal emails / addresses / merchant-keyed
#                        prose are NOT covered; see CLAUDE.md "Sensitive
#                        Content" pre-push checklist for those.
#
# Token-bearing workflows (deploy.yml, preview.yml, drift-watch.yml) live in
# separate files to keep their security boundary distinct.
name: pr-checks

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main, shopify-sync]

permissions: {}

jobs:
  theme-check:
    name: theme-check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: theme-check-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Run Theme Check
        uses: Shopify/theme-check-action@58fd69afdfc30110f997ba9e212b302671e00d3b # v2.2.0
        with:
          theme_root: '.'
          base: main
          token: ${{ github.token }}
          flags: --fail-level error

  pr-reconcile-check:
    name: pr-reconcile-check
    # Load-bearing guard: the steps below reference github.event.pull_request.*
    # throughout. Removing this `if:` would expose the checkout/git-cherry
    # logic to push contexts where event.pull_request is null.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      # Fallback to run_id keeps push-event runs (which are skipped via `if`)
      # from sharing a single empty-suffix group.
      group: pr-reconcile-pr-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
    steps:
      # Untrusted PR-head checkout is safe here because: (1) this job has no
      # Shopify token; (2) the only data flowing into the sticky comment is
      # `shopify-sync` commit metadata (trusted), not anything from the PR head;
      # (3) github-script reads variables via process.env, not ${{ }} interpolation.
      - name: Checkout PR head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Compute missing shopify-sync commits
        id: compute
        run: |
          set -euo pipefail
          git fetch --prune --no-tags origin shopify-sync main
          BASE=$(git merge-base HEAD origin/shopify-sync)
          # git cherry uses patch-id, so squash/rebase merges of shopify-sync into main are
          # correctly recognised as "applied" and don't show as unmerged.
          MISSING=$(git cherry HEAD origin/shopify-sync "$BASE" | grep -c '^+' || true)
          echo "missing=$MISSING" >> "$GITHUB_OUTPUT"
          if [ "$MISSING" -gt 0 ]; then
            {
              echo "commits<<EOF"
              git log --oneline HEAD..origin/shopify-sync
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Upsert sticky comment
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          MISSING: ${{ steps.compute.outputs.missing }}
          COMMITS: ${{ steps.compute.outputs.commits }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        with:
          script: |
            const marker = '<!-- sapphire-reconcile-bot -->';
            const missing = parseInt(process.env.MISSING || '0', 10);
            const commits = process.env.COMMITS || '';
            const prNumber = parseInt(process.env.PR_NUMBER, 10);
            const body = missing > 0
              ? `${marker}\n\n**Reconcile check: ${missing} commit(s) on \`shopify-sync\` are not in this branch.**\n\nUnmerged commits:\n\`\`\`\n${commits}\n\`\`\`\n\nResolve locally:\n\`\`\`bash\ngit fetch origin\ngit merge origin/shopify-sync\ngit push\n\`\`\``
              : `${marker}\n\nReconcile check: clean. No unmerged \`shopify-sync\` commits.`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              per_page: 100,
            });
            const existing = comments
              .filter(c => c.body && c.body.includes(marker))
              .sort((a, b) => a.id - b.id);
            const [keep, ...dupes] = existing;
            if (keep) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: keep.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }
            for (const dup of dupes) {
              await github.rest.issues.deleteComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: dup.id,
              });
            }

      - name: Fail if missing
        if: steps.compute.outputs.missing != '0'
        env:
          # Pass via env (not ${{ }} interpolation in the run script) per
          # GitHub Actions hardening guidance.
          MISSING: ${{ steps.compute.outputs.missing }}
        run: |
          set -euo pipefail
          echo "::error::shopify-sync has ${MISSING} commit(s) not in this branch. See PR comment."
          exit 1

  lint-workflows:
    name: lint-workflows
    # Load-bearing guard: relies on github.event.pull_request for the changed-paths
    # detection step.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: lint-workflows-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: read  # for `gh pr diff`
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Detect workflow / dependabot changes
        id: changed
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if gh pr diff "${PR_NUMBER}" --name-only \
              | grep -qE '^\.github/workflows/|^\.github/dependabot\.yml$'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No workflow / dependabot changes; skipping actionlint and zizmor."
          fi

      - name: actionlint
        if: steps.changed.outputs.run == 'true'
        run: |
          set -euo pipefail
          bash <(curl --max-time 60 -sSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color

      - name: zizmor
        if: steps.changed.outputs.run == 'true'
        run: |
          set -euo pipefail
          python3 -m pip install --user --quiet "zizmor==1.5.2"
          ~/.local/bin/zizmor --pedantic --format=plain .github/workflows

  secret-scan:
    name: secret-scan
    # Load-bearing guard: PR-only. Push events to main / shopify-sync are
    # already gated by branch protection and would not benefit from a second
    # full-history scan on every commit.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: secret-scan-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Full history is required for `gitleaks git --log-opts="--all"`.
          fetch-depth: 0
          persist-credentials: false

      - name: Install Gitleaks
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks

      - name: Run Gitleaks
        run: |
          set -euo pipefail
          gitleaks git --log-opts="--all" --no-banner
