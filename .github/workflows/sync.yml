# Opens or refreshes the auto-reconcile PR for admin commits on shopify-sync.
#
# Single direction only: shopify-sync -> main (reconcile PR).
# The reverse direction (main -> shopify-sync fast-forward) is handled
# synchronously by deploy.yml's "Sync main -> shopify-sync" post-merge step.
#
# Triggers:
#   - push: shopify-sync   - admin commits via the Shopify GitHub Integration
#                            (shopify[bot] HTTPS push, NOT GITHUB_TOKEN, so
#                            this trigger fires correctly).
#   - schedule (daily)     - cold-start safety net.
#   - workflow_dispatch    - operator manual trigger.
#
# Phantom-orphan handling: when shopify-sync has commits ahead of main but
# the diff is zero LOC (the post-auto-deploy state), this workflow does
# nothing; the next deploy will clean up via --force-with-lease.
#
# "Main has advanced" handling: when shopify-sync has commits ahead of main
# AND a non-zero diff AND main has advanced past shopify-sync's merge-base
# (typically because an unrelated PR landed on main between deploys), the
# "Open or refresh reconcile PR" step's merge-base guard fails red. A
# reconcile PR opened in that state would propose to revert the missing
# main commits. Recovery is a manual force-push of main onto shopify-sync;
# the guard's error message includes the snippet.
name: sync

on:
  push:
    branches: [shopify-sync]
  schedule:
    # 13:00 UTC daily safety net. The push: shopify-sync trigger is the
    # primary path; cron catches cases where the push event is missed
    # (rare, but possible during GitHub Actions outages).
    - cron: '0 13 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  reconcile:
    name: reconcile
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout shopify-sync
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: shopify-sync
          persist-credentials: false

      - name: Determine sync status
        id: status
        run: |
          set -euo pipefail
          # Default outputs upfront so downstream `if:` checks against
          # steps.status.outputs.loc are unambiguous even when AHEAD=0.
          echo "ahead=0" >> "$GITHUB_OUTPUT"
          echo "loc=0" >> "$GITHUB_OUTPUT"
          git fetch --prune --no-tags origin main
          AHEAD=$(git rev-list --count origin/main..HEAD)
          if [ "$AHEAD" -eq 0 ]; then
            echo "::notice::shopify-sync in sync with main."
            exit 0
          fi
          DIFF_LOC=$(git diff --numstat origin/main..HEAD \
            | awk '{ sum += $1 + $2 } END { print sum + 0 }')
          echo "ahead=$AHEAD" >> "$GITHUB_OUTPUT"
          echo "loc=$DIFF_LOC" >> "$GITHUB_OUTPUT"
          if [ "$DIFF_LOC" -eq 0 ]; then
            # Phantom orphan: shopify-sync has commits ahead but trees are
            # identical to main. The just-merged auto-reconcile PR squashed
            # the bot commits into main. deploy.yml's Sync step will clean
            # this up on the next deploy via --force-with-lease. Skip the
            # reconcile PR creation here to avoid an empty-diff PR.
            echo "::notice::shopify-sync ahead by $AHEAD but tree is identical to main (phantom orphan); next deploy will clean up."
          else
            git log --oneline origin/main..HEAD > /tmp/commits.txt
          fi

      - name: Open or refresh reconcile PR
        if: steps.status.outputs.ahead != '0' && steps.status.outputs.loc != '0'
        env:
          AHEAD: ${{ steps.status.outputs.ahead }}
          SYNC_RECONCILE_TOKEN: ${{ secrets.SYNC_RECONCILE_TOKEN }}
        run: |
          set -euo pipefail
          # Defence against the "main has advanced" latent bug: if shopify-sync's
          # history doesn't contain main's tip, opening a reconcile PR would
          # propose to revert the missing commits. Fail loud; the operator must
          # consciously recover by force-pushing main onto shopify-sync (snippet
          # in the error message). deploy.yml's auto-deploy gate has an
          # independent compareCommits assertion as defence in depth, so a
          # hand-opened PR that bypasses this guard still cannot ship.
          # Use origin/shopify-sync rather than HEAD so the assertion is
          # robust against any future workflow step that mutates the local
          # checkout (e.g. an inspection step that does git checkout main).
          MERGE_BASE=$(git merge-base origin/main origin/shopify-sync)
          MAIN_TIP=$(git rev-parse origin/main)
          if [ "$MERGE_BASE" != "$MAIN_TIP" ]; then
            echo "::error::shopify-sync is missing main commits (merge-base $MERGE_BASE != main tip $MAIN_TIP). A reconcile PR opened in this state would propose to revert the missing commits. Recover with: MAIN_SHA=\$(git rev-parse origin/main); LEASE_SHA=\$(git rev-parse origin/shopify-sync); git push --force-with-lease=shopify-sync:\$LEASE_SHA origin \$MAIN_SHA:shopify-sync"
            exit 1
          fi
          DATE=$(date -u +%Y-%m-%d)
          TITLE="chore: reconcile shopify-sync -> main (${AHEAD} commits, ${DATE})"
          # The "Opened on behalf of sync.yml via fine-grained PAT" line is a
          # forensics aid: after the PAT switch, the PR's GitHub-UI attribution
          # changes from a bot icon to a human avatar, so the body explicitly
          # tags the workflow-driven origin.
          printf 'Auto-generated reconcile of admin-side commits on `shopify-sync`.\n\nOpened on behalf of `sync.yml` via fine-grained PAT (see CLAUDE.md "Token rotation call-site catalog"). Validate runs automatically; on success, `deploy.yml` ships it to live and merges this PR via the shopify-sync auto-deploy path.\n\nCommits:\n```\n%s\n```\n' \
            "$(cat /tmp/commits.txt)" > /tmp/pr-body.md
          EXISTING=$(gh pr list --head shopify-sync --base main --state open \
            --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            # Edit stays on GITHUB_TOKEN (job-level GH_TOKEN). Three reasons:
            #   1. pr edit fires pull_request:edited, which validate.yml does
            #      not subscribe to, so suppression is harmless here.
            #   2. Minimises PAT-attributed audit-log volume.
            #   3. Audit-trail hygiene: routine bot edits stay attributed to
            #      github-actions[bot]; any human-attributed action on the PR
            #      is then a genuine investigate-worthy signal.
            gh pr edit "$EXISTING" --title "$TITLE" --body-file /tmp/pr-body.md
          else
            # GITHUB_TOKEN-driven `gh pr create` cannot fire downstream workflow
            # events (https://docs.github.com/en/actions/security-for-github-actions/security-guides/automatic-token-authentication),
            # so validate.yml would never run on the new PR. Use the fine-grained
            # PAT (pull_requests:write + contents:read on this repo only) for
            # create. PAT call-site discipline: this is the ONLY place the PAT
            # is consumed; rotating or revoking the PAT only affects this line.
            if [ -z "${SYNC_RECONCILE_TOKEN:-}" ]; then
              echo "::error::SYNC_RECONCILE_TOKEN is unset; cannot fire validate.yml on the new PR. See CLAUDE.md 'Token rotation call-site catalog'."
              exit 1
            fi
            if ! GH_TOKEN="$SYNC_RECONCILE_TOKEN" gh pr create \
                 --base main --head shopify-sync \
                 --title "$TITLE" --body-file /tmp/pr-body.md 2> /tmp/gh-err.txt; then
              if grep -qE 'HTTP 40[134]|Bad credentials|Resource not accessible' /tmp/gh-err.txt; then
                echo "::error::SYNC_RECONCILE_TOKEN appears invalid (revoked/expired/scope-mismatch). See CLAUDE.md 'Token rotation call-site catalog'."
              fi
              cat /tmp/gh-err.txt
              exit 1
            fi
          fi

      - name: Stale reconcile PR notice
        # Always-run; never fails the workflow. The prior `exit 1` here made
        # every cron firing of `sync` red whenever a stale PR existed, training
        # operators to ignore the workflow. A workflow notice + per-PR sticky
        # is louder where it matters (the stale PR itself) without polluting
        # the Actions tab with red runs.
        #
        # Uses the `<!-- stale-reconcile -->` marker to upsert a single sticky
        # comment per stale PR rather than appending a fresh comment every
        # daily cron firing. Without the upsert a PR that stays open for a
        # week accumulates seven identical "stale" notices.
        if: always()
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # 259200 seconds = 3 days. There is at most one open shopify-sync
          # -> main PR at a time (sync.yml upserts), so this loop runs zero
          # or one times in practice.
          STALE=$(gh pr list --head shopify-sync --base main --state open \
            --json number,createdAt \
            --jq '[.[] | select((now - (.createdAt | fromdateiso8601)) > 259200)] | .[].number')
          if [ -n "$STALE" ]; then
            MARKER='<!-- stale-reconcile -->'
            for n in $STALE; do
              {
                printf '%s\n' "$MARKER"
                printf 'PR #%s has been open more than 3 days. Auto-deploy may be failing or rejected by a gate. Investigate the validate run, the deploy run, or any merge conflict.\n' "$n"
              } > /tmp/stale-body.md

              # Find the existing sticky (if any) via the issues comments API.
              # gh api paginates with --paginate; jq filters by marker.
              EXISTING_ID=$(gh api --paginate "/repos/${GH_REPO}/issues/${n}/comments" \
                --jq "[.[] | select(.body | contains(\"$MARKER\"))] | .[0].id // empty")
              if [ -n "$EXISTING_ID" ]; then
                gh api -X PATCH "/repos/${GH_REPO}/issues/comments/${EXISTING_ID}" \
                  -f body="$(cat /tmp/stale-body.md)" > /dev/null || true
              else
                gh pr comment "$n" --body-file /tmp/stale-body.md || true
              fi
            done
            echo "::warning::Stale reconcile PR open >3 days; sticky upserted on PR(s) $STALE"
          fi
