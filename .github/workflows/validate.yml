# WARNING: deploy.yml's workflow_run arm triggers on this exact workflow name
# (`workflow_run.workflows: ["validate"]`). Renaming will silently break both
# auto-deploy paths (shopify-sync and dependabot/**).
#
# Two jobs. `deploy-preview` pushes the pr-N-preview theme (moved here from
# preview.yml so validate can hard-depend on it); `validate` runs every
# PR-time check sequentially, including the dynamic a11y audit against that
# preview theme, captures stdout + exit code per step, and posts a single
# sticky CI Report comment (marker `<!-- ci-results -->`). Mirrors the shape
# of the CI report in the resume-curator repo. preview.yml retains only the
# PR-close cleanup (theme delete), which is a different event.
#
# Required-check name on `main`: `validate / validate` (one context, set in
# infrastructure repo via `ci_check_contexts = ["validate"]`). The
# `deploy-preview` job is deliberately NOT required: it is skipped for draft
# and Dependabot PRs, and a skipped required context blocks merge forever.
#
# Secret isolation is per JOB, matching deploy.yml's pattern: `deploy-preview`
# holds the Shopify CLI theme token; `validate` holds only STOREFRONT_PASSWORD
# (read access to a password-gated storefront, no write capability), scoped to
# the single auth step, never to the Chrome-running audit step.
#
# Fork PRs are excluded from every job. Excluding here also prevents fork
# history from polluting `gitleaks --log-opts="--all"`.
name: validate

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions: {}

# Strict shell for every `run:` step in this workflow. GitHub's default is
# `bash -e {0}`; the delta here is `-u` (unset variable is an error) and
# `-o pipefail` (a pipeline fails if any stage does), so a future step cannot
# read an unset secret as an empty string or pass a broken pipeline off as
# success. Steps that must survive a non-zero command still clear `-e` with
# their own `set +e`; that does NOT clear `-u` or `-o pipefail`, which is the
# point. Composite actions declare their own shell and are unaffected.
defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

concurrency:
  group: validate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deploy-preview:
    # Moved from preview.yml so `validate` can hard-depend on the preview theme
    # existing before its dynamic a11y audit runs. This workflow never receives
    # `closed` events, so the old `action != 'closed'` clause is gone; the
    # PR-close cleanup stays in preview.yml.
    #
    # Skip Dependabot PRs: Dependabot-triggered workflows run with a separate
    # secrets/variables scope (`Settings -> Secrets and variables ->
    # Dependabot`) that does NOT inherit the regular Actions secrets, so
    # `SHOPIFY_CLI_THEME_TOKEN` is empty here and `npx shopify theme list`
    # fails authentication. Preview themes are for human visual review of
    # code changes; dependency bumps (action SHAs, npm tooling) do not change
    # the rendered storefront, so a preview adds no signal. The auto-deploy
    # chain still works because `deploy.yml`'s `workflow_run` arm uses the
    # default-branch secrets scope (not Dependabot's).
    #
    # No job-level concurrency group: the workflow-level `validate-<pr>` group
    # (cancel-in-progress: true) already guarantees a new push cancels the
    # whole prior run, preview push and audit alike, so an audit can never be
    # reading a theme a newer run is redeploying. Cancelling mid-push can
    # leave the preview theme partially uploaded, but that state is
    # self-healing: the next run pushes the whole tree, and the run that
    # cancelled this one is by definition already queued.
    if: |
      github.event.pull_request.draft == false
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.user.login != 'dependabot[bot]'
    name: deploy-preview
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    outputs:
      theme_id: ${{ steps.push.outputs.theme-id }}
      editor_url: ${{ steps.push.outputs.editor-url }}
      preview_url: ${{ steps.push.outputs.preview-url }}
    steps:
      - name: Checkout PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Push or update preview theme
        id: push
        uses: ./.github/actions/shopify-theme-push
        with:
          mode: preview
          shopify-cli-theme-token: ${{ secrets.SHOPIFY_CLI_THEME_TOKEN }}
          shopify-flag-store: ${{ vars.SHOPIFY_FLAG_STORE }}
          pr-number: ${{ github.event.pull_request.number }}

      - name: Upsert preview comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          THEME_ID: ${{ steps.push.outputs.theme-id }}
          THEME_NAME: ${{ steps.push.outputs.theme-name }}
          EDITOR_URL: ${{ steps.push.outputs.editor-url }}
          PREVIEW_URL: ${{ steps.push.outputs.preview-url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const marker = '<!-- preview -->';
            const themeId = process.env.THEME_ID;
            const themeName = process.env.THEME_NAME;
            const editorUrl = process.env.EDITOR_URL;
            const previewUrl = process.env.PREVIEW_URL;
            const prNumber = parseInt(process.env.PR_NUMBER, 10);
            const sha = (process.env.SHA || '').slice(0, 7);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const body = [
              marker,
              '# Preview Deployment',
              '',
              '✅ **Preview theme deployed.** Open the URL below to inspect.',
              '',
              `**Commit:** \`${sha}\` | **Run:** [#${context.runNumber}](${runUrl})`,
              '',
              '---',
              '',
              '| | |',
              '|:--|:--|',
              `| **Theme** | \`${themeName}\` (id \`${themeId}\`) |`,
              `| **Preview URL** | [${previewUrl}](${previewUrl}) |`,
              `| **Edit in admin** | [Open editor](${editorUrl}) |`,
              '',
              '---',
              '',
              'Updated on every push to the PR; deleted when the PR closes.',
            ].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });
            const existing = comments
              .filter(c => c.body && c.body.includes(marker))
              .sort((a, b) => a.id - b.id);
            const [keep, ...dupes] = existing;
            if (keep) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: keep.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }
            for (const dup of dupes) {
              await github.rest.issues.deleteComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: dup.id,
              });
            }
            // Sweep the legacy marker from pre-restyle runs.
            const legacy = comments.filter(c => c.body && c.body.includes('<!-- sapphire-preview-bot -->'));
            for (const c of legacy) {
              try {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: c.id,
                });
              } catch (_) { /* swallowed */ }
            }

  validate:
    name: validate
    # `always()` is load-bearing: deploy-preview is SKIPPED for draft and
    # Dependabot PRs and can FAIL on a Shopify hiccup, and this job is the
    # required check, so it must run in every one of those states. The a11y
    # audit step below reads `needs.deploy-preview.result` and turns
    # "preview failed" into a red check and "preview skipped" into a benign
    # skip; a plain `needs` would instead skip the required context and block
    # the PR forever.
    needs: deploy-preview
    if: always() && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    # 15 was the pre-a11y budget; the dynamic audit adds an authenticated
    # pa11y-ci pass over every storefront path in scripts/a11y/paths.json.
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: write
    env:
      # Belt-and-braces: most CLIs honour NO_COLOR (https://no-color.org/)
      # and skip ANSI escape sequences entirely. Any tool that ignores it
      # is still defended by the per-step `sed -E ...` strip in capture.
      NO_COLOR: "1"
      # puppeteer (a pa11y-ci dependency) would otherwise try to download its
      # own Chromium. `npm ci --ignore-scripts` already blocks that; this makes
      # the intent explicit and covers any non-lifecycle download path. pa11y
      # is pointed at the runner's preinstalled Chrome instead.
      PUPPETEER_SKIP_DOWNLOAD: "1"
    steps:
      - name: Checkout PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history needed for `git cherry` (reconcile check) and for
          # `gitleaks --log-opts="--all"` (secret scan).
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Setup Shopify CLI
        uses: ./.github/actions/setup-shopify-cli

      # ── Theme Check ────────────────────────────────────────────
      - name: Theme Check
        id: theme-check
        run: |
          set +e
          OUTPUT=$(npx shopify theme check --fail-level error 2>&1)
          EXIT_CODE=$?
          echo "$OUTPUT"
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          {
            echo "output<<GHEOF"
            echo "$OUTPUT" | sed -E $'s/\x1b\\[[0-9;]*m//g' | tail -30
            echo "GHEOF"
          } >> "$GITHUB_OUTPUT"

      # ── Reconcile (shopify-sync merged invariant) ──────────────
      - name: Reconcile
        id: reconcile
        run: |
          set +e
          # Note: do NOT use `{ ...; exit N; } > file 2>&1` here. A brace
          # group's redirection does not spawn a subshell, so `exit` would
          # terminate the whole step before the GITHUB_OUTPUT lines run, and
          # the aggregator would see an empty exit_code (rendered as
          # skipped).
          git fetch --prune --no-tags origin shopify-sync main 2>&1 || true
          BASE=$(git merge-base HEAD origin/shopify-sync)
          MISSING=$(git cherry HEAD origin/shopify-sync "$BASE" | grep -c '^+' || true)
          if [ "$MISSING" -gt 0 ]; then
            {
              echo "shopify-sync has $MISSING commit(s) not in this branch:"
              echo ""
              git log --oneline HEAD..origin/shopify-sync
              echo ""
              echo "Resolve locally:"
              echo "  git fetch origin"
              echo "  git merge origin/shopify-sync"
              echo "  git push"
            } > /tmp/reconcile.out
            EXIT_CODE=1
          else
            echo "No unmerged shopify-sync commits." > /tmp/reconcile.out
            EXIT_CODE=0
          fi
          cat /tmp/reconcile.out
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          {
            echo "output<<GHEOF"
            tail -30 /tmp/reconcile.out | sed -E $'s/\x1b\\[[0-9;]*m//g'
            echo "GHEOF"
          } >> "$GITHUB_OUTPUT"

      # ── Size-chart tooling tests ───────────────────────────────
      # `scripts/size-chart/` is operator tooling, not shipped theme code, so it
      # reaches no storefront. It is gated here anyway because it owns the
      # on-page size-chart prose: its cohesion goldens compare generated output
      # against the shipped product templates, and that invariant is only worth
      # anything if something enforces it.
      - name: Size chart tests
        id: size-chart
        run: |
          set +e
          OUTPUT=$(npm run size-chart:test 2>&1)
          EXIT_CODE=$?
          echo "$OUTPUT"

          # `node --test <glob>` expands the glob itself and exits 0 when it matches
          # nothing, so a renamed directory or an edited npm script would leave this
          # gate reporting a green "0 tests" forever. That is the same silently-covering-
          # nothing failure this step exists to prevent, so assert the suite actually ran.
          # The reporter is TTY-dependent: CI logs `# tests 60`, a local TTY prints
          # `<info> tests 60`. Match the count, not the prefix.
          TESTS_RUN=$(printf '%s\n' "$OUTPUT" | grep -oE '\btests [0-9]+' | tail -1 | grep -oE '[0-9]+')
          if [ "${TESTS_RUN:-0}" -lt 1 ]; then
            echo "::error::size-chart suite reported ${TESTS_RUN:-0} tests. The glob in the size-chart:test script has probably stopped matching."
            EXIT_CODE=1
          fi

          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          {
            echo "output<<GHEOF"
            # tail -50, not the -30 the linter steps use: node --test emits ~20 lines of stack per
            # failure in its trailing "failing tests:" block, so -30 would push all but the last
            # failure out of the PR comment when several tests break at once.
            echo "$OUTPUT" | sed -E $'s/\x1b\\[[0-9;]*m//g' | tail -50
            echo "GHEOF"
          } >> "$GITHUB_OUTPUT"

      # ── product-images tooling tests ───────────────────────────
      # `scripts/lib/` and the top-level `scripts/*.test.mjs` suites cover the
      # product-photo pipeline: the shared naming/colour-vocab library that the
      # alt-colour guard and the uploader both read, and the processor/uploader
      # scripts themselves. The uploader hard-fails on colour-vocab drift, so
      # the pinned vocab is only trustworthy if something enforces it. Two npm
      # scripts run in this one step; each output is captured and zero-test
      # guarded separately so one dead glob cannot hide behind the other
      # suite's test count.
      - name: Product images tests
        id: product-images
        run: |
          set +e
          OUT_LIB=$(npm run lib:test 2>&1)
          RC_LIB=$?
          OUT_IMAGES=$(npm run images:test 2>&1)
          RC_IMAGES=$?
          EXIT_CODE=0
          if [ "$RC_LIB" -ne 0 ] || [ "$RC_IMAGES" -ne 0 ]; then
            EXIT_CODE=1
          fi

          # Same "green on zero tests" guard as the suites above, applied to each
          # suite's own output: `node --test <glob>` exits 0 when the glob matches
          # nothing, so assert each suite actually ran.
          LIB_TESTS=$(printf '%s\n' "$OUT_LIB" | grep -oE '\btests [0-9]+' | tail -1 | grep -oE '[0-9]+')
          if [ "${LIB_TESTS:-0}" -lt 1 ]; then
            echo "::error::lib suite reported ${LIB_TESTS:-0} tests. The glob in the lib:test script has probably stopped matching."
            EXIT_CODE=1
          fi
          IMAGES_TESTS=$(printf '%s\n' "$OUT_IMAGES" | grep -oE '\btests [0-9]+' | tail -1 | grep -oE '[0-9]+')
          if [ "${IMAGES_TESTS:-0}" -lt 1 ]; then
            echo "::error::images suite reported ${IMAGES_TESTS:-0} tests. The glob in the images:test script has probably stopped matching."
            EXIT_CODE=1
          fi

          printf '=== npm run lib:test (exit %s) ===\n%s\n\n=== npm run images:test (exit %s) ===\n%s\n' \
            "$RC_LIB" "$OUT_LIB" "$RC_IMAGES" "$OUT_IMAGES"
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          # Tail each suite SEPARATELY. Tailing the concatenation would spend the whole budget on
          # the second suite and drop every line of the first, so a lib failure would render a
          # red row above a details block showing nothing but a green images run.
          {
            echo "output<<GHEOF"
            {
              echo "=== npm run lib:test (exit ${RC_LIB}) ==="
              printf '%s\n' "$OUT_LIB" | tail -35
              echo ""
              echo "=== npm run images:test (exit ${RC_IMAGES}) ==="
              printf '%s\n' "$OUT_IMAGES" | tail -35
            } | sed -E $'s/\x1b\\[[0-9;]*m//g'
            echo "GHEOF"
          } >> "$GITHUB_OUTPUT"

      # ── blank-inventory tooling tests ──────────────────────────
      # `scripts/blank-inventory/` writes to LIVE inventory, so its decision logic
      # (which variant to write, when to refuse, how a partial run is recorded) is
      # gated here. The suite is unit-only and never touches the network or the
      # store; the live end-to-end checks are operator-invoked by hand and are
      # deliberately not wired into any npm script this job runs.
      - name: Blank inventory tests
        id: blank-inventory
        run: |
          set +e
          OUTPUT=$(npm run blank-inventory:test 2>&1)
          EXIT_CODE=$?
          echo "$OUTPUT"

          # Same "green on zero tests" guard as the size-chart step above: `node --test <glob>`
          # exits 0 when the glob matches nothing, so assert the suite actually ran.
          TESTS_RUN=$(printf '%s\n' "$OUTPUT" | grep -oE '\btests [0-9]+' | tail -1 | grep -oE '[0-9]+')
          if [ "${TESTS_RUN:-0}" -lt 1 ]; then
            echo "::error::blank-inventory suite reported ${TESTS_RUN:-0} tests. The glob in the blank-inventory:test script has probably stopped matching."
            EXIT_CODE=1
          fi

          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          {
            echo "output<<GHEOF"
            echo "$OUTPUT" | sed -E $'s/\x1b\\[[0-9;]*m//g' | tail -50
            echo "GHEOF"
          } >> "$GITHUB_OUTPUT"

      # ── sku tooling tests ──────────────────────────────────────
      # `scripts/sku/` writes variant SKUs on the LIVE store, so its decision
      # logic (what a SKU derives to, when a plan is refused, how a partial run
      # is recorded) is gated here. Unit-only: the suite never touches the
      # network or the store, and the live commands are operator-invoked by
      # hand. The credential boundary is the enforcement, not this step: this
      # job holds no Shopify token at all.
      - name: SKU tests
        id: sku
        run: |
          set +e
          OUTPUT=$(npm run sku:test 2>&1)
          EXIT_CODE=$?
          echo "$OUTPUT"

          # Same "green on zero tests" guard as the steps above, anchored
          # tighter: `node --test <glob>` exits 0 when the glob matches nothing,
          # and a loose grep for "tests N" can also match a TEST NAME, which
          # would let a suite that never ran report a count. Match on the
          # reporter's own summary line by field position instead, and treat a
          # missing summary line as zero. A nonzero npm exit already fails the
          # step on its own; this only adds the vacuous-pass case.
          TESTS_RUN=$(printf '%s\n' "$OUTPUT" \
            | sed -E $'s/\x1b\\[[0-9;]*m//g' \
            | awk '$2 == "tests" && $3 ~ /^[0-9]+$/ { n = $3 } END { print n + 0 }')
          if [ "${TESTS_RUN:-0}" -lt 1 ]; then
            echo "::error::sku suite reported ${TESTS_RUN:-0} tests. The glob in the sku:test script has probably stopped matching."
            EXIT_CODE=1
          fi

          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          {
            echo "output<<GHEOF"
            echo "$OUTPUT" | sed -E $'s/\x1b\\[[0-9;]*m//g' | tail -50
            echo "GHEOF"
          } >> "$GITHUB_OUTPUT"

      # ── sku code tables lint ───────────────────────────────────
      # A separate step from the suite above so a failure attributes cleanly:
      # a broken table is an operator edit to scripts/sku/tables.json, a broken
      # test is a code change. Offline, no credentials.
      - name: SKU tables lint
        id: sku-tables
        run: |
          set +e
          OUTPUT=$(npm run sku:tables 2>&1)
          EXIT_CODE=$?
          echo "$OUTPUT"

          # check-tables.mjs already refuses an empty tables.json, but assert the
          # count line here too: a lint whose output shape changed silently
          # would otherwise pass on having checked nothing, which is the exact
          # fail-open shape the tables exist to prevent.
          CODES=$(printf '%s\n' "$OUTPUT" | sed -nE 's/^sku tables OK: ([0-9]+) codes.*/\1/p' | tail -1)
          if [ "${CODES:-0}" -lt 1 ]; then
            echo "::error::sku tables lint reported ${CODES:-0} codes checked. A lint that checks nothing must not pass."
            EXIT_CODE=1
          fi

          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          {
            echo "output<<GHEOF"
            echo "$OUTPUT" | sed -E $'s/\x1b\\[[0-9;]*m//g' | tail -50
            echo "GHEOF"
          } >> "$GITHUB_OUTPUT"

      # ── catalogue manifest lint + tests ────────────────────────
      # `catalogue.json` at the repo root declares the shape of the offering:
      # the option axis names, the colour and size vocabulary with each value's
      # Admin spelling, which garment bodies exist and what each is made in, and
      # the complete product census. The blank-inventory reorder review computes
      # its whole cell space from it, and six other areas derive their copy of
      # that vocabulary from it, so a malformed or vacuous manifest is a broken
      # report rather than a broken file. Offline, no credentials.
      #
      # The lint also runs the COHESION checks, which compare the manifest
      # against every repo-side surface that restates any of it (the variant
      # picker's option-name settings, the a11y path list, the product
      # templates, the SKU tables, the applique registry, the size-chart
      # profiles, the photo-naming census, and two marker regions in docs/).
      # Two of them WARN rather than refuse: config/settings_data.json is
      # Admin-editable and reconciled onto main by sync.yml, so refusing there
      # would red a PR nobody in this repo authored. The warning text is in the
      # captured output, so it reaches the PR comment.
      #
      # The lint and its own suite share one step deliberately: the suite is
      # four cases over the lint CLI, and giving it a second wiring pass through
      # Collect results / Post PR comment / Check for failures buys nothing.
      - name: Catalogue manifest
        id: catalogue
        run: |
          set +e
          EXIT_CODE=0

          # Each command is captured with its OWN status. Chaining them inside a
          # single command substitution would report only the last one's, which
          # is how a green lint can hide a red suite.
          CATALOGUE_TESTS=$(npm run catalogue:test 2>&1); CATALOGUE_TESTS_RC=$?
          CATALOGUE_LINT=$(npm run catalogue:lint 2>&1);  CATALOGUE_LINT_RC=$?

          # Full output to the step log; the PR comment gets a tail of EACH
          # capture rather than a tail of the pair. Tailing the concatenation
          # lets the lint's short success banner occupy the whole window, so a
          # verbose test failure is truncated out of the comment and the red
          # check renders with "catalogue OK" as its only detail.
          STRIP=$'s/\x1b\\[[0-9;]*m//g'
          OUTPUT=$(printf '%s\n\n%s\n' \
            "$(printf '%s\n' "$CATALOGUE_TESTS" | sed -E "$STRIP" | tail -40)" \
            "$(printf '%s\n' "$CATALOGUE_LINT" | sed -E "$STRIP" | tail -60)")
          printf '%s\n\n%s\n' "$CATALOGUE_TESTS" "$CATALOGUE_LINT"

          [ "$CATALOGUE_TESTS_RC" -ne 0 ] && EXIT_CODE=1
          [ "$CATALOGUE_LINT_RC" -ne 0 ] && EXIT_CODE=1

          # `node --test <glob>` exits 0 when the glob matches nothing, so a
          # renamed directory would report a green suite that ran no tests.
          # Same guard the other suites in this workflow carry.
          TESTS_RUN=$(printf '%s\n' "$CATALOGUE_TESTS" \
            | sed -E "$STRIP" \
            | awk '$2 == "tests" && $3 ~ /^[0-9]+$/ { n = $3 } END { print n + 0 }')
          if [ "${TESTS_RUN:-0}" -lt 1 ]; then
            echo "::error::catalogue suite reported ${TESTS_RUN:-0} tests. The glob in the catalogue:test script has probably stopped matching."
            EXIT_CODE=1
          fi

          # check-catalogue.mjs already refuses a vacuous manifest, but assert
          # the count line here too: a lint whose output shape changed silently
          # would otherwise pass on having checked nothing, which is the exact
          # fail-open shape the manifest exists to prevent. Only meaningful on a
          # clean exit; a real failure already exits non-zero.
          # ANSI-stripped before matching, like the two checks above: an anchored
          # ^ match against a colourised line finds nothing and would misreport a
          # purely cosmetic change as "checked nothing". All SIX counts are
          # asserted, matching what the lint itself treats as vacuous. The
          # cohesion count is the number of checks that RAN, so a module that
          # failed to load reads 0 and reds the build rather than reading as
          # "all clear".
          #
          # The sed output is captured ONCE into $COUNTS and all six cuts read
          # that same variable; re-invoking the lint per extraction would run it
          # six times and let two runs disagree.
          #
          # scripts/catalogue/test/check-catalogue.test.mjs runs this exact sed
          # expression against the lint's own count line, so the wording and this
          # regex cannot drift apart with only a manual check between them.
          if [ "$CATALOGUE_LINT_RC" -eq 0 ]; then
            COUNTS=$(printf '%s\n' "$CATALOGUE_LINT" | sed -E "$STRIP" \
              | sed -nE 's/^catalogue OK: ([0-9]+) bodies, ([0-9]+) colour values, ([0-9]+) size values, ([0-9]+) products, ([0-9]+) option names, ([0-9]+) cohesion checks\.$/\1 \2 \3 \4 \5 \6/p' | tail -1)
            BODIES=$(echo "$COUNTS" | cut -d' ' -f1)
            COLOURS=$(echo "$COUNTS" | cut -d' ' -f2)
            SIZES=$(echo "$COUNTS" | cut -d' ' -f3)
            PRODUCTS=$(echo "$COUNTS" | cut -d' ' -f4)
            OPTION_NAMES=$(echo "$COUNTS" | cut -d' ' -f5)
            COHESION=$(echo "$COUNTS" | cut -d' ' -f6)
            if [ "${BODIES:-0}" -lt 1 ] || [ "${COLOURS:-0}" -lt 1 ] || [ "${SIZES:-0}" -lt 1 ] \
              || [ "${PRODUCTS:-0}" -lt 1 ] || [ "${OPTION_NAMES:-0}" -lt 1 ] || [ "${COHESION:-0}" -lt 1 ]; then
              echo "::error::catalogue lint reported ${BODIES:-0} body/bodies, ${COLOURS:-0} colour value(s), ${SIZES:-0} size value(s), ${PRODUCTS:-0} product(s), ${OPTION_NAMES:-0} option name(s) and ${COHESION:-0} cohesion check(s). It cannot be trusted to have checked the manifest."
              EXIT_CODE=1
            fi
          fi

          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"

          # Every cohesion check collapses into ONE row in the PR comment, so
          # without this a failure is only diagnosable by opening the raw job
          # log. check-catalogue.mjs prints a single fixed-shape line naming the
          # failing check ids; this lifts it into its own output field, which the
          # comment renders beside the status.
          #
          # `tr -d` strips anything outside the id alphabet before the value is
          # written, and `cut -c` bounds it. The ids themselves are authored in
          # this repo and finite, so this is belt and braces rather than the
          # primary guard, but it is what makes a single-line `key=value` write
          # safe without a heredoc at all: no newline can survive the tr.
          # The lint prints the line through its ERROR wrapper, so the anchor
          # tolerates that prefix; the pinning test in check-catalogue.test.mjs
          # runs this exact expression against the lint's real failure output.
          FAILING=$(printf '%s\n' "$CATALOGUE_LINT" | sed -E "$STRIP" \
            | sed -nE 's/^(ERROR: )?catalogue FAILING CHECKS \(([0-9]+)\): (.*)$/\2 checks: \3/p' | tail -1 \
            | tr -cd 'A-Za-z0-9,:()_. -' | cut -c1-300)
          echo "failing_checks=$FAILING" >> "$GITHUB_OUTPUT"

          # Random heredoc delimiter, not the fixed GHEOF used by most steps
          # above, for the same reason the contrast step uses one: this capture
          # includes error text quoting keys from catalogue.json AND from six
          # other PR-authored files, all of which is PR-controlled. With a fixed delimiter a key carrying a newline plus
          # a GHEOF line could close the block early and append its own
          # `exit_code=0`, overwriting the honest exit code so a refused lint
          # merged green. The lint now JSON-quotes every key it names, so this
          # is the second of two independent guards, not the only one.
          DELIM="EOF_${RANDOM}${RANDOM}${RANDOM}"
          {
            echo "output<<${DELIM}"
            echo "$OUTPUT"
            echo "${DELIM}"
          } >> "$GITHUB_OUTPUT"

      # ── seo-review tooling tests ───────────────────────────────
      # `scripts/seo-review/` is read-only audit tooling and never touches the
      # store, but its rule logic (which finding fires, how baselines diff, how
      # accepted risks are matched) is what makes an operator-run audit
      # trustworthy, so it is gated here. Unit-only; no network access.
      - name: SEO review tests
        id: seo-review
        run: |
          set +e
          OUTPUT=$(npm run seo-review:test 2>&1)
          EXIT_CODE=$?
          echo "$OUTPUT"

          # Same "green on zero tests" guard as the suites above: `node --test <glob>`
          # exits 0 when the glob matches nothing, so assert the suite actually ran.
          TESTS_RUN=$(printf '%s\n' "$OUTPUT" | grep -oE '\btests [0-9]+' | tail -1 | grep -oE '[0-9]+')
          if [ "${TESTS_RUN:-0}" -lt 1 ]; then
            echo "::error::seo-review suite reported ${TESTS_RUN:-0} tests. The glob in the seo-review:test script has probably stopped matching."
            EXIT_CODE=1
          fi

          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          {
            echo "output<<GHEOF"
            echo "$OUTPUT" | sed -E $'s/\x1b\\[[0-9;]*m//g' | tail -50
            echo "GHEOF"
          } >> "$GITHUB_OUTPUT"

      # ── applique-grid tooling tests ────────────────────────────
      # `scripts/applique-grid/` publishes the Huddle chart gallery and owns the
      # product-page dropdown text. Its cohesion test pins the shipped template's
      # pattern_options byte-equal to the committed registry (patterns.json), the
      # same shipped-template invariant the size-chart step gates, and it is only
      # worth anything if something enforces it. Unit-only; no network access.
      - name: Applique grid tests
        id: applique-grid
        run: |
          set +e
          OUTPUT=$(npm run applique-grid:test 2>&1)
          EXIT_CODE=$?
          echo "$OUTPUT"

          # Same "green on zero tests" guard as the suites above: `node --test <glob>`
          # exits 0 when the glob matches nothing, so assert the suite actually ran.
          TESTS_RUN=$(printf '%s\n' "$OUTPUT" | grep -oE '\btests [0-9]+' | tail -1 | grep -oE '[0-9]+')
          if [ "${TESTS_RUN:-0}" -lt 1 ]; then
            echo "::error::applique-grid suite reported ${TESTS_RUN:-0} tests. The glob in the applique-grid:test script has probably stopped matching."
            EXIT_CODE=1
          fi

          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          {
            echo "output<<GHEOF"
            echo "$OUTPUT" | sed -E $'s/\x1b\\[[0-9;]*m//g' | tail -50
            echo "GHEOF"
          } >> "$GITHUB_OUTPUT"

      # ── email-icons tooling tests ──────────────────────────────
      # `scripts/email-icons/` renders the social icons the Shopify Email
      # templates point at. Two invariants are worth CI: the icon path data is a
      # hand copy of three branches of snippets/icon.liquid, and the PNGs under
      # marketing/emails/assets/ are the record of what was uploaded to Shopify
      # Files. Both drift silently otherwise, in a surface nothing else covers
      # (theme-check ignores marketing/**). Unit-only: the upload script's live
      # half is operator-invoked and this job holds no Shopify credential.
      - name: Email icon tests
        id: email-icons
        run: |
          set +e
          OUTPUT=$(npm run email-icons:test 2>&1)
          EXIT_CODE=$?
          echo "$OUTPUT"

          # Same "green on zero tests" guard as the suites above: `node --test <glob>`
          # exits 0 when the glob matches nothing, so assert the suite actually ran.
          TESTS_RUN=$(printf '%s\n' "$OUTPUT" | grep -oE '\btests [0-9]+' | tail -1 | grep -oE '[0-9]+')
          if [ "${TESTS_RUN:-0}" -lt 1 ]; then
            echo "::error::email-icons suite reported ${TESTS_RUN:-0} tests. The glob in the email-icons:test script has probably stopped matching."
            EXIT_CODE=1
          fi

          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          {
            echo "output<<GHEOF"
            echo "$OUTPUT" | sed -E $'s/\x1b\\[[0-9;]*m//g' | tail -50
            echo "GHEOF"
          } >> "$GITHUB_OUTPUT"

      # ── Blank-id leak guard ────────────────────────────────────
      # Blank ids embed the supplier name and style number, which are sensitive for
      # this public repo. Gitleaks matches token-shaped strings and does not catch
      # merchant-keyed prose, so this structural check runs alongside it on every PR.
      # It names no supplier itself: it flags blank-id-shaped tokens whose segments
      # fall outside the synthetic test vocabulary.
      - name: Blank id guard
        id: blank-id-guard
        run: |
          set +e
          OUTPUT=$(npm run blank-inventory:guard 2>&1)
          EXIT_CODE=$?
          echo "$OUTPUT"

          # Fail-closed floor. On a clean run the guard prints "scanned N file(s)" and exits 0. If
          # `git ls-files` ever returned nothing (wrong CWD, an odd checkout, a future refactor of
          # trackedFiles()), it would pass green having scanned nothing, the exact fail-open mode a
          # leak detector must not have. Assert it actually looked at files, in the same spirit as the
          # TESTS_RUN guards on the suites above. Only checked on a clean exit: a real finding already
          # exits non-zero and prints no "scanned" line.
          if [ "$EXIT_CODE" -eq 0 ]; then
            FILES_SCANNED=$(printf '%s\n' "$OUTPUT" | grep -oE 'scanned [0-9]+' | tail -1 | grep -oE '[0-9]+')
            if [ "${FILES_SCANNED:-0}" -lt 1 ]; then
              echo "::error::blank-id guard scanned ${FILES_SCANNED:-0} files. It has probably run from the wrong directory or git ls-files returned nothing, so it cannot be trusted to have covered the repo."
              EXIT_CODE=1
            fi
          fi

          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          {
            echo "output<<GHEOF"
            echo "$OUTPUT" | sed -E $'s/\x1b\\[[0-9;]*m//g' | tail -30
            echo "GHEOF"
          } >> "$GITHUB_OUTPUT"

      # ── Contrast lint + accessibility tooling tests ────────────
      # The theme had no accessibility check of any kind in CI, so a colour
      # scheme with failing contrast shipped silently (the sss-dark-scheme
      # accent sat at 3.86:1 until a hand-run Lighthouse audit caught it).
      #
      # `contrast:lint` is the STATIC layer: it reads config/settings_data.json
      # directly and needs no network, no storefront password, and no preview
      # theme. The DYNAMIC layer (pa11y-ci against the deployed preview theme)
      # is the "A11y audit" steps further down, which depend on the
      # deploy-preview job having pushed a rendered theme first.
      #
      # `a11y:test` is folded into this step deliberately. It is the unit suite
      # for scripts/a11y/ (the pa11y config builder, the preview-auth flow, the
      # result summariser), and giving it a fifth wiring pass through Collect
      # results / Post PR comment / Check for failures buys nothing. The step is
      # named for both so a pa11y-config test failure is not misread as a
      # contrast-lint failure.
      - name: Contrast + a11y tests
        id: contrast
        run: |
          set +e
          EXIT_CODE=0

          # Each command is captured with its OWN status. Chaining them inside a
          # single command substitution would report only the last one's, which
          # is how a green lint can hide two red suites.
          CONTRAST_TESTS=$(npm run contrast:test 2>&1); CONTRAST_TESTS_RC=$?
          A11Y_TESTS=$(npm run a11y:test 2>&1);         A11Y_TESTS_RC=$?
          CONTRAST_LINT=$(npm run contrast:lint 2>&1);  CONTRAST_LINT_RC=$?

          OUTPUT=$(printf '%s\n\n%s\n\n%s\n' "$CONTRAST_TESTS" "$A11Y_TESTS" "$CONTRAST_LINT")
          echo "$OUTPUT"

          [ "$CONTRAST_TESTS_RC" -ne 0 ] && EXIT_CODE=1
          [ "$A11Y_TESTS_RC" -ne 0 ] && EXIT_CODE=1
          [ "$CONTRAST_LINT_RC" -ne 0 ] && EXIT_CODE=1

          # `node --test <glob>` exits 0 when the glob matches nothing, so a
          # renamed directory would report a green suite that ran no tests.
          # Same guard the other suites in this workflow carry.
          CONTRAST_COUNT=$(printf '%s\n' "$CONTRAST_TESTS" | grep -oE '\btests [0-9]+' | tail -1 | grep -oE '[0-9]+')
          if [ "${CONTRAST_COUNT:-0}" -lt 1 ]; then
            echo "::error::contrast suite reported ${CONTRAST_COUNT:-0} tests. The glob in contrast:test has probably stopped matching."
            EXIT_CODE=1
          fi
          A11Y_COUNT=$(printf '%s\n' "$A11Y_TESTS" | grep -oE '\btests [0-9]+' | tail -1 | grep -oE '[0-9]+')
          if [ "${A11Y_COUNT:-0}" -lt 1 ]; then
            echo "::error::a11y suite reported ${A11Y_COUNT:-0} tests. The glob in a11y:test has probably stopped matching."
            EXIT_CODE=1
          fi

          # Fail-closed floor for the lint itself. On a clean run it prints
          # "scanned N scheme(s), M pair(s)". A lint that checked nothing would
          # otherwise report green, the one outcome a merge gate must never have.
          # Only meaningful on a clean exit; a real failure already exits non-zero.
          if [ "$CONTRAST_LINT_RC" -eq 0 ]; then
            SCHEMES=$(printf '%s\n' "$CONTRAST_LINT" | grep -oE 'scanned [0-9]+ scheme' | tail -1 | grep -oE '[0-9]+')
            PAIRS=$(printf '%s\n' "$CONTRAST_LINT" | grep -oE '[0-9]+ pair\(s\)' | tail -1 | grep -oE '[0-9]+')
            if [ "${SCHEMES:-0}" -lt 1 ] || [ "${PAIRS:-0}" -lt 1 ]; then
              echo "::error::contrast lint reported ${SCHEMES:-0} scheme(s) and ${PAIRS:-0} pair(s). It cannot be trusted to have checked the theme."
              EXIT_CODE=1
            fi
          fi

          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          # Random heredoc delimiter, not the fixed GHEOF used by the steps
          # above. This capture includes accepted-risks.json notes and colour
          # scheme names, both PR-controlled text, so a PR could otherwise embed
          # the literal delimiter and inject arbitrary step outputs.
          DELIM="EOF_${RANDOM}${RANDOM}${RANDOM}"
          {
            echo "output<<${DELIM}"
            echo "$OUTPUT" | sed -E $'s/\x1b\\[[0-9;]*m//g' | tail -50
            echo "${DELIM}"
          } >> "$GITHUB_OUTPUT"

      # ── Deploy smoke-test unit tests ───────────────────────────
      # smoke.mjs is the post-deploy storefront probe run by deploy.yml. It has
      # no storefront reach until a deploy, and its whole job is to fail a bad
      # deploy, so its classifier decision table is gated here. The TESTS_RUN
      # guard below is belt-and-braces: smoke:test names a literal file (a
      # missing file exits non-zero on its own), but the guard also catches a
      # future switch to a glob, or a file emptied of its tests, reporting green.
      - name: Smoke script tests
        id: smoke-test
        run: |
          set +e
          OUTPUT=$(npm run smoke:test 2>&1)
          EXIT_CODE=$?
          echo "$OUTPUT"

          TESTS_RUN=$(printf '%s\n' "$OUTPUT" | grep -oE '\btests [0-9]+' | tail -1 | grep -oE '[0-9]+')
          if [ "${TESTS_RUN:-0}" -lt 1 ]; then
            echo "::error::smoke suite reported ${TESTS_RUN:-0} tests. The path in the smoke:test script has probably stopped matching."
            EXIT_CODE=1
          fi

          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          {
            echo "output<<GHEOF"
            echo "$OUTPUT" | sed -E $'s/\x1b\\[[0-9;]*m//g' | tail -50
            echo "GHEOF"
          } >> "$GITHUB_OUTPUT"

      # ── actionlint + shellcheck (workflows + composite actions) ─
      #
      # Two tools, one row, because they cover two halves of the same surface
      # and a split row would let half of it go quietly unwatched.
      #
      #   actionlint  walks `.github/workflows/` and lints workflow syntax,
      #               expressions and the shell inside every workflow `run:`
      #               (it shells out to shellcheck for that last part).
      #   shellcheck  covers what actionlint structurally cannot: the shell
      #               inside `.github/actions/**/action.yml`. actionlint has no
      #               composite-action mode; handed one it parses the file as a
      #               workflow and reports `"jobs" section is missing` instead
      #               of linting anything. So the bodies are extracted to files
      #               first (scripts/lib/composite-shell.mjs), padded so line
      #               numbers still point at the source action.yml, and linted
      #               directly. The same pass covers `lib/*.sh` helpers sourced
      #               by those actions, which are already real shell files.
      #
      # Before this, the largest shell script in the repo was unlinted while
      # this step's comment claimed to cover it.
      - name: actionlint + shellcheck
        id: actionlint
        env:
          # Workflow shell only (actionlint's own shellcheck pass). The
          # composite-action pass gets its own variable below; a suppression
          # that extraction forces must not silently weaken linting of
          # `.github/workflows/`, which is a different surface with none of the
          # same excuses.
          #
          # SC2016 = "Expressions don't expand in single quotes" - false-
          # positive on `printf 'literal-markdown-with-backticks %s\n' "$x"`
          # in sync.yml.
          # SC2317 = "Command appears to be unreachable" - false-positive on
          # the `set +e; OUTPUT=$(...); EXIT_CODE=$?; echo $OUTPUT` capture
          # pattern used by every check step in this workflow. shellcheck
          # cannot follow the control flow when subshells set the exit code.
          SHELLCHECK_OPTS: "-e SC2016 -e SC2317"
          # Pinned rather than taken from the runner image: a runner-image bump
          # must not be able to flip this row (which gates auto-deploy) with
          # zero repo changes, and pinning is what makes a local run comparable
          # to CI. README's Development section names the same version.
          SHELLCHECK_VERSION: "0.10.0"
        run: |
          set +e

          echo "::group::actionlint"
          bash <(curl --max-time 60 -sSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7 >/dev/null
          ACTIONLINT_OUT=$(./actionlint -no-color 2>&1)
          ACTIONLINT_EXIT=$?
          echo "$ACTIONLINT_OUT"
          echo "::endgroup::"

          echo "::group::shellcheck (composite actions)"
          # Everything this pass creates goes to RUNNER_TEMP, not the workspace. The workspace is a
          # Shopify theme checkout, so a tarball and two directories dropped beside `assets/` and
          # `templates/` are one future "assert the tree is clean" step away from being a problem.
          # It also matches the local recipe in README's Development section.
          SC_DIR="${RUNNER_TEMP}/shellcheck"
          BODIES_DIR="${RUNNER_TEMP}/composite-shell-bodies"
          rm -rf "$SC_DIR" "$BODIES_DIR"
          mkdir -p "$SC_DIR"
          curl --max-time 60 -fsSL \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            -o "${SC_DIR}/shellcheck.tar.xz"
          tar -xJf "${SC_DIR}/shellcheck.tar.xz" -C "$SC_DIR" "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          SHELLCHECK="${SC_DIR}/shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          "$SHELLCHECK" --version | grep '^version:'

          # The extractor fails closed three ways (an unsupported `run:` form,
          # zero bodies extracted, and a GitHub expression surviving into a
          # body), so a scan that has stopped matching reds this row instead of
          # leaving shellcheck to lint an empty directory. Its
          # `extracted N run bodies` line is the visible difference between
          # "green" and "green having linted nothing".
          EXTRACT_OUT=$(node scripts/lib/composite-shell.mjs "$BODIES_DIR" .github/actions/*/action.yml 2>&1)
          EXTRACT_EXIT=$?
          echo "$EXTRACT_OUT"

          SHELLCHECK_OUT=""
          SHELLCHECK_EXIT=0
          LINTED=0
          if [ "$EXTRACT_EXIT" -ne 0 ]; then
            SHELLCHECK_OUT="composite-shell extraction failed; nothing was linted."
            SHELLCHECK_EXIT="$EXTRACT_EXIT"
          else
            # Own options list, deliberately NOT the SHELLCHECK_OPTS above -- and
            # `SHELLCHECK_OPTS=` on the command line is what makes that true.
            # The linter reads that variable FROM THE ENVIRONMENT, not only via
            # actionlint, so the step-level `env:` would otherwise silently apply
            # the workflow suppressions here too. That matters most for SC2317:
            # lib/retry.sh is built on indirect dispatch, exactly the shape that
            # both provokes unreachable-code false positives and could hide real
            # dead code. `--norc` blocks a future repo-root .shellcheckrc from
            # widening this pass unannounced, for the same reason.
            #
            # SC1091 = "Not following: file was not specified as input" - the
            # `source "${GITHUB_ACTION_PATH}/lib/retry.sh"` in the Push and List
            # steps resolves at runtime from a variable the runner sets, which
            # the linter cannot follow from an extracted body. retry.sh is
            # linted in the same pass below, so nothing goes unchecked.
            COMPOSITE_OPTS=(-e SC1091)
            # `nullglob` so the `lib/*.sh` glob contributes nothing when no
            # composite action has helper scripts, rather than passing an
            # unexpanded pattern through as a filename. The extracted bodies
            # are guaranteed non-empty by the extractor's own zero-body guard,
            # so the target list can never end up empty.
            shopt -s nullglob
            SHELLCHECK_TARGETS=("$BODIES_DIR"/*.sh .github/actions/*/lib/*.sh)
            shopt -u nullglob
            LINTED=${#SHELLCHECK_TARGETS[@]}
            SHELLCHECK_OUT=$(SHELLCHECK_OPTS='' "$SHELLCHECK" --norc --shell=bash --color=never \
              "${COMPOSITE_OPTS[@]}" "${SHELLCHECK_TARGETS[@]}" 2>&1)
            SHELLCHECK_EXIT=$?
          fi
          echo "$SHELLCHECK_OUT"
          echo "::endgroup::"

          # Logical OR, not bitwise: either tool going non-zero reds the row,
          # and a bitwise combination can collapse two failures to zero.
          EXIT_CODE=0
          if [ "$ACTIONLINT_EXIT" -ne 0 ] || [ "$SHELLCHECK_EXIT" -ne 0 ]; then
            EXIT_CODE=1
          fi

          # Label both tools' text before it reaches the shared capture, so a
          # red row in the PR comment says which tool failed. The linted-file
          # count rides along for the same reason the extractor prints a body
          # count: it is the difference between "green" and "green having linted
          # nothing", and it is worth nothing if it only exists in the job log.
          OUTPUT=$(
            printf '[actionlint exit %s]\n%s\n[shellcheck exit %s, %s file(s) linted]\n%s\n%s\n' \
              "$ACTIONLINT_EXIT" "$ACTIONLINT_OUT" \
              "$SHELLCHECK_EXIT" "$LINTED" "$EXTRACT_OUT" "$SHELLCHECK_OUT"
          )

          # Per-run delimiter, and any line forging it is neutralised on the way
          # into the block. Both tools echo lines from the files they lint, so
          # the body here is file-sourced text; the sibling `push_output` block
          # in the composite action is hardened the same way and for the same
          # reason. Hex-only, so it is inert as a sed pattern.
          DELIM="GHEOF_$(od -An -N 8 -t x1 /dev/urandom | tr -d ' \n')"
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          {
            echo "output<<${DELIM}"
            echo "$OUTPUT" \
              | sed -E $'s/\x1b\\[[0-9;]*m//g' \
              | sed "s/^${DELIM}\$/${DELIM}./" \
              | tail -30
            echo "${DELIM}"
          } >> "$GITHUB_OUTPUT"

      # ── zizmor (security audit of workflows + composite actions) ─
      - name: zizmor
        id: zizmor
        env:
          # Without a token zizmor silently drops its online audits
          # (impostor-commit, ref-confusion, known-vulnerable-actions) and
          # still reports a clean run, so a green "Security audit" row was
          # asserting more than the tool had checked. The default GITHUB_TOKEN
          # is enough: those audits only read public action repositories, and
          # this job holds `contents: read` with no write scope beyond
          # pull-requests (used by the comment step).
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          python3 -m pip install --user --quiet "zizmor==1.5.2"
          OUTPUT=$(~/.local/bin/zizmor --pedantic --format=plain .github/workflows .github/actions 2>&1)
          EXIT_CODE=$?
          echo "$OUTPUT"
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          {
            echo "output<<GHEOF"
            echo "$OUTPUT" | sed -E $'s/\x1b\\[[0-9;]*m//g' | tail -30
            echo "GHEOF"
          } >> "$GITHUB_OUTPUT"

      # ── Gitleaks (full git history) ────────────────────────────
      - name: Gitleaks
        id: gitleaks
        run: |
          set +e
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz \
            | tar -xz -C /tmp gitleaks
          OUTPUT=$(/tmp/gitleaks git --log-opts="--all" --no-banner 2>&1)
          EXIT_CODE=$?
          echo "$OUTPUT"
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          {
            echo "output<<GHEOF"
            echo "$OUTPUT" | sed -E $'s/\x1b\\[[0-9;]*m//g' | tail -30
            echo "GHEOF"
          } >> "$GITHUB_OUTPUT"

      # ── Dynamic a11y audit (pa11y-ci against the preview theme) ─
      # The dynamic half of the two-layer accessibility check; the static half
      # is the contrast lint above. This covers what colour maths cannot: real
      # DOM, real font sizes, real focus order, real overlay schemes composited
      # over real hero images. It exists in THIS job (rather than preview.yml,
      # where it started life) so its result lands in the same CI Report
      # comment and the same required `validate / validate` context as every
      # other check; `needs: deploy-preview` is what guarantees the theme it
      # audits exists and matches this head SHA.
      #
      # Three preview states, decided here and threaded through the report:
      #   success -> authenticate, build the config, audit.
      #   skipped -> draft or Dependabot PR; no preview exists BY DESIGN, so
      #              record a benign skip (exit 0), never a failure.
      #   failed/cancelled -> the preview deploy broke, so the audit cannot
      #              run; that is a red check, not a silent skip.
      - name: A11y audit config
        id: a11y-config
        env:
          # STOREFRONT_PASSWORD is scoped to THIS STEP, never to the job. The
          # pa11y step below launches `--no-sandbox` Chrome that executes
          # third-party page JavaScript (consent banner, chat widget, Shopify's
          # own scripts); the storefront password must not be present in that
          # process's environment. No Shopify token appears anywhere in this job.
          STOREFRONT_PASSWORD: ${{ secrets.STOREFRONT_PASSWORD }}
          # Step-env indirection, never inlined into `run:`. These are job
          # outputs, and interpolating them into a shell body would make them a
          # script-injection vector.
          PREVIEW_RESULT: ${{ needs.deploy-preview.result }}
          BASE_URL: https://${{ vars.SHOPIFY_FLAG_STORE }}
          THEME_ID: ${{ needs.deploy-preview.outputs.theme_id }}
          CONFIG_PATH: ${{ runner.temp }}/pa11yci.json
          CANONICAL_BASE_URL_FILE: ${{ runner.temp }}/canonical-base-url
        run: |
          set +e
          if [ "$PREVIEW_RESULT" = "skipped" ]; then
            echo "No preview theme for this PR (draft or Dependabot); the dynamic audit is skipped by design."
            {
              echo "preview_state=skipped"
              echo "exit_code=0"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$PREVIEW_RESULT" != "success" ]; then
            echo "::error::The preview deploy did not succeed (${PREVIEW_RESULT}), so the a11y audit cannot run."
            {
              echo "preview_state=failed"
              echo "exit_code=1"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "preview_state=success" >> "$GITHUB_OUTPUT"

          COOKIE=$(node scripts/a11y/get-auth-cookie.mjs)
          AUTH_RC=$?
          if [ "$AUTH_RC" -ne 0 ]; then
            echo "::error::Could not reach the preview theme; see the diagnostics above."
            echo "exit_code=$AUTH_RC" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Mask BEFORE anything else can emit it. The cookie is a live
          # authenticated session for the storefront.
          if [ -n "$COOKIE" ]; then
            echo "::add-mask::$COOKIE"
          fi

          # Build against the origin the store CANONICALISED to, not the one we
          # started from. `vars.SHOPIFY_FLAG_STORE` is the *.myshopify.com host,
          # and the store 302s that to its primary custom domain, so building
          # against BASE_URL would put a redirect hop on all audited URLs and
          # make every audited URL differ from the one reported.
          # get-auth-cookie.mjs writes the resolved origin to a temp file; fall
          # back to BASE_URL if it somehow did not.
          CANONICAL=$(cat "$CANONICAL_BASE_URL_FILE" 2>/dev/null)
          CANONICAL="${CANONICAL:-$BASE_URL}"
          echo "Auditing origin: $CANONICAL"

          # The config file embeds the cookie. It goes to RUNNER_TEMP and is
          # never uploaded as an artifact or printed.
          COOKIE="$COOKIE" BASE_URL="$CANONICAL" node scripts/a11y/build-pa11yci.mjs > "$CONFIG_PATH"
          BUILD_RC=$?
          if [ "$BUILD_RC" -ne 0 ]; then
            echo "::error::Failed to build the pa11y-ci config."
            echo "exit_code=$BUILD_RC" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          URL_COUNT=$(node -e 'const c=require(process.argv[1]);process.stdout.write(String((c.urls||[]).length))' "$CONFIG_PATH")
          COUNT_RC=$?
          # Fail closed on a crash here as well as on a zero count. Without the
          # status capture, an unreadable config would still write exit_code=0
          # and the step would report a pass on a run that audited nothing.
          # summarize-pa11y.mjs catches zero URLs later too; this is the earlier
          # of the two, and the only one that sees a crash.
          if [ "$COUNT_RC" -ne 0 ] || ! printf '%s' "$URL_COUNT" | grep -Eq '^[1-9][0-9]*$'; then
            echo "::error::The pa11y config has no URLs to audit (exit ${COUNT_RC}, count '${URL_COUNT}')."
            echo "exit_code=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Built pa11y config with ${URL_COUNT} URL(s)."
          {
            echo "config_path=$CONFIG_PATH"
            echo "url_count=$URL_COUNT"
            echo "exit_code=0"
          } >> "$GITHUB_OUTPUT"

      - name: A11y audit
        id: a11y
        # No secret env here by design; the config file carries the cookie.
        env:
          CONFIG_PATH: ${{ steps.a11y-config.outputs.config_path }}
          REPORT_PATH: ${{ runner.temp }}/pa11y-report.json
          CONFIG_RC: ${{ steps.a11y-config.outputs.exit_code }}
          PREVIEW_STATE: ${{ steps.a11y-config.outputs.preview_state }}
        run: |
          set +e
          # Every early path writes summary via a random heredoc delimiter:
          # even the fixed strings share a step with page-derived text below,
          # and a fixed delimiter would be forgeable from a PR-controlled page.
          write_summary() {
            DELIM="EOF_${RANDOM}${RANDOM}${RANDOM}"
            {
              echo "summary<<${DELIM}"
              printf '%s\n' "$1"
              echo "${DELIM}"
            } >> "$GITHUB_OUTPUT"
          }

          if [ "${PREVIEW_STATE:-}" = "skipped" ]; then
            echo "exit_code=0" >> "$GITHUB_OUTPUT"
            write_summary "_Skipped: no preview theme is deployed for this PR (draft or Dependabot), so the dynamic audit did not run. The static contrast lint above still gates the merge._"
            exit 0
          fi
          if [ "${PREVIEW_STATE:-}" = "failed" ]; then
            echo "exit_code=1" >> "$GITHUB_OUTPUT"
            write_summary "❌ The preview deploy did not succeed, so the audit could not run."
            exit 0
          fi
          if [ "${CONFIG_RC:-1}" != "0" ]; then
            echo "Skipped: the config step failed."
            echo "exit_code=1" >> "$GITHUB_OUTPUT"
            write_summary "Could not authenticate against the preview theme; pa11y-ci did not run."
            exit 0
          fi

          npx pa11y-ci --config "$CONFIG_PATH" --json > "$REPORT_PATH" 2>/tmp/pa11y.err
          PA11Y_RC=$?
          # stderr only. stdout is the JSON report, and pa11y can echo the
          # config (which holds the session cookie) into stderr on a config
          # error, so this is capped rather than dumped.
          head -c 2000 /tmp/pa11y.err || true

          SUMMARY=$(node scripts/a11y/summarize-pa11y.mjs "$REPORT_PATH" --exit-code "$PA11Y_RC")
          SUMMARY_RC=$?
          # ONE parse, feeding both the log line (stderr) and the comment body
          # (stdout). Parsing twice let a malformed summary log a verdict while
          # silently posting an empty body, because the body parse swallowed its
          # own failure and the step's exit code came from elsewhere entirely.
          BODY=$(echo "$SUMMARY" | node -e '
            let s = "";
            process.stdin.on("data", (d) => { s += d; }).on("end", () => {
              let o;
              try { o = JSON.parse(s); } catch {
                console.error("pa11y-ci: summary unavailable (unparseable)");
                process.exit(1);
              }
              console.error(`pa11y-ci: ${o.reason} (${o.total} URL(s), ${o.errors} error(s))`);
              process.stdout.write(o.body || "");
            });')
          BODY_RC=$?
          if [ "$BODY_RC" -ne 0 ]; then
            # An unusable summary is a failed audit, not a green one with an
            # empty comment: report it in both the code and the comment.
            echo "::error::The a11y summary could not be parsed."
            SUMMARY_RC=1
            BODY="The accessibility summary could not be parsed; see the run log."
          fi

          echo "exit_code=$SUMMARY_RC" >> "$GITHUB_OUTPUT"
          write_summary "$BODY"

      # ── Aggregate & comment ────────────────────────────────────
      - name: Collect results
        id: results
        if: always()
        env:
          THEME_CHECK_EXIT: ${{ steps.theme-check.outputs.exit_code }}
          RECONCILE_EXIT: ${{ steps.reconcile.outputs.exit_code }}
          SIZE_CHART_EXIT: ${{ steps.size-chart.outputs.exit_code }}
          PRODUCT_IMAGES_EXIT: ${{ steps.product-images.outputs.exit_code }}
          BLANK_INVENTORY_EXIT: ${{ steps.blank-inventory.outputs.exit_code }}
          SEO_REVIEW_EXIT: ${{ steps.seo-review.outputs.exit_code }}
          SKU_EXIT: ${{ steps.sku.outputs.exit_code }}
          SKU_TABLES_EXIT: ${{ steps.sku-tables.outputs.exit_code }}
          CATALOGUE_EXIT: ${{ steps.catalogue.outputs.exit_code }}
          APPLIQUE_GRID_EXIT: ${{ steps.applique-grid.outputs.exit_code }}
          EMAIL_ICONS_EXIT: ${{ steps.email-icons.outputs.exit_code }}
          BLANK_ID_GUARD_EXIT: ${{ steps.blank-id-guard.outputs.exit_code }}
          CONTRAST_EXIT: ${{ steps.contrast.outputs.exit_code }}
          A11Y_EXIT: ${{ steps.a11y.outputs.exit_code }}
          A11Y_STATE: ${{ steps.a11y-config.outputs.preview_state }}
          SMOKE_TEST_EXIT: ${{ steps.smoke-test.outputs.exit_code }}
          ACTIONLINT_EXIT: ${{ steps.actionlint.outputs.exit_code }}
          ZIZMOR_EXIT: ${{ steps.zizmor.outputs.exit_code }}
          GITLEAKS_EXIT: ${{ steps.gitleaks.outputs.exit_code }}
        run: |
          PASS=0; FAIL=0; SKIP=0; SKIP_BY_DESIGN=0
          classify() {
            if [ -z "$1" ]; then
              SKIP=$((SKIP + 1))
            elif [ "$1" = "0" ]; then
              PASS=$((PASS + 1))
            else
              FAIL=$((FAIL + 1))
            fi
          }
          for code in "$THEME_CHECK_EXIT" "$RECONCILE_EXIT" "$SIZE_CHART_EXIT" "$PRODUCT_IMAGES_EXIT" "$BLANK_INVENTORY_EXIT" "$SKU_EXIT" "$SKU_TABLES_EXIT" "$CATALOGUE_EXIT" "$SEO_REVIEW_EXIT" "$APPLIQUE_GRID_EXIT" "$EMAIL_ICONS_EXIT" "$BLANK_ID_GUARD_EXIT" "$CONTRAST_EXIT" "$SMOKE_TEST_EXIT" "$ACTIONLINT_EXIT" "$ZIZMOR_EXIT" "$GITLEAKS_EXIT"; do
            classify "$code"
          done
          # The a11y audit is the one check that can be absent BY DESIGN: draft
          # and Dependabot PRs get no preview theme, so there is nothing to
          # audit. It writes exit_code=0 in that state on purpose, because a
          # required context that goes red (or skips) would block those PRs
          # forever. Counting that 0 as a PASS is what made a skipped-by-design
          # audit render as "All checks passed". Count it as a skip instead,
          # and record that the skip was EXPECTED so the banner reports it
          # without telling the operator to go investigate.
          #
          # The exit code is required as well as the state. `Check for failures`
          # fails closed on an empty A11Y_EXIT, so keying the reassuring banner
          # on the state alone would let the comment say "all runnable checks
          # passed" on a job that then went red because the audit step never
          # recorded a result. An empty code falls through to `classify` and
          # surfaces as an unexplained skip, which is what it is.
          if [ "${A11Y_STATE:-}" = "skipped" ] && [ "${A11Y_EXIT:-}" = "0" ]; then
            SKIP=$((SKIP + 1))
            SKIP_BY_DESIGN=$((SKIP_BY_DESIGN + 1))
          else
            classify "$A11Y_EXIT"
          fi
          TOTAL=$((PASS + FAIL + SKIP))
          {
            echo "pass=$PASS"
            echo "fail=$FAIL"
            echo "skip=$SKIP"
            echo "skip_by_design=$SKIP_BY_DESIGN"
            echo "total=$TOTAL"
          } >> "$GITHUB_OUTPUT"

      - name: Post PR comment
        if: always()
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PASS_COUNT: ${{ steps.results.outputs.pass }}
          FAIL_COUNT: ${{ steps.results.outputs.fail }}
          SKIP_COUNT: ${{ steps.results.outputs.skip }}
          SKIP_BY_DESIGN_COUNT: ${{ steps.results.outputs.skip_by_design }}
          TOTAL_COUNT: ${{ steps.results.outputs.total }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
          THEME_CHECK_EXIT: ${{ steps.theme-check.outputs.exit_code }}
          RECONCILE_EXIT: ${{ steps.reconcile.outputs.exit_code }}
          SIZE_CHART_EXIT: ${{ steps.size-chart.outputs.exit_code }}
          PRODUCT_IMAGES_EXIT: ${{ steps.product-images.outputs.exit_code }}
          BLANK_INVENTORY_EXIT: ${{ steps.blank-inventory.outputs.exit_code }}
          SEO_REVIEW_EXIT: ${{ steps.seo-review.outputs.exit_code }}
          SKU_EXIT: ${{ steps.sku.outputs.exit_code }}
          SKU_TABLES_EXIT: ${{ steps.sku-tables.outputs.exit_code }}
          CATALOGUE_EXIT: ${{ steps.catalogue.outputs.exit_code }}
          APPLIQUE_GRID_EXIT: ${{ steps.applique-grid.outputs.exit_code }}
          EMAIL_ICONS_EXIT: ${{ steps.email-icons.outputs.exit_code }}
          BLANK_ID_GUARD_EXIT: ${{ steps.blank-id-guard.outputs.exit_code }}
          CONTRAST_EXIT: ${{ steps.contrast.outputs.exit_code }}
          A11Y_EXIT: ${{ steps.a11y.outputs.exit_code }}
          A11Y_STATE: ${{ steps.a11y-config.outputs.preview_state }}
          A11Y_SUMMARY: ${{ steps.a11y.outputs.summary }}
          SMOKE_TEST_EXIT: ${{ steps.smoke-test.outputs.exit_code }}
          ACTIONLINT_EXIT: ${{ steps.actionlint.outputs.exit_code }}
          ZIZMOR_EXIT: ${{ steps.zizmor.outputs.exit_code }}
          GITLEAKS_EXIT: ${{ steps.gitleaks.outputs.exit_code }}
          THEME_CHECK_OUTPUT: ${{ steps.theme-check.outputs.output }}
          RECONCILE_OUTPUT: ${{ steps.reconcile.outputs.output }}
          SIZE_CHART_OUTPUT: ${{ steps.size-chart.outputs.output }}
          PRODUCT_IMAGES_OUTPUT: ${{ steps.product-images.outputs.output }}
          BLANK_INVENTORY_OUTPUT: ${{ steps.blank-inventory.outputs.output }}
          SEO_REVIEW_OUTPUT: ${{ steps.seo-review.outputs.output }}
          SKU_OUTPUT: ${{ steps.sku.outputs.output }}
          SKU_TABLES_OUTPUT: ${{ steps.sku-tables.outputs.output }}
          CATALOGUE_OUTPUT: ${{ steps.catalogue.outputs.output }}
          CATALOGUE_FAILING: ${{ steps.catalogue.outputs.failing_checks }}
          APPLIQUE_GRID_OUTPUT: ${{ steps.applique-grid.outputs.output }}
          EMAIL_ICONS_OUTPUT: ${{ steps.email-icons.outputs.output }}
          BLANK_ID_GUARD_OUTPUT: ${{ steps.blank-id-guard.outputs.output }}
          CONTRAST_OUTPUT: ${{ steps.contrast.outputs.output }}
          SMOKE_TEST_OUTPUT: ${{ steps.smoke-test.outputs.output }}
          ACTIONLINT_OUTPUT: ${{ steps.actionlint.outputs.output }}
          ZIZMOR_OUTPUT: ${{ steps.zizmor.outputs.output }}
          GITLEAKS_OUTPUT: ${{ steps.gitleaks.outputs.output }}
        with:
          script: |
            const marker = '<!-- ci-results -->';
            const sha = (process.env.PR_SHA || '').substring(0, 7);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const pass = process.env.PASS_COUNT;
            const fail = process.env.FAIL_COUNT;
            const skip = process.env.SKIP_COUNT;
            // Skips split two ways. A by-design skip (the dynamic a11y audit
            // on a draft or Dependabot PR, where no preview theme exists) is
            // expected and must still be VISIBLE: it used to be counted as a
            // pass, so the banner read "All checks passed" over an audit that
            // never ran. An unexplained skip still means a step stopped
            // recording a result, which is the case worth investigating.
            const byDesign = Number(process.env.SKIP_BY_DESIGN_COUNT || 0);
            const unexplained = Number(skip || 0) - byDesign;
            const banner = fail !== '0'
              ? `❌ **${fail} Failure(s).** Please review the details below.`
              : unexplained > 0
                ? `⚠️ **${unexplained} skipped.** Every check should run; investigate why.`
                : byDesign > 0
                  ? '✅ **All runnable checks passed, but the dynamic a11y audit did not run.** Draft and Dependabot PRs get no preview theme, so there was nothing to audit; only the static contrast lint covered accessibility here. Comment `deploy` to deploy and merge.'
                  : '✅ **All checks passed.** Comment `deploy` to deploy and merge.';

            const status = (code) => {
              if (!code || code === '') return '⏭️';
              return code === '0' ? '✅' : '❌';
            };

            const sanitize = (s) => (s || '').replace(/`{3,}/g, '``').replace(/<\/?details>/gi, '');

            const themeCheck = process.env.THEME_CHECK_EXIT;
            const reconcile = process.env.RECONCILE_EXIT;
            const sizeChart = process.env.SIZE_CHART_EXIT;
            const productImages = process.env.PRODUCT_IMAGES_EXIT;
            const blankInventory = process.env.BLANK_INVENTORY_EXIT;
            const sku = process.env.SKU_EXIT;
            const skuTables = process.env.SKU_TABLES_EXIT;
            const catalogue = process.env.CATALOGUE_EXIT;
            const seoReview = process.env.SEO_REVIEW_EXIT;
            const appliqueGrid = process.env.APPLIQUE_GRID_EXIT;
            const emailIcons = process.env.EMAIL_ICONS_EXIT;
            const blankIdGuard = process.env.BLANK_ID_GUARD_EXIT;
            const contrast = process.env.CONTRAST_EXIT;
            const a11y = process.env.A11Y_EXIT;
            const a11yState = process.env.A11Y_STATE;
            const smokeTest = process.env.SMOKE_TEST_EXIT;
            const actionlint = process.env.ACTIONLINT_EXIT;
            const zizmor = process.env.ZIZMOR_EXIT;
            const gitleaks = process.env.GITLEAKS_EXIT;

            const themeCheckOut = sanitize(process.env.THEME_CHECK_OUTPUT) || 'No issues found';
            const reconcileOut = sanitize(process.env.RECONCILE_OUTPUT) || 'No output';
            const sizeChartOut = sanitize(process.env.SIZE_CHART_OUTPUT) || 'No output';
            const productImagesOut = sanitize(process.env.PRODUCT_IMAGES_OUTPUT) || 'No output';
            const blankInventoryOut = sanitize(process.env.BLANK_INVENTORY_OUTPUT) || 'No output';
            const skuOut = sanitize(process.env.SKU_OUTPUT) || 'No output';
            const skuTablesOut = sanitize(process.env.SKU_TABLES_OUTPUT) || 'No output';
            const catalogueOut = sanitize(process.env.CATALOGUE_OUTPUT) || 'No output';
            // Which cohesion check failed, for the summary row. Sanitized like every other
            // PR-controlled string here, then trimmed to a table cell's worth: it is rendered inside
            // a Markdown table, where an unescaped pipe would split the row.
            const catalogueFailing = sanitize(process.env.CATALOGUE_FAILING || '').replace(/\|/g, '/').slice(0, 200);
            const seoReviewOut = sanitize(process.env.SEO_REVIEW_OUTPUT) || 'No output';
            const appliqueGridOut = sanitize(process.env.APPLIQUE_GRID_OUTPUT) || 'No output';
            const emailIconsOut = sanitize(process.env.EMAIL_ICONS_OUTPUT) || 'No output';
            const blankIdGuardOut = sanitize(process.env.BLANK_ID_GUARD_OUTPUT) || 'No output';
            const contrastOut = sanitize(process.env.CONTRAST_OUTPUT) || 'No output';
            // NOT run through sanitize(): the a11y summary is markdown built
            // and sanitised by scripts/a11y/summarize-pa11y.mjs (its per-URL
            // <details> blocks are intentional and sanitize() would strip
            // them). Re-apply the fence guard and a length cap anyway; this is
            // the last hop before page-derived text becomes a comment, and the
            // full body must leave room for the rest of the report under
            // GitHub's 65536-character limit.
            //
            // The cap must cut at a per-URL block boundary, never mid-block: a
            // blind slice can drop a closing ``` fence, and the dangling open
            // fence then swallows every later section of the report into one
            // code block (observed on the first run of this layout). Fall back
            // to a blind cut WITH explicit closers only if no boundary exists.
            //
            // Those closers are computed, not fixed. A fixed '```' + '</details>'
            // pair assumed the cut landed inside both; when it did not, the
            // spurious </details> closed the WRAPPER around this whole section
            // and spilled every later section out of it, which is the same
            // class of bug the boundary cut exists to prevent.
            const closeDangling = (text) => {
              // Drop the partial final line first: a cut mid-tag ('<detai') or
              // mid-fence is not something the counters below can reason about.
              const nl = text.lastIndexOf('\n');
              const kept = nl > 0 ? text.slice(0, nl) : text.replace(/<[^>]*$/, '');
              const lines = kept.split('\n');
              const closers = [];
              if (lines.filter((l) => l.trim() === '```').length % 2 === 1) closers.push('```');
              const opens = (kept.match(/<details/g) || []).length;
              const closed = (kept.match(/<\/details>/g) || []).length;
              for (let i = 0; i < opens - closed; i += 1) closers.push('</details>');
              return [kept, ...closers].join('\n');
            };
            let a11ySummary = (process.env.A11Y_SUMMARY || '_No report produced._')
              .replace(/`{4,}/g, '```');
            const A11Y_CAP = 30000;
            if (a11ySummary.length > A11Y_CAP) {
              const closer = '</details>';
              const cut = a11ySummary.lastIndexOf(closer, A11Y_CAP);
              a11ySummary = (cut > 0
                ? a11ySummary.slice(0, cut + closer.length)
                : closeDangling(a11ySummary.slice(0, A11Y_CAP)))
                + '\n\n_Truncated to fit the comment; see the A11y audit step in the run log for the full report._';
            }
            const smokeTestOut = sanitize(process.env.SMOKE_TEST_OUTPUT) || 'No output';
            const actionlintOut = sanitize(process.env.ACTIONLINT_OUTPUT) || 'No issues found';
            const zizmorOut = sanitize(process.env.ZIZMOR_OUTPUT) || 'No issues found';
            const gitleaksOut = sanitize(process.env.GITLEAKS_OUTPUT) || 'No issues found';

            const head = [
              marker,
              `# CI Report`,
              '',
              banner,
              '',
              `**Commit:** \`${sha}\` | **Run:** [#${context.runNumber}](${runUrl}) | **Results:** ${pass} passed, ${fail} failed, ${skip} skipped`,
              '',
              '---',
              '',
              '### Theme',
              '',
              `| Check | Tool | Result |`,
              `|:------|:-----|:------:|`,
              `| **Theme Check** | \`shopify theme check --fail-level error\` | ${status(themeCheck)} |`,
              `| **Reconcile** | \`git cherry HEAD origin/shopify-sync\` | ${status(reconcile)} |`,
              `| **A11y audit** | \`pa11y-ci\` (axe, WCAG 2.1 AA) vs preview theme | ${a11yState === 'skipped' ? '⏭️ (no preview)' : status(a11y)} |`,
              '',
              '### Tooling',
              '',
              `| Check | Tool | Result |`,
              `|:------|:-----|:------:|`,
              `| **Size chart** | \`npm run size-chart:test\` | ${status(sizeChart)} |`,
              `| **Product images** | \`npm run lib:test\` + \`npm run images:test\` | ${status(productImages)} |`,
              `| **Blank inventory** | \`npm run blank-inventory:test\` | ${status(blankInventory)} |`,
              `| **SKU** | \`npm run sku:test\` | ${status(sku)} |`,
              `| **SKU tables** | \`npm run sku:tables\` | ${status(skuTables)} |`,
              `| **Catalogue manifest** | \`npm run catalogue:lint\` + tests${catalogueFailing ? `; ${catalogueFailing}` : ''} | ${status(catalogue)} |`,
              `| **SEO review** | \`npm run seo-review:test\` | ${status(seoReview)} |`,
              `| **Applique grid** | \`npm run applique-grid:test\` | ${status(appliqueGrid)} |`,
              `| **Email icons** | \`npm run email-icons:test\` | ${status(emailIcons)} |`,
              `| **Blank id guard** | \`npm run blank-inventory:guard\` | ${status(blankIdGuard)} |`,
              `| **Contrast + a11y** | \`npm run contrast:lint\` + tests | ${status(contrast)} |`,
              `| **Deploy smoke** | \`npm run smoke:test\` | ${status(smokeTest)} |`,
              '',
              '### Workflows',
              '',
              `| Check | Tool | Result |`,
              `|:------|:-----|:------:|`,
              `| **Lint** | \`actionlint + shellcheck\` | ${status(actionlint)} |`,
              `| **Security audit** | \`zizmor --pedantic\` | ${status(zizmor)} |`,
              '',
              '### Security',
              '',
              `| Check | Tool | Result |`,
              `|:------|:-----|:------:|`,
              `| **Secret Scan** | \`gitleaks\` (full history) | ${status(gitleaks)} |`,
              '',
              '---',
              '',
            ];

            // Detail blocks are data, not literals, so the assembler below can
            // degrade them individually when the whole body would exceed
            // GitHub's comment limit. `raw: true` means the content is already
            // markdown carrying its own fences and <details> (only the a11y
            // summary, pre-sanitised by scripts/a11y/summarize-pa11y.mjs);
            // everything else is command output and goes inside a fence.
            const details = [
              { title: 'Theme Check', tool: 'shopify theme check', out: themeCheckOut, exit: themeCheck },
              { title: 'Reconcile', tool: 'git cherry', out: reconcileOut, exit: reconcile },
              { title: 'A11y audit', tool: 'pa11y-ci against the preview theme', out: a11ySummary, exit: a11y, raw: true },
              { title: 'Size chart', tool: 'npm run size-chart:test', out: sizeChartOut, exit: sizeChart },
              { title: 'Product images', tool: 'npm run lib:test + npm run images:test', out: productImagesOut, exit: productImages },
              { title: 'Blank inventory', tool: 'npm run blank-inventory:test', out: blankInventoryOut, exit: blankInventory },
              { title: 'SKU', tool: 'npm run sku:test', out: skuOut, exit: sku },
              { title: 'SKU tables', tool: 'npm run sku:tables', out: skuTablesOut, exit: skuTables },
              { title: 'Catalogue manifest', tool: 'npm run catalogue:lint + tests', out: catalogueOut, exit: catalogue },
              { title: 'SEO review', tool: 'npm run seo-review:test', out: seoReviewOut, exit: seoReview },
              { title: 'Applique grid', tool: 'npm run applique-grid:test', out: appliqueGridOut, exit: appliqueGrid },
              { title: 'Email icons', tool: 'npm run email-icons:test', out: emailIconsOut, exit: emailIcons },
              { title: 'Blank id guard', tool: 'npm run blank-inventory:guard', out: blankIdGuardOut, exit: blankIdGuard },
              { title: 'Contrast + a11y', tool: 'npm run contrast:lint + tests', out: contrastOut, exit: contrast },
              { title: 'Deploy smoke', tool: 'npm run smoke:test', out: smokeTestOut, exit: smokeTest },
              { title: 'Workflow Lint', tool: 'actionlint + shellcheck', out: actionlintOut, exit: actionlint },
              { title: 'Workflow Security Audit', tool: 'zizmor --pedantic', out: zizmorOut, exit: zizmor },
              { title: 'Secret Scan', tool: 'gitleaks', out: gitleaksOut, exit: gitleaks },
            ];

            const summaryLine = (d) =>
              `<details><summary><strong>${d.title}</strong> (<code>${d.tool}</code>)</summary>`;
            // Every branch emits a matched <details> ... </details> and, when
            // fenced, a matched pair of ``` lines. Nothing here ever slices
            // mid-block, which is the failure that let one dangling fence
            // swallow the rest of the report.
            const render = (d) => d.dropped
              ? [summaryLine(d), '', '_Detail omitted to keep this comment under GitHub\'s 65536-character limit; see the run log._', '', '</details>', '']
              : d.raw
                ? [summaryLine(d), '', d.out, '', '</details>', '']
                : [summaryLine(d), '', '```', d.out, '```', '', '</details>', ''];

            const assemble = () => head.concat(details.flatMap(render)).join('\n');

            // GitHub hard-rejects a body over 65536 characters with a 422, and
            // a failed upsert masks the very result it was reporting. The a11y
            // section has its own 30k cap above, but that is one section: a run
            // where several checks fail loudly can blow the total on its own.
            const MAX_COMMENT = 60000;
            let body = assemble();
            if (body.length > MAX_COMMENT) {
              // Drop PASSING sections first, largest first, so the detail a
              // reader actually needs (a failing check's output) survives
              // longest. Banner and tables are in `head` and are never dropped.
              // A passing a11y section is usually the largest block in the
              // report, so plain largest-first would bin the only accessibility
              // evidence in the comment before anything else; it sorts last
              // among passing blocks instead.
              const order = details
                .map((d) => ({
                  d,
                  len: render(d).join('\n').length,
                  failed: d.exit && d.exit !== '0' ? 1 : 0,
                  lastResort: d.title === 'A11y audit' ? 1 : 0,
                }))
                .sort((a, b) => (a.failed - b.failed) || (a.lastResort - b.lastResort) || (b.len - a.len));
              for (const { d } of order) {
                if (body.length <= MAX_COMMENT) break;
                d.dropped = true;
                body = assemble();
              }
              // Unreachable in practice (head plus 14 placeholders is a few
              // kB), but never post something the API will reject.
              if (body.length > MAX_COMMENT) {
                body = `${head.join('\n')}\n\n_All detail blocks omitted; this report exceeded GitHub's comment size limit. See the run log._`;
              }
            }

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

            // Cleanup any stale single-purpose comments left behind from the
            // pre-aggregator era (they are now folded into <!-- ci-results -->).
            const stale = comments.filter(c =>
              c.body && (
                c.body.includes('<!-- validation-results -->') ||
                c.body.includes('<!-- sapphire-reconcile-bot -->') ||
                c.body.includes('<!-- a11y -->')
              )
            );
            for (const c of stale) {
              try {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: c.id,
                });
              } catch (_) { /* swallowed */ }
            }

      # ── Final status gate ──────────────────────────────────────
      - name: Check for failures
        if: always()
        env:
          THEME_CHECK_EXIT: ${{ steps.theme-check.outputs.exit_code }}
          RECONCILE_EXIT: ${{ steps.reconcile.outputs.exit_code }}
          SIZE_CHART_EXIT: ${{ steps.size-chart.outputs.exit_code }}
          PRODUCT_IMAGES_EXIT: ${{ steps.product-images.outputs.exit_code }}
          BLANK_INVENTORY_EXIT: ${{ steps.blank-inventory.outputs.exit_code }}
          SEO_REVIEW_EXIT: ${{ steps.seo-review.outputs.exit_code }}
          SKU_EXIT: ${{ steps.sku.outputs.exit_code }}
          SKU_TABLES_EXIT: ${{ steps.sku-tables.outputs.exit_code }}
          CATALOGUE_EXIT: ${{ steps.catalogue.outputs.exit_code }}
          APPLIQUE_GRID_EXIT: ${{ steps.applique-grid.outputs.exit_code }}
          EMAIL_ICONS_EXIT: ${{ steps.email-icons.outputs.exit_code }}
          BLANK_ID_GUARD_EXIT: ${{ steps.blank-id-guard.outputs.exit_code }}
          CONTRAST_EXIT: ${{ steps.contrast.outputs.exit_code }}
          A11Y_EXIT: ${{ steps.a11y.outputs.exit_code }}
          SMOKE_TEST_EXIT: ${{ steps.smoke-test.outputs.exit_code }}
          ACTIONLINT_EXIT: ${{ steps.actionlint.outputs.exit_code }}
          ZIZMOR_EXIT: ${{ steps.zizmor.outputs.exit_code }}
          GITLEAKS_EXIT: ${{ steps.gitleaks.outputs.exit_code }}
        run: |
          # An empty code fails closed. Every step above is `set +e` and always
          # writes its code, so this is near-unreachable today; it covers the
          # case where one stops doing so. It includes `gitleaks`, where a
          # secret scan that silently never recorded a result must not merge
          # green on a warning.
          check_exit() {
            local name="$1" code="$2"
            if [ -z "$code" ]; then
              echo "::error::${name} recorded no exit code (step skipped or never wrote one)"
              FAILED=1
            elif [ "$code" != "0" ]; then
              echo "::error::${name} failed"
              FAILED=1
            fi
          }

          FAILED=0
          check_exit "theme-check" "$THEME_CHECK_EXIT"
          check_exit "reconcile" "$RECONCILE_EXIT"
          check_exit "size-chart" "$SIZE_CHART_EXIT"
          check_exit "product-images" "$PRODUCT_IMAGES_EXIT"
          check_exit "blank-inventory" "$BLANK_INVENTORY_EXIT"
          check_exit "sku" "$SKU_EXIT"
          check_exit "sku-tables" "$SKU_TABLES_EXIT"
          check_exit "catalogue" "$CATALOGUE_EXIT"
          check_exit "seo-review" "$SEO_REVIEW_EXIT"
          check_exit "applique-grid" "$APPLIQUE_GRID_EXIT"
          check_exit "email-icons" "$EMAIL_ICONS_EXIT"
          check_exit "blank-id-guard" "$BLANK_ID_GUARD_EXIT"
          check_exit "contrast" "$CONTRAST_EXIT"
          # 0 when the audit passed OR when deploy-preview was skipped by
          # design (draft / Dependabot); 1 when the audit found errors or the
          # preview deploy failed. Empty fails closed like every other check.
          check_exit "a11y" "$A11Y_EXIT"
          check_exit "smoke-test" "$SMOKE_TEST_EXIT"
          check_exit "actionlint + shellcheck" "$ACTIONLINT_EXIT"
          check_exit "zizmor" "$ZIZMOR_EXIT"
          check_exit "gitleaks" "$GITLEAKS_EXIT"
          if [ "$FAILED" -eq 1 ]; then
            exit 1
          fi
