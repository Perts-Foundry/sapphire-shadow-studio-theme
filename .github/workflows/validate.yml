# WARNING: dependabot-auto-deploy.yml and shopify-sync-auto-deploy.yml trigger
# on this exact workflow name (`workflow_run.workflows: ["validate"]`).
# Renaming will silently break auto-deploy.
#
# Five jobs:
#   theme-check        - Shopify theme linter.
#   pr-reconcile-check - Enforces the shopify-sync-merged invariant.
#   lint-workflows     - actionlint + zizmor on .github/workflows + .github/actions.
#                        Always runs (so it is requireable as a branch-protection check).
#   secret-scan        - Gitleaks against the full git history.
#   aggregate          - Posts the single sticky validation report comment. Not a gate.
#
# Token-bearing workflows (deploy.yml, preview.yml, drift-watch.yml, both
# auto-deploys) live in separate files; this workflow holds no Shopify token.
#
# Fork PRs are excluded from every job. Validate is the gating check on `main`,
# and forks were never part of the deploy chain (preview.yml already excludes
# them). Excluding them here also defends against gitleaks --log-opts="--all"
# being polluted by a deep fake history.
name: validate

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions: {}

concurrency:
  group: validate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  theme-check:
    name: theme-check
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Run Theme Check
        uses: Shopify/theme-check-action@58fd69afdfc30110f997ba9e212b302671e00d3b # v2.2.0
        with:
          theme_root: '.'
          base: main
          token: ${{ github.token }}
          flags: --fail-level error

  pr-reconcile-check:
    name: pr-reconcile-check
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      # Untrusted PR-head checkout is safe here because: (1) this job has no
      # Shopify token; (2) the only data flowing into the sticky comment is
      # `shopify-sync` commit metadata (trusted), not anything from the PR head;
      # (3) github-script reads variables via process.env, not ${{ }} interpolation.
      - name: Checkout PR head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Compute missing shopify-sync commits
        id: compute
        run: |
          set -euo pipefail
          git fetch --prune --no-tags origin shopify-sync main
          BASE=$(git merge-base HEAD origin/shopify-sync)
          # git cherry uses patch-id, so squash/rebase merges of shopify-sync into main are
          # correctly recognised as "applied" and don't show as unmerged.
          MISSING=$(git cherry HEAD origin/shopify-sync "$BASE" | grep -c '^+' || true)
          echo "missing=$MISSING" >> "$GITHUB_OUTPUT"
          if [ "$MISSING" -gt 0 ]; then
            {
              echo "commits<<EOF"
              git log --oneline HEAD..origin/shopify-sync
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Upsert sticky comment
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          MISSING: ${{ steps.compute.outputs.missing }}
          COMMITS: ${{ steps.compute.outputs.commits }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        with:
          script: |
            const marker = '<!-- sapphire-reconcile-bot -->';
            const missing = parseInt(process.env.MISSING || '0', 10);
            const commits = process.env.COMMITS || '';
            const prNumber = parseInt(process.env.PR_NUMBER, 10);
            const body = missing > 0
              ? `${marker}\n\n**Reconcile check: ${missing} commit(s) on \`shopify-sync\` are not in this branch.**\n\nUnmerged commits:\n\`\`\`\n${commits}\n\`\`\`\n\nResolve locally:\n\`\`\`bash\ngit fetch origin\ngit merge origin/shopify-sync\ngit push\n\`\`\``
              : `${marker}\n\nReconcile check: clean. No unmerged \`shopify-sync\` commits.`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              per_page: 100,
            });
            const existing = comments
              .filter(c => c.body && c.body.includes(marker))
              .sort((a, b) => a.id - b.id);
            const [keep, ...dupes] = existing;
            if (keep) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: keep.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }
            for (const dup of dupes) {
              await github.rest.issues.deleteComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: dup.id,
              });
            }

      - name: Fail if missing
        if: steps.compute.outputs.missing != '0'
        env:
          MISSING: ${{ steps.compute.outputs.missing }}
        run: |
          set -euo pipefail
          echo "::error::shopify-sync has ${MISSING} commit(s) not in this branch. See PR comment."
          exit 1

  lint-workflows:
    name: lint-workflows
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: actionlint
        env:
          # SC2016 = "Expressions don't expand in single quotes" - false-
          # positive on `printf 'literal-markdown-with-backticks %s\n' "$x"`
          # in drift-watch.yml and sync-reconcile.yml. Locally actionlint
          # passes; CI's actionlint integrates the shellcheck preinstalled on
          # ubuntu-24.04, which surfaces the info-level finding. Suppress
          # globally rather than annotating each call site.
          SHELLCHECK_OPTS: "-e SC2016"
        run: |
          set -euo pipefail
          bash <(curl --max-time 60 -sSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color

      - name: zizmor
        run: |
          set -euo pipefail
          python3 -m pip install --user --quiet "zizmor==1.5.2"
          # Scan workflows AND composite actions. zizmor only handles YAML, so
          # JS under .github/scripts (if/when added) is not covered here.
          ~/.local/bin/zizmor --pedantic --format=plain .github/workflows .github/actions

  secret-scan:
    name: secret-scan
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Full history is required for `gitleaks git --log-opts="--all"`.
          fetch-depth: 0
          persist-credentials: false

      - name: Install Gitleaks
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks

      - name: Run Gitleaks
        timeout-minutes: 5
        run: |
          set -euo pipefail
          gitleaks git --log-opts="--all" --no-banner

  aggregate:
    name: aggregate
    # `if: always()` so the aggregator runs even when one of the upstream jobs
    # failed (the comment is the user-facing summary). The aggregator does not
    # call setFailed; branch protection requires the four sub-jobs individually.
    if: always() && github.event.pull_request.head.repo.full_name == github.repository
    needs: [theme-check, pr-reconcile-check, lint-workflows, secret-scan]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Compose & post sticky validation report
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          THEME_CHECK_RESULT: ${{ needs.theme-check.result }}
          PR_RECONCILE_RESULT: ${{ needs.pr-reconcile-check.result }}
          LINT_WORKFLOWS_RESULT: ${{ needs.lint-workflows.result }}
          SECRET_SCAN_RESULT: ${{ needs.secret-scan.result }}
        with:
          script: |
            const marker = '<!-- validation-results -->';
            const prNumber = parseInt(process.env.PR_NUMBER, 10);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const checks = [
              ['theme-check', process.env.THEME_CHECK_RESULT],
              ['pr-reconcile-check', process.env.PR_RECONCILE_RESULT],
              ['lint-workflows', process.env.LINT_WORKFLOWS_RESULT],
              ['secret-scan', process.env.SECRET_SCAN_RESULT],
            ];

            const icon = (r) => r === 'success' ? ':white_check_mark:'
              : r === 'failure' ? ':x:'
              : r === 'cancelled' ? ':no_entry:'
              : r === 'skipped' ? ':next_track_button:'
              : ':grey_question:';

            // Treat any non-success as a failure for banner purposes.
            // `cancelled` and `failure` both mean "do not deploy"; `skipped`
            // for fork-PR paths is gated upstream and should not appear.
            const nonSuccess = checks.filter(([, r]) => r !== 'success').length;
            const banner = nonSuccess === 0
              ? '**All checks passed**; comment `deploy` to deploy and merge.'
              : `**${nonSuccess} check(s) did not succeed**; please review the table below.`;

            const rows = checks
              .map(([name, r]) => `| ${icon(r)} | \`${name}\` | ${r || 'unknown'} |`)
              .join('\n');

            const body = [
              marker,
              '## Validation report',
              '',
              banner,
              '',
              '| | Check | Result |',
              '|:-:|:--|:--|',
              rows,
              '',
              `[Workflow run](${runUrl})`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              per_page: 100,
            });
            const existing = comments
              .filter(c => c.body && c.body.includes(marker))
              .sort((a, b) => a.id - b.id);
            const [keep, ...dupes] = existing;
            if (keep) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: keep.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }
            for (const dup of dupes) {
              await github.rest.issues.deleteComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: dup.id,
              });
            }
