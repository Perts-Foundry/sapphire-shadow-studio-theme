# TEMPORARY diagnostic workflow. Trigger via the Actions tab or
# `gh workflow run diagnose-shopify-secrets.yml`. Delete after the
# 401-on-deploy-preview is resolved.
#
# Prints non-secret metadata about the shopify-deploy env's secrets:
# - token length (expected: 38 = "shpat_" + 32 hex chars)
# - token prefix (expected: "shpat_")
# - store length (expected: 38 = "sapphire-shadow-studio.myshopify.com")
# - store prefix and suffix (expected: "sapphi" / "fy.com")
# - SHA256 of each value (compare against re-hashing expected values
#   locally with `printf '%s' '<value>' | sha256sum | head -c12`)
# Then attempts `npx shopify theme list --json` and prints the
# Shopify-side error if any.
name: diagnose-shopify-secrets

on:
  workflow_dispatch:

permissions: {}

jobs:
  diagnose:
    name: diagnose
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: shopify-deploy
    permissions:
      contents: read
    env:
      SHOPIFY_CLI_TTY: "0"
      CI: "1"
      SHOPIFY_FLAG_NO_COLOR: "true"
    steps:
      - name: Print non-secret metadata
        env:
          SHOPIFY_CLI_THEME_TOKEN: ${{ secrets.SHOPIFY_CLI_THEME_TOKEN }}
          SHOPIFY_FLAG_STORE: ${{ secrets.SHOPIFY_FLAG_STORE }}
        run: |
          set +x
          set -uo pipefail
          # Length is a number; not redacted by the secret-masking layer.
          echo "token_length=${#SHOPIFY_CLI_THEME_TOKEN}"
          echo "token_prefix_first6=${SHOPIFY_CLI_THEME_TOKEN:0:6}"
          echo "store_length=${#SHOPIFY_FLAG_STORE}"
          echo "store_prefix_first6=${SHOPIFY_FLAG_STORE:0:6}"
          # Last 6 chars of the store handle (last 6 of the literal token would
          # leak entropy, so do not print).
          echo "store_suffix_last6=${SHOPIFY_FLAG_STORE: -6}"
          # 12-char SHA256 fingerprint - no value leak. Compare locally:
          #   printf '%s' 'shpat_<your_token>' | sha256sum | head -c12
          #   printf '%s' 'sapphire-shadow-studio.myshopify.com' | sha256sum | head -c12
          token_hash=$(printf '%s' "${SHOPIFY_CLI_THEME_TOKEN}" | sha256sum | head -c12)
          store_hash=$(printf '%s' "${SHOPIFY_FLAG_STORE}" | sha256sum | head -c12)
          echo "token_sha256_12=${token_hash}"
          echo "store_sha256_12=${store_hash}"
          # Detect trailing whitespace / newline (common copy-paste artifact).
          token_trimmed_len=$(printf '%s' "${SHOPIFY_CLI_THEME_TOKEN}" | sed 's/[[:space:]]\+$//' | wc -c)
          store_trimmed_len=$(printf '%s' "${SHOPIFY_FLAG_STORE}" | sed 's/[[:space:]]\+$//' | wc -c)
          echo "token_trimmed_length=${token_trimmed_len}"
          echo "store_trimmed_length=${store_trimmed_len}"

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"
          cache: npm

      - name: Install Shopify CLI
        run: npm ci --ignore-scripts

      - name: Attempt theme list
        env:
          SHOPIFY_CLI_THEME_TOKEN: ${{ secrets.SHOPIFY_CLI_THEME_TOKEN }}
          SHOPIFY_FLAG_STORE: ${{ secrets.SHOPIFY_FLAG_STORE }}
        run: |
          set +x
          set -uo pipefail
          npx shopify theme list --json && echo "AUTH OK" || echo "AUTH FAILED (see error above)"
