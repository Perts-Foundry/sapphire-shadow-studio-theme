# zizmor static-analysis configuration.
# https://docs.zizmor.sh/configuration/
#
# Suppressions are documented inline with the rationale; zizmor flags some
# triggers categorically, but the workflows that use them have explicit
# defence-in-depth applied. Anything new that needs a suppression should
# include a similar rationale comment.

rules:
  dangerous-triggers:
    ignore:
      # deploy.yml's workflow_run arm (auto-deploy for shopify-sync and
      # dependabot/** PRs). zizmor flags workflow_run categorically as
      # "almost always used insecurely"; the rule cannot evaluate the
      # mitigations. The actual defences in deploy.yml's gate job are:
      #
      #   - `Resolve trigger context` step calls actions.getWorkflowRun(run_id)
      #     and uses the returned head_sha (trustedSha) for every downstream
      #     API call. The event payload's head_sha is NOT consulted.
      #   - Re-asserts workflow_run.conclusion === 'success' from the
      #     getWorkflowRun response (defends against payload replay or
      #     mutation between trigger and execution).
      #   - HEAD-drift check: pr.head.sha === trustedSha plus
      #     repos.compareCommits(base: trustedSha, head: pr.head.sha) with
      #     status === 'identical'. Catches same-tree force-pushes as legit
      #     and divergent trees as suspicious.
      #   - Bot identity gate: verification.verified === true AND four
      #     login fields (commit.author.login, commit.committer.login,
      #     pull.user.login, plus the expected bot constant) all match.
      #     Git commit header fields are forgeable and not consulted.
      #   - For shopify-sync: auto-reconcile label present, manual-review
      #     label absent, no .github/ or layout/theme.liquid in diff,
      #     <1000 LOC, base-staleness check (main hasn't advanced).
      #   - For dependabot/**: manual-review label absent, no
      #     .github/{workflows,actions,scripts} in diff, major-version
      #     bumps require auto-deploy-major label, base-staleness check.
      #   - Defensive head_branch routing from the trusted source (not the
      #     event payload).
      #   - The deploy job (token-bearing) has needs: gate; if any gate
      #     step setFailed(), the deploy job never runs.
      - deploy.yml
