extends: theme-check:recommended
ignore:
  - node_modules/**
  # Shopify Email campaign templates (marketing/emails/). Pasted by hand into
  # the Shopify Email custom-code editor, never pushed to a theme. They use
  # email-only objects (unsubscribe_url, open_tracking_block, email.*) that do not
  # exist in a theme, so theme-check would flag every one as undefined.
  - marketing/**

# Suppressed checks (from THEME_CHECK_NON_ACTIONABLE.md)
JSONMissingBlock:
  # Disabled: Judge.me Reviews app blocks (shopify://apps/judge-me-reviews/...)
  # render at runtime; the checker cannot resolve them and emits 3 false-positive
  # errors. Re-enable if Judge.me is uninstalled.
  enabled: false

MatchingTranslations:
  # Disabled: Horizon ships a wide locale matrix (en, cs, da, de, es, fi, fr,
  # hr, it, ja, ko, lt, nb, nl, pl, pt, ro, ru, sk, sv, th, tr, vi, zh-CN,
  # zh-TW, ...). Shopify's translators add keys at different paces per
  # language, so non-English locale files legitimately lag behind
  # `en.default.json` between upstream merges. The newer Shopify CLI's
  # theme-check engine surfaces dozens of cross-locale key-mismatch errors
  # that are not actionable for a downstream theme; the older
  # Shopify/theme-check-action did not flag these (the rule was added or
  # promoted to error-level in a later engine version). Canonical source is
  # `en.default.json`; stale-but-non-empty translations in other locales
  # are acceptable.
  enabled: false

